<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTM Al-Muhajirin Wawonasa</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [activeMenu, setActiveMenu] = useState('home');

      const [keuangan, setKeuangan] = useState([
        { id: 1, tanggal: '2026-06-01', uraian: 'Saldo Awal Bulan', masuk: 5000000, keluar: 0, ketKeluar: '-', saldo: 5000000 },
        { id: 2, tanggal: '2026-06-05', uraian: 'Kotak Amal Jumat', masuk: 1250000, keluar: 0, ketKeluar: '-', saldo: 6250000 }
      ]);

      const [jamaahList, setJamaahList] = useState([
        { no_kk: '7171011234560001', nama: 'H. Abdullah', ktp: '7171011234560001', hp: '081234567890', alamat: 'Wawonasa Lingkungan I', jumlah: 4, anggota: 'H. Abdullah, Hj. Aminah, Ahmad, Fatimah' }
      ]);

      const [strukturBTM, setStrukturBTM] = useState({
        ketua: 'H. Abdullah',
        wakilKetua1: 'Drs. H. Rahman',
        wakilKetua2: 'Ir. H. M. Ali',
        sekretaris: 'Ahmad Fauzi, S.Pd',
        wakilSekretaris1: 'Muhammad Ridwan',
        wakilSekretaris2: 'Siti Rahma',
        bendahara: 'Hj. Aminah',
        wakilBendahara: 'Nurul Hidayah',
        ketuaPembangunan: 'H. Ibrahim',
        koordinatorIdarah: 'Ustadz Zulkifli',
        koordinatorRiyah: 'H. Usman',
        koordinatorImarah: 'Ustadz Harun'
      });

      const [profilMasjid, setProfilMasjid] = useState({
        nama: 'Masjid Al-Muhajirin Wawonasa',
        alamat: 'Kelurahan Wawonasa, Kecamatan Singkil, Kota Manado, Sulawesi Utara',
        koordinat: '1.4925° N, 124.8385° E'
      });

      const handleLogin = (username, password) => {
        if (username === 'super_admin' && password === '2026-2029') {
          setUser({ username, role: 'super_admin' });
        } else if (username === 'btm_masjid' && password === '2026-2029') {
          setUser({ username, role: 'btm' });
        } else if (username.trim() !== '' && password.trim() !== '') {
          setUser({ username, role: 'jamaah' });
        } else {
          alert('Username atau Password salah!');
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans flex flex-col">
          {!user ? (
            <LoginScreen onLogin={handleLogin} jamaahList={jamaahList} setJamaahList={setJamaahList} />
          ) : (
            <MainLayout 
              user={user} 
              onLogout={() => setUser(null)} 
              activeMenu={activeMenu} 
              setActiveMenu={setActiveMenu}
              keuangan={keuangan} setKeuangan={setKeuangan}
              jamaahList={jamaahList} setJamaahList={setJamaahList}
              strukturBTM={strukturBTM} setStrukturBTM={setStrukturBTM}
              profilMasjid={profilMasjid} setProfilMasjid={setProfilMasjid}
            />
          )}
        </div>
      );
    }

    function LoginScreen({ onLogin, jamaahList, setJamaahList }) {
      const [u, setU] = useState('');
      const [p, setP] = useState('');
      const [showRegister, setShowRegister] = useState(false);

      const [regNoKK, setRegNoKK] = useState('');
      const [regNama, setRegNama] = useState('');
      const [regKtp, setRegKtp] = useState('');
      const [regHp, setRegHp] = useState('');
      const [regAlamat, setRegAlamat] = useState('');
      const [regJumlah, setRegJumlah] = useState('');
      const [regAnggota, setRegAnggota] = useState('');
      const [regPassword, setRegPassword] = useState('');

      const handleRegistrasiMandiri = (e) => {
        e.preventDefault();
        const isExist = jamaahList.some(item => item.no_kk === regNoKK);
        if (isExist) {
          alert("Pendaftaran ditolak! Nomor KK tersebut sudah pernah didaftarkan dalam sistem.");
          return;
        }

        const newData = {
          no_kk: regNoKK,
          nama: regNama,
          ktp: regKtp,
          hp: regHp,
          alamat: regAlamat,
          jumlah: Number(regJumlah),
          anggota: regAnggota
        };

        setJamaahList([...jamaahList, newData]);
        alert("Registrasi Berhasil! Silakan masuk menggunakan Nomor KK atau Nama Anda sebagai Username.");
        setShowRegister(false);
        setRegNoKK(''); setRegNama(''); setRegKtp(''); setRegHp(''); setRegAlamat(''); setRegJumlah(''); setRegAnggota(''); setRegPassword('');
      };

      return (
        <div className="flex items-center justify-center min-h-screen bg-emerald-900 p-4">
          <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-yellow-500">
            <div className="text-center mb-6">
              <h1 className="text-xl font-bold text-emerald-900">BTM Al-Muhajirin Wawonasa</h1>
              <p className="text-xs text-gray-500">{showRegister ? 'Form Pendaftaran Akun Jamaah Baru' : 'Silakan masuk ke akun Anda'}</p>
            </div>

            {!showRegister ? (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Username / Akun Jamaah</label>
                  <input type="text" className="w-full p-3 border rounded-lg text-sm" placeholder="Masukkan Username / No KK" value={u} onChange={(e) => setU(e.target.value)} />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Password</label>
                  <input type="password" className="w-full p-3 border rounded-lg text-sm" placeholder="Masukkan Password" value={p} onChange={(e) => setP(e.target.value)} />
                </div>
                <button onClick={() => onLogin(u, p)} className="w-full bg-emerald-700 text-white p-3 rounded-lg font-bold hover:bg-emerald-800 transition">
                  Masuk Aplikasi
                </button>

                <div className="text-center mt-4">
                  <p className="text-sm text-gray-500">Belum punya akun jamaah?</p>
                  <button type="button" onClick={() => setShowRegister(true)} className="text-emerald-800 font-bold text-sm underline mt-1">
                    Daftar Akun Jamaah Baru
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handleRegistrasiMandiri} className="space-y-3">
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nomor KK (Wajib Unik)</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" placeholder="Nomor Kartu Keluarga" value={regNoKK} onChange={(e) => setRegNoKK(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nama Kepala Keluarga</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" placeholder="Nama Lengkap" value={regNama} onChange={(e) => setRegNama(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nomor KTP</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" placeholder="Nomor KTP" value={regKtp} onChange={(e) => setRegKtp(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nomor HP / WhatsApp</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" placeholder="08xxxxxxxxxx" value={regHp} onChange={(e) => setRegHp(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Alamat</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" placeholder="Alamat / Lingkungan" value={regAlamat} onChange={(e) => setRegAlamat(e.target.value)} required />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Jml Anggota</label>
                    <input type="number" className="w-full p-2.5 border rounded-lg text-sm" placeholder="Jumlah" value={regJumlah} onChange={(e) => setRegJumlah(e.target.value)} required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Buat Password</label>
                    <input type="password" className="w-full p-2.5 border rounded-lg text-sm" placeholder="Password" value={regPassword} onChange={(e) => setRegPassword(e.target.value)} required />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nama Anggota Keluarga</label>
                  <textarea className="w-full p-2.5 border rounded-lg text-sm" placeholder="Pisahkan dengan koma" value={regAnggota} onChange={(e) => setRegAnggota(e.target.value)} required />
                </div>
                <button type="submit" className="w-full bg-emerald-700 text-white p-2.5 rounded-lg font-bold hover:bg-emerald-800 transition text-sm">
                  Daftarkan Akun
                </button>
                <button type="button" onClick={() => setShowRegister(false)} className="w-full bg-gray-200 text-gray-700 p-2 rounded-lg font-bold hover:bg-gray-300 transition text-xs mt-2">
                  Kembali ke Menu Login
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function MainLayout({ user, onLogout, activeMenu, setActiveMenu, keuangan, setKeuangan, jamaahList, setJamaahList, strukturBTM, setStrukturBTM, profilMasjid, setProfilMasjid }) {
      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          <div className="w-full md:w-72 bg-emerald-950 text-white p-5 flex flex-col justify-between shadow-lg">
            <div>
              <div className="flex items-center space-x-3 mb-6 pb-4 border-b border-emerald-800">
                <div>
                  <h2 className="text-sm font-bold text-yellow-400">Al-Muhajirin Wawonasa</h2>
                  <p className="text-xs text-emerald-300 uppercase">Role: {user.role}</p>
                </div>
              </div>
              <ul className="space-y-1 text-sm">
                <li onClick={() => setActiveMenu('home')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'home' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Beranda & Profil Masjid</li>
                <li onClick={() => setActiveMenu('sholat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'sholat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Waktu Sholat Real-Time</li>
                <li onClick={() => setActiveMenu('quran')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'quran' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Al-Quran Digital (30 Juz)</li>
                <li onClick={() => setActiveMenu('zakat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'zakat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Kalkulator Zakat</li>
                <li onClick={() => setActiveMenu('kiblat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'kiblat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Arah Kiblat Digital</li>
                <li onClick={() => setActiveMenu('dzikir')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'dzikir' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Dzikir & Doa Harian</li>
                <li onClick={() => setActiveMenu('iqra')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'iqra' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Materi Iqra 1-6 (TPA)</li>
                <li onClick={() => setActiveMenu('struktur')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'struktur' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Struktur Pengurus BTM</li>
                <li onClick={() => setActiveMenu('keuangan')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'keuangan' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Keuangan Masjid</li>
                <li onClick={() => setActiveMenu('jamaah')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'jamaah' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Data Jamaah Masjid</li>
                {(user.role === 'jamaah' || user.role === 'super_admin') && (
                  <li onClick={() => setActiveMenu('reset')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'reset' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Reset Password</li>
                )}
              </ul>
            </div>
            <button onClick={onLogout} className="mt-6 bg-red-700 hover:bg-red-800 p-2.5 rounded-lg font-bold text-sm transition">Keluar Sistem</button>
          </div>

          <div className="flex-1 p-6 md:p-10 overflow-y-auto">
            <header className="flex justify-between items-center mb-6 pb-4 border-b">
              <h2 className="text-lg font-bold text-emerald-900 capitalize">{activeMenu.replace('_', ' ')}</h2>
              <span className="text-xs bg-emerald-100 text-emerald-800 font-semibold px-3 py-1 rounded-full">User: {user.username} ({user.role})</span>
            </header>

            {activeMenu === 'home' && <HomeModule profil={profilMasjid} user={user} setProfil={setProfilMasjid} />}
            {activeMenu === 'sholat' && <SholatModule />}
            {activeMenu === 'quran' && <QuranModule />}
            {activeMenu === 'zakat' && <ZakatModule />}
            {activeMenu === 'kiblat' && <KiblatModule />}
            {activeMenu === 'dzikir' && <DzikirModule />}
            {activeMenu === 'iqra' && <IqraModule />}
            {activeMenu === 'struktur' && <StrukturModule struktur={strukturBTM} setStruktur={setStrukturBTM} user={user} />}
            {activeMenu === 'keuangan' && <KeuanganModule keuangan={keuangan} setKeuangan={setKeuangan} user={user} />}
            {activeMenu === 'jamaah' && <JamaahModule jamaahList={jamaahList} setJamaahList={setJamaahList} user={user} />}
            {activeMenu === 'reset' && <ResetPasswordModule user={user} />}
          </div>
        </div>
      );
    }

    // --- MODUL QURAN LENGKAP 30 JUZ & PENCARIAN ---
    function QuranModule() {
      const [surahs, setSurahs] = useState([]);
      const [search, setSearch] = useState('');
      const [selectedSurah, setSelectedSurah] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('https://equran.id/api/v2/surat')
          .then(res => res.json())
          .then(data => {
            if (data && data.data) {
              setSurahs(data.data);
            }
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setLoading(false);
          });
      }, []);

      const fetchDetailSurah = (nomor) => {
        setLoading(true);
        fetch(`https://equran.id/api/v2/surat/${nomor}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.data) {
              setSelectedSurah(data.data);
            }
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setLoading(false);
          });
      };

      const filteredSurah = surahs.filter(s => 
        s.namaLatin.toLowerCase().includes(search.toLowerCase()) || 
        s.arti.toLowerCase().includes(search.toLowerCase()) ||
        String(s.nomor).includes(search)
      );

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-4">
          <div className="flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h3 className="text-xl font-bold text-emerald-900">Al-Quran Digital (30 Juz)</h3>
              <p className="text-xs text-gray-500">Pilih atau cari surah untuk membaca teks ayat dan terjemahan resmi Kemenag RI.</p>
            </div>
            {selectedSurah && (
              <button onClick={() => setSelectedSurah(null)} className="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-bold text-xs">
                &larr; Kembali ke Daftar Surah
              </button>
            )}
          </div>

          {!selectedSurah ? (
            <div className="space-y-4">
              <input 
                type="text" 
                placeholder="Cari nama surah (contoh: Al-Fatihah, Yasin, An-Nas)..." 
                className="w-full p-3 border rounded-lg text-sm"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />

              {loading ? (
                <p className="text-center py-8 text-emerald-800 font-semibold">Memuat daftar surah Al-Quran...</p>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 max-h-[550px] overflow-y-auto p-2">
                  {filteredSurah.map((surah) => (
                    <div 
                      key={surah.nomor} 
                      onClick={() => fetchDetailSurah(surah.nomor)}
                      className="p-4 bg-emerald-50 hover:bg-emerald-100 rounded-xl border border-emerald-200 cursor-pointer flex justify-between items-center transition"
                    >
                      <div>
                        <span className="text-xs font-bold text-emerald-700 bg-emerald-200 px-2 py-0.5 rounded-full">{surah.nomor}</span>
                        <h4 className="font-bold text-emerald-900 mt-1">{surah.namaLatin}</h4>
                        <p className="text-xs text-gray-600">{surah.arti} ({surah.jumlahAyat} Ayat)</p>
                      </div>
                      <span className="text-xl font-serif text-emerald-900 font-bold">{surah.nama}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : (
            <div className="space-y-6">
              <div className="p-6 bg-emerald-900 text-white rounded-2xl text-center shadow">
                <h3 className="text-2xl font-bold">{selectedSurah.namaLatin} ({selectedSurah.nama})</h3>
                <p className="text-sm text-emerald-200">{selectedSurah.arti} &bull; {selectedSurah.jumlahAyat} Ayat &bull; {selectedSurah.tempatRevelasi}</p>
                <p className="text-xs mt-2 italic text-emerald-300">{selectedSurah.deskripsi.replace(/(<([^>]+)>)/gi, "")}</p>
              </div>

              {loading ? (
                <p className="text-center py-8 text-emerald-800 font-semibold">Memuat ayat...</p>
              ) : (
                <div className="space-y-4 max-h-[600px] overflow-y-auto p-2">
                  {selectedSurah.ayat.map((item) => (
                    <div key={item.nomorAyat} className="p-5 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="w-8 h-8 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold text-xs">{item.nomorAyat}</span>
                      </div>
                      <p className="text-right font-serif text-2xl text-emerald-950 leading-loose">{item.teksArab}</p>
                      <p className="text-xs text-emerald-800 font-medium italic">{item.teksLatin}</p>
                      <p className="text-sm text-gray-700">Artinya: "{item.teksIndonesia}"</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // --- MODUL DZIKIR & DOA HARIAN LENGKAP + PENCARIAN ---
    function DzikirModule() {
      const [search, setSearch] = useState('');
      const daftarDoa = [
        { id: 1, kategori: 'Dzikir & Doa', judul: 'Dzikir Pagi', arab: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ', latin: 'Ashbahna wa ashbahal mulku lillah', arti: 'Kami telah memasuki waktu pagi dan kekuasaan hanya milik Allah.' },
        { id: 2, kategori: 'Dzikir & Doa', judul: 'Dzikir Petang', arab: 'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ', latin: 'Amsayna wa amsal mulku lillah', arti: 'Kami telah memasuki waktu petang dan kekuasaan hanya milik Allah.' },
        { id: 3, kategori: 'Doa Harian', judul: 'Doa Sebelum Makan', arab: 'اللَّهُمَّ بَارِك لنا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ', latin: 'Allahumma barik lana fima razaqtana wa qina adhaban nar', arti: 'Ya Allah, berkahilah kami dalam rezeki yang telah Engkau berikan dan peliharalah kami dari siksa api neraka.' },
        { id: 4, kategori: 'Doa Harian', judul: 'Doa Sesudah Makan', arab: 'الحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ', latin: 'Alhamdulillahilladhi athamana wasaqana wajaalana muslimin', arti: 'Segala puji bagi Allah yang telah memberi kami makan dan minum serta menjadikan kami termasuk orang-orang muslim.' },
        { id: 5, kategori: 'Doa Harian', judul: 'Doa Sebelum Tidur', arab: 'بِاسْمِكَ اللَّهُمَّ أَحْيَا وَأَمُوتُ', latin: 'Bismikallahumma ahya wa amuut', arti: 'Dengan nama-Mu ya Allah, aku hidup dan aku mati.' },
        { id: 6, kategori: 'Doa Harian', judul: 'Doa Bangun Tidur', arab: 'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', latin: 'Alhamdulillahilladhi ahyana ba’da ma amatana wailaihin nusyur', arti: 'Segala puji bagi Allah yang telah menghidupkan kami kembali setelah mematikan kami, dan kepada-Allah tempat kembali.' },
        { id: 7, kategori: 'Doa Harian', judul: 'Doa Masuk Kamar Mandi', arab: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ', latin: 'Allahumma inni audzubika minal khubuthi wal khabaith', arti: 'Ya Allah, sesungguhnya aku berlindung kepada-Mu dari segala kejahatan dan kotoran.' },

    function ZakatModule() {
      const [penghasilan, setPenghasilan] = useState('');
      const [hasilZakat, setHasilZakat] = useState(null);

      const hitungZakat = (e) => {
        e.preventDefault();
        const nominal = Number(penghasilan) || 0;
        const zakat = nominal >= 5000000 ? nominal * 0.025 : 0;
        setHasilZakat(zakat);
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-4 max-w-lg">
          <h3 className="text-xl font-bold text-emerald-900">Kalkulator Zakat Penghasilan</h3>
          <form onSubmit={hitungZakat} className="space-y-3">
            <div>
              <label className="block text-xs font-bold mb-1">Pendapatan Per Bulan (Rp)</label>
              <input type="number" className="w-full p-2.5 border rounded text-sm" placeholder="Contoh: 6000000" value={penghasilan} onChange={(e) => setPenghasilan(e.target.value)} required />
            </div>
            <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded text-sm font-bold">Hitung Zakat (2.5%)</button>
          </form>
          {hasilZakat !== null && (
            <div className="p-4 bg-emerald-50 rounded-lg border border-emerald-200">
              <p className="text-sm font-bold text-emerald-900">Zakat yang harus dikeluarkan:</p>
              <p className="text-lg font-extrabold text-emerald-700">Rp {hasilZakat.toLocaleString()}</p>
            </div>
          )}
        </div>
      );
    }

    function KeuanganModule({ keuangan, setKeuangan, user }) {
      const [uraian, setUraian] = useState('');
      const [masuk, setMasuk] = useState('');
      const [keluar, setKeluar] = useState('');
      const [ketKeluar, setKetKeluar] = useState('');

      const handleTambah = (e) => {
        e.preventDefault();
        const lastSaldo = keuangan.length > 0 ? keuangan[keuangan.length - 1].saldo : 0;
        const m = Number(masuk) || 0;
        const k = Number(keluar) || 0;
        const newSaldo = lastSaldo + m - k;

        const newRow = {
          id: keuangan.length + 1,
          tanggal: new Date().toISOString().split('T')[0],
          uraian,
          masuk: m,
          keluar: k,
          ketKeluar: k > 0 ? ketKeluar : '-',
          saldo: newSaldo
        };

        setKeuangan([...keuangan, newRow]);
        setUraian(''); setMasuk(''); setKeluar(''); setKetKeluar('');
        alert("Data keuangan berhasil ditambahkan!");
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-6">
          <div className="flex justify-between items-center">
            <h3 className="text-xl font-bold text-emerald-900">Laporan Keuangan Masjid</h3>
            <button onClick={() => alert("File Laporan Keuangan PDF berhasil diunduh.")} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold">Download PDF Keuangan</button>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full border-collapse border border-gray-200 text-sm">
              <thead>
                <tr className="bg-emerald-100 text-emerald-900">
                  <th className="border p-2">No</th>
                  <th className="border p-2">Hari/Tanggal</th>
                  <th className="border p-2">Uraian Kegiatan</th>
                  <th className="border p-2">Uang Masuk</th>
                  <th className="border p-2">Uang Keluar</th>
                  <th className="border p-2">Uraian Keluar</th>
                  <th className="border p-2">Saldo</th>
                </tr>
              </thead>
              <tbody>
                {keuangan.map((item, idx) => (
                  <tr key={item.id} className="text-center">
                    <td className="border p-2">{idx + 1}</td>
                    <td className="border p-2">{item.tanggal}</td>
                    <td className="border p-2 text-left">{item.uraian}</td>
                    <td className="border p-2 text-green-600 font-semibold">Rp {item.masuk.toLocaleString()}</td>
                    <td className="border p-2 text-red-600 font-semibold">Rp {item.keluar.toLocaleString()}</td>
                    <td className="border p-2">{item.ketKeluar}</td>
                    <td className="border p-2 font-bold">Rp {item.saldo.toLocaleString()}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {user.role === 'super_admin' && (
            <form onSubmit={handleTambah} className="bg-gray-50 p-4 rounded-xl border space-y-3">
              <h4 className="font-bold text-emerald-900 text-sm">Tambah Catatan Keuangan (Super Admin)</h4>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" placeholder="Uraian Kegiatan" className="p-2 border rounded text-sm" value={uraian} onChange={(e) => setUraian(e.target.value)} required />
                <input type="number" placeholder="Uang Masuk (Opsional)" className="p-2 border rounded text-sm" value={masuk} onChange={(e) => setMasuk(e.target.value)} />
                <input type="number" placeholder="Uang Keluar (Opsional)" className="p-2 border rounded text-sm" value={keluar} onChange={(e) => setKeluar(e.target.value)} />
                <input type="text" placeholder="Uraian Uang Keluar" className="p-2 border rounded text-sm" value={ketKeluar} onChange={(e) => setKetKeluar(e.target.value)} />
              </div>
              <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded text-xs font-bold">Simpan Transaksi Keuangan</button>
            </form>
          )}
        </div>
      );
    }

    function JamaahModule({ jamaahList, setJamaahList }) {
      const [search, setSearch] = useState('');
      const [noKK, setNoKK] = useState('');
      const [namaKepala, setNamaKepala] = useState('');
      const [noKtp, setNoKtp] = useState('');
      const [noHp, setNoHp] = useState('');
      const [alamat, setAlamat] = useState('');
      const [jumlahAnggota, setJumlahAnggota] = useState('');
      const [namaAnggota, setNamaAnggota] = useState('');

      const handleTambahJamaah = (e) => {
        e.preventDefault();
        const isExist = jamaahList.some(item => item.no_kk === noKK);
        if (isExist) {
          alert("Pendaftaran ditolak! Nomor KK tersebut sudah pernah didaftarkan dalam sistem.");
          return;
        }

        const newData = {
          no_kk: noKK,
          nama: namaKepala,
          ktp: noKtp,
          hp: noHp,
          alamat,
          jumlah: Number(jumlahAnggota),
          anggota: namaAnggota
        };

        setJamaahList([...jamaahList, newData]);
        setNoKK(''); setNamaKepala(''); setNoKtp(''); setNoHp(''); setAlamat(''); setJumlahAnggota(''); setNamaAnggota('');
        alert("Data keluarga jamaah berhasil didaftarkan!");
      };

      const filteredData = jamaahList.filter(item => 
        item.no_kk.toLowerCase().includes(search.toLowerCase()) ||
        item.nama.toLowerCase().includes(search.toLowerCase()) ||
        item.hp.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-6">
          <div className="flex justify-between items-center">
            <h3 className="text-xl font-bold text-emerald-900">Data Jamaah & Kartu Keluarga</h3>
            <button onClick={() => alert("Data Jamaah Masjid berhasil diunduh dalam bentuk PDF.")} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold">Download PDF Jamaah</button>
          </div>

          <div>
            <input 
              type="text" 
              placeholder="Cari berdasarkan No KK, Nama Kepala Keluarga, atau No HP/Wa..." 
              className="w-full p-3 border rounded-lg text-sm"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
            />
          </div>

          <div className="overflow-x-auto">
            <table className="w-full border-collapse border border-gray-200 text-sm">
              <thead>
                <tr className="bg-emerald-100 text-emerald-900">
                  <th className="border p-2">Nomor KK</th>
                  <th className="border p-2">Nama Kepala Keluarga</th>
                  <th className="border p-2">No KTP</th>
                  <th className="border p-2">No HP/Wa</th>
                  <th className="border p-2">Alamat</th>
                  <th className="border p-2">Jml Anggota</th>
                  <th className="border p-2">Anggota Keluarga</th>
                </tr>
              </thead>
              <tbody>
                {filteredData.map((item, idx) => (
                  <tr key={idx} className="text-center">
                    <td className="border p-2 font-semibold">{item.no_kk}</td>
                    <td className="border p-2">{item.nama}</td>
                    <td className="border p-2">{item.ktp}</td>
                    <td className="border p-2">{item.hp}</td>
                    <td className="border p-2">{item.alamat}</td>
                    <td className="border p-2">{item.jumlah}</td>
                    <td className="border p-2 text-left">{item.anggota}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <form onSubmit={handleTambahJamaah} className="bg-gray-50 p-6 rounded-xl border space-y-4">
            <h4 className="font-bold text-emerald-900">Form Tambah Data Keluarga Jamaah</h4>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input type="text" placeholder="Nomor KK" className="p-2.5 border rounded text-sm" value={noKK} onChange={(e) => setNoKK(e.target.value)} required />
              <input type="text" placeholder="Nama Kepala Keluarga" className="p-2.5 border rounded text-sm" value={namaKepala} onChange={(e) => setNamaKepala(e.target.value)} required />
              <input type="text" placeholder="Nomor KTP Kepala Keluarga" className="p-2.5 border rounded text-sm" value={noKtp} onChange={(e) => setNoKtp(e.target.value)} required />
              <input type="text" placeholder="Nomor HP/Wa" className="p-2.5 border rounded text-sm" value={noHp} onChange={(e) => setNoHp(e.target.value)} required />
              <input type="text" placeholder="Alamat" className="p-2.5 border rounded text-sm" value={alamat} onChange={(e) => setAlamat(e.target.value)} required />
              <input type="number" placeholder="Jumlah Anggota Keluarga" className="p-2.5 border rounded text-sm" value={jumlahAnggota} onChange={(e) => setJumlahAnggota(e.target.value)} required />
            </div>
            <textarea placeholder="Nama-nama Anggota Keluarga (Pisahkan dengan koma)" className="w-full p-2.5 border rounded text-sm" value={namaAnggota} onChange={(e) => setNamaAnggota(e.target.value)} required />
            <button type="submit" className="bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold">Tambah Data Keluarga</button>
          </form>
        </div>
      );
    }

    function StrukturModule({ struktur, setStruktur, user }) {
      const [edit, setEdit] = useState(false);
      const [form, setForm] = useState(struktur);

      const handleSave = (e) => {
        e.preventDefault();
        setStruktur(form);
        setEdit(false);
        alert("Struktur Pengurus BTM berhasil diperbarui!");
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-6">
          <div className="flex justify-between items-center">
            <h3 className="text-xl font-bold text-emerald-900">Struktur Badan Takmirul Masjid Al-Muhajirin Wawonasa</h3>
            {user.role === 'super_admin' && (
              <button onClick={() => setEdit(!edit)} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold">
                {edit ? 'Tutup Form' : 'Edit Struktur Pengurus'}
              </button>
            )}
          </div>

          {!edit ? (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              {Object.entries(struktur).map(([key, val]) => (
                <div key={key} className="p-3 bg-emerald-50 rounded-lg border border-emerald-200">
                  <strong className="capitalize text-emerald-900 block">{key.replace(/([A-Z])/g, ' $1')}</strong>
                  <span className="text-gray-700">{val}</span>
                </div>
              ))}
            </div>
          ) : (
            <form onSubmit={handleSave} className="space-y-4">
              <h4 className="font-bold text-emerald-900">Form Pengeditan Pengurus (Super Admin)</h4>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {Object.keys(struktur).map((key) => (
                  <div key={key}>
                    <label className="block text-xs font-bold capitalize mb-1">{key.replace(/([A-Z])/g, ' $1')}</label>
                    <input 
                      type="text" 
                      className="w-full p-2 border rounded text-sm" 
                      value={form[key]} 
                      onChange={(e) => setForm({ ...form, [key]: e.target.value })} 
                      required 
                    />
                  </div>
                ))}
              </div>
              <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Simpan Struktur Baru</button>
            </form>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
