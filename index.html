<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Masjid Al-Muhajirin Wawonasa</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen m-0 p-0">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
          const [user, setUser] = useState(null);
          const [activeMenu, setActiveMenu] = useState('home');
          const [currentTime, setCurrentTime] = useState(new Date());
          const [installPrompt, setInstallPrompt] = useState(null);
          const [showInstallBanner, setShowInstallBanner] = useState(false);

          useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            const handleBeforeInstallPrompt = (e) => {
              e.preventDefault();
              setInstallPrompt(e);
              setShowInstallBanner(true);
            };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = () => {
            if (installPrompt) {
              installPrompt.prompt();
              installPrompt.userChoice.then((choiceResult) => {
                setInstallPrompt(null);
                setShowInstallBanner(false);
              });
            } else {
              alert('Untuk menginstal aplikasi ini ke layar utama HP:\n1. Ketuk ikon titik tiga (menu) di browser Anda.\n2. Pilih "Tambahkan ke Layar Utama" (Add to Home Screen).');
              setShowInstallBanner(false);
            }
          };

          const [keuangan, setKeuangan] = useState([
            { id: 1, tanggal: '2026-06-01', uraian: 'Saldo Awal Bulan', masuk: 5000000, keluar: 0, saldo: 5000000 },
            { id: 2, tanggal: '2026-06-05', uraian: 'Kotak Amal Jumat', masuk: 1250000, keluar: 0, saldo: 6250000 }
          ]);

          const [jamaahList, setJamaahList] = useState([
            { no_kk: '7171011234560001', nama: 'H. Abdullah', ktp: '7171011234560001', hp: '081234567890', alamat: 'Wawonasa Lingkungan I', jumlah: 4, anggota: 'H. Abdullah, Hj. Aminah, Ahmad, Fatimah', password: '123' }
          ]);

          const [strukturBTM, setStrukturBTM] = useState({
            ketua: 'BILAL',
            wakilKetua1: 'Dra. ASNI VAN GOBEL',
            wakilKetua2: 'ISMAIL ABDUL',
            wakilKetua3: '[Nama Wakil Ketua 3]',
            sekretaris: 'SAHRUL SUBEO',
            wakilSekretaris1: 'IRWAN ADAM',
            wakilSekretaris2: 'FAHRI HARAS',
            bendahara: 'Hj. VONNY MA\'ARUF',
            wakilBendahara1: 'ROMANTIKA ALI',
            wakilBendahara2: '[Nama Wakil Bendahara 2]',
            ketuaPembangunan: 'YUSUP BIDASI',
            koordinatorIdarah: 'ARSYAD TUE',
            koordinatorRiyah: 'YUSUP BIDASI',
            koordinatorImarah: 'BUDHIARTO NIKIULU'
          });

          const [profilMasjid, setProfilMasjid] = useState({
            nama: 'Masjid Al-Muhajirin Wawonasa',
            alamat: 'Jl. Trans Wawonasa, Kecamatan Singkil, Kota Manado, Sulawesi Utara',
            koordinat: '1.4931° N, 124.8412° E (Manado)',
            logoUrl: 'logo.jpg'
          });

          const [credentialsBTM, setCredentialsBTM] = useState({ user: 'btm_masjid', pass: '2026-2029' });
          const [credentialsSuper, setCredentialsSuper] = useState({ user: 'super_admin', pass: '2026-2029' });

          const handleLogin = (username, password) => {
            const trimmedUser = username.trim();
            const trimmedPass = password.trim();

            if (trimmedUser === credentialsSuper.user && trimmedPass === credentialsSuper.pass) {
              setUser({ username: trimmedUser, role: 'super_admin', nama: 'Super Admin' });
            } else if (trimmedUser === credentialsBTM.user && trimmedPass === credentialsBTM.pass) {
              setUser({ username: trimmedUser, role: 'btm', nama: 'Pengurus BTM' });
            } else {
              const foundJamaah = jamaahList.find(j => j.no_kk === trimmedUser);
              if (foundJamaah) {
                if (!foundJamaah.password || foundJamaah.password === trimmedPass) {
                  setUser({ username: foundJamaah.no_kk, role: 'jamaah', nama: foundJamaah.nama });
                } else {
                  alert('Password Jamaah salah! Silakan masukkan password yang benar.');
                }
              } else {
                alert('Login Gagal! Username / Nomor KK tidak ditemukan dalam sistem.');
              }
            }
          };

          return (
            <div className="min-h-screen w-full flex flex-col relative bg-gray-50 pb-10">
              {showInstallBanner && (
                <div className="absolute top-0 left-0 right-0 z-50 bg-yellow-400 text-emerald-950 p-3 shadow-lg flex justify-between items-center px-4 animate-bounce">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">📱</span>
                    <div>
                      <p className="text-xs font-extrabold">Instal Aplikasi Masjid ke Layar Utama HP?</p>
                      <p className="text-[10px] opacity-80">Akses cepat 24/7 tanpa buka browser.</p>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={handleInstallClick} className="bg-emerald-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow">Instal Sekarang</button>
                    <button onClick={() => setShowInstallBanner(false)} className="bg-white/60 text-emerald-950 px-2 py-1.5 rounded-lg text-xs font-bold">Nanti</button>
                  </div>
                </div>
              )}

              {!user ? (
                <LoginScreen 
                  onLogin={handleLogin} 
                  profilMasjid={profilMasjid} 
                  currentTime={currentTime} 
                  jamaahList={jamaahList} 
                  setJamaahList={setJamaahList}
                  onInstallClick={handleInstallClick}
                />
              ) : (
                <MainLayout 
                  user={user} 
                  onLogout={() => setUser(null)} 
                  activeMenu={activeMenu} 
                  setActiveMenu={setActiveMenu}
                  keuangan={keuangan} setKeuangan={setKeuangan}
                  jamaahList={jamaahList} setJamaahList={setJamaahList}
                  strukturBTM={strukturBTM} setStrukturBTM={setStrukturBTM}
                  profilMasjid={profilMasjid} setProfilMasjid={setProfilMasjid}
                  credentialsBTM={credentialsBTM} setCredentialsBTM={setCredentialsBTM}
                  currentTime={currentTime}
                  onInstallClick={handleInstallClick}
                />
              )}
            </div>
          );
        }

        function useJadwalSholat() {
          const [jadwal, setJadwal] = useState({
            Imsak: '04:15', Subuh: '04:25', Terbit: '05:40', 
            Dzuhur: '11:50', Ashar: '15:10', Maghrib: '17:55', Isya: '19:05'
          });
          const [lokasiNama, setLokasiNama] = useState('Manado (Default)');
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState(null);

          const fetchJadwalByCity = (cityName) => {
            setLoading(true);
            setError(null);
            fetch(`https://api.aladhan.com/v1/timingsByCity?city=${cityName}&country=Indonesia&method=20`)
              .then(res => res.json())
              .then(data => {
                if (data && data.data) {
                  const t = data.data.timings;
                  setJadwal({
                    Imsak: t.Imsak, Subuh: t.Fajr, Terbit: t.Sunrise,
                    Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha
                  });
                  setLokasiNama(`Kota ${cityName}`);
                }
                setLoading(false);
              })
              .catch(() => {
                setError('Gagal memuat jadwal online.');
                setLoading(false);
              });
          };

          const deteksiLokasiGPS = () => {
            if (!navigator.geolocation) {
              alert('GPS tidak didukung di perangkat ini.');
              return;
            }
            setLoading(true);
            setError(null);
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const today = new Date();
                const dateStr = `${today.getDate()}-${today.getMonth() + 1}-${today.getFullYear()}`;

                fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${lon}&method=20`)
                  .then(res => res.json())
                  .then(data => {
                    if (data && data.data) {
                      const t = data.data.timings;
                      setJadwal({
                        Imsak: t.Imsak, Subuh: t.Fajr, Terbit: t.Sunrise,
                        Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha
                      });
                      setLokasiNama(`Lokasi GPS Anda (${lat.toFixed(2)}, ${lon.toFixed(2)})`);
                    }
                    setLoading(false);
                  })
                  .catch(() => {
                    setError('Gagal mengambil koordinat GPS.');
                    setLoading(false);
                  });
              },
              () => {
                setError('Akses GPS ditolak atau tidak aktif.');
                setLoading(false);
              }
            );
          };

          useEffect(() => {
            fetchJadwalByCity('Manado');
          }, []);

          return { jadwal, lokasiNama, loading, error, fetchJadwalByCity, deteksiLokasiGPS };
        }

        function LoginScreen({ onLogin, profilMasjid, currentTime, jamaahList, setJamaahList, onInstallClick }) {
          const [u, setU] = useState('');
          const [p, setP] = useState('');
          const [showRegister, setShowRegister] = useState(false);
          const [regForm, setRegForm] = useState({ no_kk: '', nama: '', ktp: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
          const { jadwal, lokasiNama, deteksiLokasiGPS, fetchJadwalByCity } = useJadwalSholat();

          const handleRegisterJamaah = (e) => {
            e.preventDefault();
            if (!regForm.no_kk || !regForm.nama || !regForm.password) {
              alert('Nomor KK, Nama Kepala Keluarga, dan Password wajib diisi!');
              return;
            }

            const isExist = jamaahList.some(item => item.no_kk.trim() === regForm.no_kk.trim());
            if (isExist) {
              alert(`Pendaftaran Ditolak! Nomor KK "${regForm.no_kk}" sudah pernah didaftarkan.`);
              return;
            }

            const newJamaah = {
              no_kk: regForm.no_kk,
              nama: regForm.nama,
              ktp: regForm.ktp || '-',
              hp: regForm.hp || '-',
              alamat: regForm.alamat || '-',
              jumlah: parseInt(regForm.jumlah) || 1,
              anggota: regForm.anggota || '-',
              password: regForm.password
            };

            setJamaahList([...jamaahList, newJamaah]);
            alert('Pendaftaran akun Jamaah berhasil! Silakan login menggunakan Nomor KK dan password Anda.');
            setU(regForm.no_kk);
            setP(regForm.password);
            setShowRegister(false);
          };

          return (
            <div className="min-h-screen w-full bg-emerald-950 p-4 md:p-6 flex flex-col justify-center items-center">
              <div className="max-w-4xl w-full space-y-4 my-auto">
                <div className="bg-white/15 backdrop-blur-md rounded-xl p-4 text-white border border-white/20 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-3">
                    <img src={profilMasjid.logoUrl} alt="Logo Masjid" className="w-14 h-14 md:w-20 md:h-20 rounded-full object-cover border-2 border-yellow-400 shadow-md bg-white flex-shrink-0" />
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Portal Resmi</span>
                        <button onClick={onInstallClick} className="text-[10px] bg-yellow-400 text-emerald-950 font-bold px-2 py-0.5 rounded shadow">📱 Pasang Aplikasi</button>
                      </div>
                      <h1 className="text-lg md:text-2xl font-extrabold mt-1">{profilMasjid.nama}</h1>
                      <p className="text-xs text-emerald-200">📍 {profilMasjid.alamat}</p>
                    </div>
                  </div>
                  <div className="text-right bg-emerald-900/80 p-3 rounded-lg border border-emerald-700/50 w-full md:w-auto flex-shrink-0">
                    <p className="text-[10px] text-emerald-300">Waktu Real-Time</p>
                    <p className="text-xl font-mono font-bold text-white">{currentTime.toLocaleTimeString('id-ID')}</p>
                    <p className="text-[10px] text-emerald-200">{currentTime.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' })}</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-6">
                  <div className="bg-white rounded-xl p-4 shadow-xl border border-emerald-100 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <h3 className="font-bold text-emerald-900 text-sm">⏰ Jadwal Sholat Otomatis</h3>
                        <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">{lokasiNama}</span>
                      </div>
                      
                      <div className="flex gap-2 mb-2">
                        <button onClick={deteksiLokasiGPS} className="text-[10px] bg-emerald-700 text-white px-2.5 py-1 rounded-lg font-bold hover:bg-emerald-800 transition">📍 GPS Saya</button>
                        <select onChange={(e) => fetchJadwalByCity(e.target.value)} className="text-[10px] border border-emerald-300 rounded-lg p-1 bg-white text-emerald-900 font-semibold">
                          <option value="Manado">Kota: Manado</option>
                          <option value="Jakarta">Jakarta</option>
                          <option value="Surabaya">Surabaya</option>
                          <option value="Bandung">Bandung</option>
                          <option value="Makassar">Makassar</option>
                          <option value="Bitung">Bitung</option>
                          <option value="Gorontalo">Gorontalo</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-1.5">
                        {Object.entries(jadwal).map(([nama, waktu], idx) => (
                          <div key={idx} className="flex justify-between items-center p-1.5 rounded bg-emerald-50/70 border border-emerald-100 text-xs">
                            <span className="font-semibold text-emerald-950">{nama}</span>
                            <span className="font-mono font-bold text-emerald-700">{waktu}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl p-4 shadow-xl border border-emerald-100 flex flex-col justify-center">
                    {!showRegister ? (
                      <div>
                        <div className="text-center mb-3">
                          <h3 className="text-base font-bold text-emerald-900">Masuk ke Aplikasi</h3>
                          <p className="text-[10px] text-gray-500">Jamaah (No KK), BTM, atau Super Admin</p>
                        </div>
                        <div className="space-y-2.5">
                          <div>
                            <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Username / No. KK Anda</label>
                            <input type="text" className="w-full p-2 border rounded-lg text-xs" placeholder="No KK / btm_masjid / super_admin" value={u} onChange={(e) => setU(e.target.value)} />
                          </div>
                          <div>
                            <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Password</label>
                            <input type="password" className="w-full p-2 border rounded-lg text-xs" placeholder="Masukkan Password" value={p} onChange={(e) => setP(e.target.value)} />
                          </div>
                          <button onClick={() => onLogin(u, p)} className="w-full bg-emerald-700 text-white p-2 rounded-lg font-bold text-xs hover:bg-emerald-800 transition">Masuk Aplikasi</button>
                          
                          <div className="text-center pt-1 border-t">
                            <p className="text-[10px] text-gray-600">Belum terdaftar sebagai Jamaah?</p>
                            <button onClick={() => setShowRegister(true)} className="mt-0.5 text-[10px] text-emerald-700 font-bold hover:underline">✨ Daftarkan Kartu Keluarga (KK) Jamaah</button>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <div className="flex justify-between items-center mb-2">
                          <h3 className="text-sm font-bold text-emerald-900">Pendaftaran Akun Jamaah</h3>
                          <button onClick={() => setShowRegister(false)} className="text-[10px] text-red-600 font-bold">Kembali</button>
                        </div>
                        <form onSubmit={handleRegisterJamaah} className="space-y-2">
                          <input type="text" placeholder="Nomor KK (Username Login)" className="w-full p-2 border rounded-lg text-[10px]" value={regForm.no_kk} onChange={(e) => setRegForm({...regForm, no_kk: e.target.value})} required />
                          <input type="text" placeholder="Nama Kepala Keluarga" className="w-full p-2 border rounded-lg text-[10px]" value={regForm.nama} onChange={(e) => setRegForm({...regForm, nama: e.target.value})} required />
                          <input type="password" placeholder="Atur Password" className="w-full p-2 border rounded-lg text-[10px]" value={regForm.password} onChange={(e) => setRegForm({...regForm, password: e.target.value})} required />
                          <input type="text" placeholder="Nomor HP / WhatsApp" className="w-full p-2 border rounded-lg text-[10px]" value={regForm.hp} onChange={(e) => setRegForm({...regForm, hp: e.target.value})} />
                          <input type="text" placeholder="Alamat Lengkap" className="w-full p-2 border rounded-lg text-[10px]" value={regForm.alamat} onChange={(e) => setRegForm({...regForm, alamat: e.target.value})} />
                          <input type="number" min="1" placeholder="Jumlah Anggota" className="w-full p-2 border rounded-lg text-[10px]" value={regForm.jumlah} onChange={(e) => setRegForm({...regForm, jumlah: e.target.value})} />
                          <input type="text" placeholder="Anggota Keluarga (pisahkan koma)" className="w-full p-2 border rounded-lg text-[10px]" value={regForm.anggota} onChange={(e) => setRegForm({...regForm, anggota: e.target.value})} />
                          <button type="submit" className="w-full bg-emerald-700 text-white p-2 rounded-lg font-bold text-[10px] hover:bg-emerald-800">Daftar Akun</button>
                        </form>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function MainLayout({ user, onLogout, activeMenu, setActiveMenu, keuangan, setKeuangan, jamaahList, setJamaahList, strukturBTM, setStrukturBTM, profilMasjid, setProfilMasjid, credentialsBTM, setCredentialsBTM, currentTime, onInstallClick }) {
          const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

          const menuItems = [
            { id: 'home', label: 'Beranda & Profil' },
            { id: 'sholat', label: 'Waktu Sholat' },
            { id: 'quran', label: 'Al-Quran Digital' },
            { id: 'zakat', label: 'Kalkulator Zakat' },
            { id: 'kiblat', label: 'Arah Kiblat' },
            { id: 'dzikir', label: 'Dzikir & Doa' },
            { id: 'iqra', label: 'Materi Iqra' },
            { id: 'struktur', label: 'Struktur BTM' },
            { id: 'keuangan', label: 'Keuangan Masjid' },
            { id: 'jamaah', label: 'Data Jamaah' },
          ];

          return (
            <div className="min-h-screen w-full flex flex-col md:flex-row bg-gray-50">
              <div className="hidden md:flex w-64 bg-emerald-950 text-white p-4 flex-col justify-between shadow-lg flex-shrink-0 min-h-screen">
                <div>
                  <div className="flex items-center space-x-2.5 mb-4 pb-3 border-b border-emerald-800">
                    <img src={profilMasjid.logoUrl} alt="Logo" className="w-9 h-9 rounded-full object-cover border border-yellow-400 bg-white" />
                    <div className="overflow-hidden">
                      <h2 className="text-xs font-bold text-yellow-400 truncate">Al-Muhajirin</h2>
                      <p className="text-[10px] text-emerald-300 uppercase truncate">Role: {user.role}</p>
                    </div>
                  </div>
                  <ul className="space-y-1 text-xs">
                    {menuItems.map(item => (
                      <li key={item.id} onClick={() => setActiveMenu(item.id)} className={`cursor-pointer p-2 rounded-lg transition ${activeMenu === item.id ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>{item.label}</li>
                    ))}
                  </ul>
                </div>
                <div className="space-y-2 pt-2 border-t border-emerald-800 mt-4">
                  <button onClick={onInstallClick} className="w-full bg-yellow-500 hover:bg-yellow-600 text-emerald-950 p-2 rounded-lg font-bold text-xs transition">📱 Pasang Aplikasi</button>
                  <button onClick={onLogout} className="w-full bg-red-700 hover:bg-red-800 p-2 rounded-lg font-bold text-xs transition">Keluar</button>
                </div>
              </div>

              <div className="md:hidden bg-emerald-950 text-white p-3 flex justify-between items-center shadow-md flex-shrink-0 sticky top-0 z-30">
                <div className="flex items-center space-x-2">
                  <img src={profilMasjid.logoUrl} alt="Logo" className="w-7 h-7 rounded-full object-cover border border-yellow-400 bg-white" />
                  <h2 className="text-xs font-bold text-yellow-400">Al-Muhajirin</h2>
                </div>
                <div className="flex gap-2">
                  <button onClick={onInstallClick} className="bg-yellow-500 text-emerald-950 px-2 py-1 rounded text-[10px] font-bold">📱 Pasang</button>
                  <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="bg-emerald-800 px-2.5 py-1 rounded text-xs font-bold">
                    {mobileMenuOpen ? '✕ Tutup' : '☰ Menu'}
                  </button>
                </div>
              </div>

              {mobileMenuOpen && (
                <div className="md:hidden absolute top-12 left-0 right-0 z-40 bg-emerald-950 text-white p-3 shadow-xl border-b border-emerald-800">
                  <div className="grid grid-cols-2 gap-1.5">
                    {menuItems.map(item => (
                      <button key={item.id} onClick={() => { setActiveMenu(item.id); setMobileMenuOpen(false); }} className={`p-2 rounded text-left text-xs ${activeMenu === item.id ? 'bg-emerald-800 font-bold text-yellow-300' : 'bg-emerald-900/60'}`}>{item.label}</button>
                    ))}
                  </div>
                  <button onClick={onLogout} className="w-full mt-3 bg-red-700 p-2 rounded font-bold text-xs text-center">Keluar Sistem</button>
                </div>
              )}

              <div className="flex-1 flex flex-col p-3 md:p-6 pb-12">
                <header className="flex justify-between items-center mb-3 pb-2 border-b flex-shrink-0">
                  <h2 className="text-sm md:text-base font-bold text-emerald-900 capitalize">{activeMenu.replace('_', ' ')}</h2>
                  <span className="text-[10px] md:text-xs bg-emerald-100 text-emerald-800 font-semibold px-2 py-0.5 rounded-full">Login: {user.nama || user.username}</span>
                </header>

                <div className="flex-1">
                  {activeMenu === 'home' && <HomeModule profil={profilMasjid} setProfilMasjid={setProfilMasjid} user={user} />}
                  {activeMenu === 'sholat' && <SholatModule />}
                  {activeMenu === 'quran' && <QuranModule />}
                  {activeMenu === 'zakat' && <ZakatModule />}
                  {activeMenu === 'kiblat' && <KiblatModule />}
                  {activeMenu === 'dzikir' && <DzikirModule />}
                  {activeMenu === 'iqra' && <IqraModule />}
                  {activeMenu === 'struktur' && <StrukturModule struktur={strukturBTM} setStrukturBTM={setStrukturBTM} user={user} />}
                  {activeMenu === 'keuangan' && <KeuanganModule keuangan={keuangan} setKeuangan={setKeuangan} user={user} />}
                  {activeMenu === 'jamaah' && <JamaahModule jamaahList={jamaahList} setJamaahList={setJamaahList} user={user} credentialsBTM={credentialsBTM} setCredentialsBTM={setCredentialsBTM} />}
                </div>
              </div>
            </div>
          );
        }

        function HomeModule({ profil, setProfilMasjid, user }) {
          const [editMode, setEditMode] = useState(false);
          const [form, setForm] = useState(profil);

          const handleSave = (e) => {
            e.preventDefault();
            setProfilMasjid(form);
            setEditMode(false);
            alert('Profil masjid berhasil diperbarui!');
          };

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <div className="flex flex-col md:flex-row gap-4 items-center">
                <img src={profil.logoUrl} alt="Logo Masjid" className="w-24 h-24 rounded-full object-cover border-4 border-emerald-600 shadow-md flex-shrink-0" />
                <div className="space-y-1.5 flex-1 text-center md:text-left">
                  <h3 className="text-lg font-bold text-emerald-900">{profil.nama}</h3>
                  <p className="text-gray-600 text-xs"><strong>Alamat:</strong> {profil.alamat}</p>
                  <p className="text-gray-600 text-xs"><strong>Koordinat:</strong> {profil.koordinat}</p>
                  <p className="text-[10px] text-emerald-700 font-semibold bg-emerald-50 p-2 rounded border border-emerald-200">✨ Selamat datang di sistem manajemen digital Masjid Al-Muhajirin Wawonasa.</p>
                </div>
                {(user.role === 'btm' || user.role === 'super_admin') && (
                  <button onClick={() => setEditMode(!editMode)} className="bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-800 transition">
                    {editMode ? 'Tutup Edit' : '✏️ Edit Profil'}
                  </button>
                )}
              </div>

              {editMode && (
                <form onSubmit={handleSave} className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 space-y-3">
                  <h4 className="font-bold text-emerald-900 text-xs">Edit Informasi Masjid</h4>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Nama Masjid</label>
                    <input type="text" className="w-full p-1.5 border rounded text-xs bg-white" value={form.nama} onChange={(e) => setForm({...form, nama: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Alamat</label>
                    <input type="text" className="w-full p-1.5 border rounded text-xs bg-white" value={form.alamat} onChange={(e) => setForm({...form, alamat: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Koordinat</label>
                    <input type="text" className="w-full p-1.5 border rounded text-xs bg-white" value={form.koordinat} onChange={(e) => setForm({...form, koordinat: e.target.value})} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-3 py-1.5 rounded font-bold text-[10px]">Simpan Perubahan</button>
                </form>
              )}
            </div>
          );
        }

        function SholatModule() {
          const { jadwal, lokasiNama, loading, error, fetchJadwalByCity, deteksiLokasiGPS } = useJadwalSholat();

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <div className="flex flex-col md:flex-row justify-between items-center gap-2">
                <div>
                  <h3 className="text-base font-bold text-emerald-900">⏰ Jadwal Sholat Real-Time & Otomatis</h3>
                  <p className="text-[10px] text-gray-500">Menyesuaikan secara otomatis dengan posisi Anda di Indonesia.</p>
                </div>
                <button onClick={deteksiLokasiGPS} className="bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-800 transition">📍 Gunakan GPS Saya</button>
              </div>

              <div className="flex items-center gap-2 bg-emerald-50 p-3 rounded-xl border border-emerald-200">
                <span className="text-xs font-bold text-emerald-900">Pilih Kota:</span>
                <select onChange={(e) => fetchJadwalByCity(e.target.value)} className="p-1.5 border rounded-lg text-xs bg-white text-emerald-900 font-bold">
                  <option value="Manado">Manado</option>
                  <option value="Jakarta">Jakarta</option>
                  <option value="Surabaya">Surabaya</option>
                  <option value="Bandung">Bandung</option>
                  <option value="Makassar">Makassar</option>
                  <option value="Bitung">Bitung</option>
                  <option value="Gorontalo">Gorontalo</option>
                </select>
              </div>

              {loading && <p className="text-xs text-emerald-700 font-semibold">Sedang memperbarui jadwal sholat...</p>}
              {error && <p className="text-xs text-red-600 font-semibold">{error}</p>}

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                <div className="p-3 bg-emerald-900 text-white rounded-xl shadow md:col-span-4 flex justify-between items-center">
                  <div>
                    <span className="text-[10px] uppercase bg-emerald-800 px-2 py-0.5 rounded-full font-bold text-yellow-300">Lokasi Aktif</span>
                    <h4 className="text-sm font-bold mt-1">{lokasiNama}</h4>
                  </div>
                </div>

                {Object.entries(jadwal).map(([nama, waktu], idx) => (
                  <div key={idx} className="p-3 bg-emerald-50/70 rounded-xl border border-emerald-200 flex justify-between items-center">
                    <span className="font-bold text-emerald-950 text-xs">{nama}</span>
                    <span className="font-mono font-bold text-emerald-700 text-sm">{waktu}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // --- MODUL QURAN (DIPERBAIKI SECARA FULL) ---
        function QuranModule() {
          const [search, setSearch] = useState('');
          const [selectedSurah, setSelectedSurah] = useState(null);
          const [ayahs, setAyahs] = useState([]);
          const [loadingAyahs, setLoadingAyahs] = useState(false);

          const daftarSurah = [
            { no: 1, nama: 'Al-Fatihah', arti: 'Pembukaan', ayat: 7 },
            { no: 2, nama: 'Al-Baqarah', arti: 'Sapi Betina', ayat: 286 },
            { no: 3, nama: 'Ali \'Imran', arti: 'Keluarga Imran', ayat: 200 },
            { no: 4, nama: 'An-Nisa\'', arti: 'Wanita', ayat: 176 },
            { no: 5, nama: 'Al-Ma\'idah', arti: 'Hidangan', ayat: 120 },
            { no: 36, nama: 'Yasin', arti: 'Yasin', ayat: 83 },
            { no: 56, nama: 'Al-Waqi\'ah', arti: 'Hari Kiamat', ayat: 96 },
            { no: 67, nama: 'Al-Mulk', arti: 'Kerajaan', ayat: 30 },
            { no: 112, nama: 'Al-Ikhlas', arti: 'Kurnia/Ikhlas', ayat: 4 },
            { no: 113, nama: 'Al-Falaq', arti: 'Waktu Subuh', ayat: 5 },
            { no: 114, nama: 'An-Nas', arti: 'Manusia', ayat: 6 }
          ];

          const fetchSurahDetail = (surahNo) => {
            setLoadingAyahs(true);
            fetch(`https://api.alquran.cloud/v1/surah/${surahNo}`)
              .then(res => res.json())
              .then(data => {
                if (data && data.data) {
                  setSelectedSurah(data.data);
                  setAyahs(data.data.ayahs);
                }
                setLoadingAyahs(false);
              })
              .catch(() => {
                alert('Gagal memuat ayat Al-Quran.');
                setLoadingAyahs(false);
              });
          };

          const filteredSurah = daftarSurah.filter(s => s.nama.toLowerCase().includes(search.toLowerCase()) || s.arti.toLowerCase().includes(search.toLowerCase()));

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              {!selectedSurah ? (
                <div>
                  <div className="flex flex-col md:flex-row justify-between items-center gap-2 mb-3">
                    <h3 className="text-base font-bold text-emerald-900">📖 Al-Quran Digital</h3>
                    <input type="text" placeholder="Cari Surat..." className="p-1.5 border rounded-lg text-xs w-full md:w-64" value={search} onChange={(e) => setSearch(e.target.value)} />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 max-h-[500px] overflow-y-auto p-1">
                    {filteredSurah.map((surah) => (
                      <div key={surah.no} onClick={() => fetchSurahDetail(surah.no)} className="p-3 bg-emerald-50 hover:bg-emerald-100 rounded-xl border border-emerald-200 cursor-pointer flex justify-between items-center transition">
                        <div>
                          <span className="text-xs font-extrabold text-emerald-800">#{surah.no}</span>
                          <h4 className="font-bold text-emerald-950 text-xs mt-0.5">{surah.nama}</h4>
                          <p className="text-[10px] text-gray-500">{surah.arti} • {surah.ayat} Ayat</p>
                        </div>
                        <span className="text-xs font-bold text-emerald-700 bg-white px-2 py-1 rounded shadow-sm">Baca ➜</span>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div>
                  <div className="flex justify-between items-center mb-3 bg-emerald-900 text-white p-3 rounded-xl">
                    <div>
                      <h3 className="font-bold text-sm">{selectedSurah.englishName} ({selectedSurah.name})</h3>
                      <p className="text-[10px] text-emerald-200">{selectedSurah.englishNameTranslation} • {selectedSurah.numberOfAyahs} Ayat • {selectedSurah.revelationType}</p>
                    </div>
                    <button onClick={() => setSelectedSurah(null)} className="bg-white text-emerald-950 px-3 py-1 rounded-lg text-xs font-bold shadow">Kembali ke Daftar</button>
                  </div>

                  {loadingAyahs ? (
                    <p className="text-xs text-center text-emerald-700 py-6 font-semibold">Memuat ayat Al-Quran...</p>
                  ) : (
                    <div className="space-y-3 max-h-[500px] overflow-y-auto p-1">
                      {ayahs.map((ayah) => (
                        <div key={ayah.number} className="p-3 bg-emerald-50/50 rounded-xl border border-emerald-100 space-y-2">
                          <div className="flex justify-between items-center text-[10px] text-emerald-800 font-bold">
                            <span>Ayat {ayah.numberInSurah}</span>
                            <span>Juz {ayah.juz}</span>
                          </div>
                          <p className="text-right text-lg font-serif font-bold text-emerald-950 leading-loose">{ayah.text}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        }

        // --- MODUL KALKULATOR ZAKAT (DIPERBAIKI AKTIF PENUH) ---
        function ZakatModule() {
          const [jenisZakat, setJenisZakat] = useState('maal');
          const [harta, setHarta] = useState('');
          const [penghasilan, setPenghasilan] = useState('');
          const [hasilZakat, setHasilZakat] = useState(null);

          const hitungZakat = (e) => {
            e.preventDefault();
            if (jenisZakat === 'maal') {
              const val = parseFloat(harta) || 0;
              const zakat = val >= 85000000 ? val * 0.025 : 0; // Standar nisab emas ± 85jt
              setHasilZakat({ nominal: zakat, status: val >= 85000000 ? 'Wajib Zakat (Telah Mencapai Nisab)' : 'Belum Mencapai Nisab (Minimal Rp 85.000.000)' });
            } else {
              const val = parseFloat(penghasilan) || 0;
              const zakat = val * 0.025;
              setHasilZakat({ nominal: zakat, status: 'Zakat Penghasilan / Profesi (2.5%)' });
            }
          };

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <h3 className="text-base font-bold text-emerald-900">🧮 Kalkulator Zakat</h3>
              <div className="flex gap-2">
                <button onClick={() => { setJenisZakat('maal'); setHasilZakat(null); }} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${jenisZakat === 'maal' ? 'bg-emerald-700 text-white' : 'bg-gray-100 text-gray-700'}`}>Zakat Maal (Harta)</button>
                <button onClick={() => { setJenisZakat('profesi'); setHasilZakat(null); }} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${jenisZakat === 'profesi' ? 'bg-emerald-700 text-white' : 'bg-gray-100 text-gray-700'}`}>Zakat Penghasilan</button>
              </div>

              <form onSubmit={hitungZakat} className="space-y-3 bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                {jenisZakat === 'maal' ? (
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Total Tabungan / Emas / Aset Setara (Rp)</label>
                    <input type="number" className="w-full p-2 border rounded-lg text-xs bg-white" placeholder="Contoh: 100000000" value={harta} onChange={(e) => setHarta(e.target.value)} required />
                  </div>
                ) : (
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Pendapatan Bersih per Bulan (Rp)</label>
                    <input type="number" className="w-full p-2 border rounded-lg text-xs bg-white" placeholder="Contoh: 7000000" value={penghasilan} onChange={(e) => setPenghasilan(e.target.value)} required />
                  </div>
                )}
                <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-emerald-800">Hitung Zakat</button>
              </form>

              {hasilZakat && (
                <div className="p-4 bg-yellow-50 rounded-xl border border-yellow-200 space-y-1">
                  <p className="text-xs font-bold text-yellow-900">Hasil Perhitungan:</p>
                  <p className="text-lg font-extrabold text-emerald-900">Rp {hasilZakat.nominal.toLocaleString('id-ID')}</p>
                  <p className="text-[10px] text-gray-600">{hasilZakat.status}</p>
                </div>
              )}
            </div>
          );
        }

        // --- MODUL ARAH KIBLAT (DIPERBAIKI LENGKAP) ---
        function KiblatModule() {
          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-3 text-center">
              <h3 className="text-base font-bold text-emerald-900">🧭 Kompas Arah Kiblat</h3>
              <p className="text-xs text-gray-600">Arah kiblat dari Kota Manado / Masjid Al-Muhajirin Wawonasa menghadap ke arah Barat Barat Laut (± 292° dari Utara).</p>
              <div className="p-6 bg-emerald-50 rounded-xl border border-emerald-200 flex flex-col items-center justify-center space-y-3">
                <span className="text-4xl animate-spin">🧭</span>
                <p className="text-xs font-bold text-emerald-900">Derajat Kiblat: 292.4° dari Utara</p>
                <a href="https://qiblafinder.withgoogle.com" target="_blank" rel="noreferrer" className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold shadow hover:bg-emerald-800">Buka Google Qibla Finder ➜</a>
              </div>
            </div>
          );
        }

        // --- MODUL DZIKIR & DOA (DIPERBAIKI LENGKAP) ---
        function DzikirModule() {
          const [counter, setCounter] = useState(0);

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <h3 className="text-base font-bold text-emerald-900">📿 Tasbih & Dzikir Digital</h3>
              <div className="p-6 bg-emerald-900 text-white rounded-xl text-center space-y-3 shadow-inner">
                <p className="text-xs uppercase tracking-widest text-emerald-300 font-bold">Subhanallah walhamdulillah wala ilaha illallah wallahu akbar</p>
                <div className="text-5xl font-mono font-extrabold text-yellow-400 py-3">{counter}</div>
                <div className="flex justify-center gap-3">
                  <button onClick={() => setCounter(counter + 1)} className="bg-yellow-500 text-emerald-950 px-6 py-3 rounded-xl font-extrabold text-sm shadow-lg active:scale-95 transition">Hitung (+1)</button>
                  <button onClick={() => setCounter(0)} className="bg-red-700 text-white px-4 py-3 rounded-xl font-bold text-xs shadow">Reset</button>
                </div>
              </div>
            </div>
          );
        }

        // --- MODUL MATERI IQRA (DIPERBAIKI LENGKAP) ---
        function IqraModule() {
          const [selectedIqra, setSelectedIqra] = useState(1);
          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <h3 className="text-base font-bold text-emerald-900">📚 Belajar Iqra Digital</h3>
              <div className="flex flex-wrap gap-1.5">
                {[1, 2, 3, 4, 5, 6].map((i) => (
                  <button key={i} onClick={() => setSelectedIqra(i)} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${selectedIqra === i ? 'bg-emerald-700 text-white' : 'bg-gray-100 text-gray-700'}`}>Iqra {i}</button>
                ))}
              </div>
              <div className="p-6 bg-emerald-50 rounded-xl border border-emerald-200 text-center space-y-2">
                <h4 className="font-bold text-emerald-950 text-sm">Materi Panduan Iqra Jilid {selectedIqra}</h4>
                <p className="text-xs text-gray-600">Pelajari pengenalan huruf hijaiyah bersambung, harakat dasar (fathah, kasrah, dammah), serta bacaan panjang pendek sesuai standar tartil.</p>
                <div className="p-4 bg-white rounded-lg border text-lg font-serif font-bold text-emerald-900">أ َب َت ث َج َح خ َ</div>
              </div>
            </div>
          );
        }

        function StrukturModule({ struktur, setStrukturBTM, user }) {
          const [editMode, setEditMode] = useState(false);
          const [form, setForm] = useState(struktur);

          const handleSave = (e) => {
            e.preventDefault();
            setStrukturBTM(form);
            setEditMode(false);
            alert('Struktur BTM berhasil diperbarui!');
          };

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="text-base font-bold text-emerald-900">🏛️ Struktur Pengurus BTM (2026 - 2029)</h3>
                {(user.role === 'btm' || user.role === 'super_admin') && (
                  <button onClick={() => setEditMode(!editMode)} className="bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-800 transition">
                    {editMode ? 'Tutup Edit' : '✏️ Edit Struktur'}
                  </button>
                )}
              </div>

              {editMode && (
                <form onSubmit={handleSave} className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 space-y-2">
                  <h4 className="font-bold text-emerald-900 text-xs">Perbarui Pengurus BTM</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" className="p-1.5 border rounded text-xs bg-white" placeholder="Ketua" value={form.ketua} onChange={(e) => setForm({...form, ketua: e.target.value})} />
                    <input type="text" className="p-1.5 border rounded text-xs bg-white" placeholder="Sekretaris" value={form.sekretaris} onChange={(e) => setForm({...form, sekretaris: e.target.value})} />
                    <input type="text" className="p-1.5 border rounded text-xs bg-white" placeholder="Bendahara" value={form.bendahara} onChange={(e) => setForm({...form, bendahara: e.target.value})} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-3 py-1.5 rounded font-bold text-[10px]">Simpan Struktur</button>
                </form>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                {Object.entries(struktur).map(([key, val], idx) => (
                  <div key={idx} className="p-3 bg-emerald-50/70 rounded-xl border border-emerald-100">
                    <span className="text-[10px] uppercase font-bold text-emerald-800">{key.replace(/([A-Z])/g, ' $1')}</span>
                    <p className="font-bold text-emerald-950 text-xs mt-0.5">{val}</p>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function KeuanganModule({ keuangan, setKeuangan, user }) {
          const [form, setForm] = useState({ tanggal: '', uraian: '', masuk: 0, keluar: 0 });

          const handleAdd = (e) => {
            e.preventDefault();
            const lastSaldo = keuangan.length > 0 ? keuangan[keuangan.length - 1].saldo : 0;
            const masukVal = parseFloat(form.masuk) || 0;
            const keluarVal = parseFloat(form.keluar) || 0;
            const newSaldo = lastSaldo + masukVal - keluarVal;

            const newItem = {
              id: Date.now(),
              tanggal: form.tanggal || new Date().toISOString().split('T')[0],
              uraian: form.uraian,
              masuk: masukVal,
              keluar: keluarVal,
              saldo: newSaldo
            };

            setKeuangan([...keuangan, newItem]);
            setForm({ tanggal: '', uraian: '', masuk: 0, keluar: 0 });
            alert('Catatan keuangan berhasil ditambahkan!');
          };

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <h3 className="text-base font-bold text-emerald-900">💰 Transparansi Keuangan Masjid</h3>

              {(user.role === 'btm' || user.role === 'super_admin') && (
                <form onSubmit={handleAdd} className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 space-y-2">
                  <h4 className="font-bold text-emerald-900 text-xs">Tambah Catatan Keuangan</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
                    <input type="date" className="p-1.5 border rounded text-xs bg-white" value={form.tanggal} onChange={(e) => setForm({...form, tanggal: e.target.value})} required />
                    <input type="text" placeholder="Uraian Transaksi" className="p-1.5 border rounded text-xs bg-white" value={form.uraian} onChange={(e) => setForm({...form, uraian: e.target.value})} required />
                    <input type="number" placeholder="Pemasukan (Rp)" className="p-1.5 border rounded text-xs bg-white" value={form.masuk} onChange={(e) => setForm({...form, masuk: e.target.value})} />
                    <input type="number" placeholder="Pengeluaran (Rp)" className="p-1.5 border rounded text-xs bg-white" value={form.keluar} onChange={(e) => setForm({...form, keluar: e.target.value})} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-3 py-1.5 rounded font-bold text-xs">Simpan Transaksi</button>
                </form>
              )}

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-emerald-900 text-white text-[10px]">
                      <th className="p-2.5">Tanggal</th>
                      <th className="p-2.5">Uraian</th>
                      <th className="p-2.5">Masuk (Rp)</th>
                      <th className="p-2.5">Keluar (Rp)</th>
                      <th className="p-2.5">Saldo (Rp)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y text-xs">
                    {keuangan.map((item) => (
                      <tr key={item.id} className="hover:bg-gray-50">
                        <td className="p-2.5">{item.tanggal}</td>
                        <td className="p-2.5 font-semibold">{item.uraian}</td>
                        <td className="p-2.5 text-emerald-700 font-bold">{item.masuk > 0 ? item.masuk.toLocaleString('id-ID') : '-'}</td>
                        <td className="p-2.5 text-red-600 font-bold">{item.keluar > 0 ? item.keluar.toLocaleString('id-ID') : '-'}</td>
                        <td className="p-2.5 font-mono font-bold text-emerald-950">{item.saldo.toLocaleString('id-ID')}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function JamaahModule({ jamaahList, setJamaahList, user, credentialsBTM, setCredentialsBTM }) {
          const [btmUserForm, setBtmUserForm] = useState(credentialsBTM.user);
          const [btmPassForm, setBtmPassForm] = useState(credentialsBTM.pass);

          const handleUpdateBTMAuth = (e) => {
            e.preventDefault();
            setCredentialsBTM({ user: btmUserForm, pass: btmPassForm });
            alert('Kredensial login BTM berhasil diperbarui!');
          };

          return (
            <div className="bg-white p-4 rounded-xl shadow border space-y-4">
              <h3 className="text-base font-bold text-emerald-900">👥 Data Kartu Keluarga (KK) Jamaah</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-emerald-900 text-white text-[10px]">
                      <th className="p-2.5">No. KK</th>
                      <th className="p-2.5">Kepala Keluarga</th>
                      <th className="p-2.5">No. HP / WA</th>
                      <th className="p-2.5">Alamat</th>
                      <th className="p-2.5">Jumlah</th>
                      <th className="p-2.5">Anggota Keluarga</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y text-xs">
                    {jamaahList.length > 0 ? jamaahList.map((j, idx) => (
                      <tr key={idx} className="hover:bg-gray-50">
                        <td className="p-2.5 font-mono font-bold">{j.no_kk}</td>
                        <td className="p-2.5 font-bold text-emerald-950">{j.nama}</td>
                        <td className="p-2.5">{j.hp}</td>
                        <td className="p-2.5">{j.alamat}</td>
                        <td className="p-2.5 text-center">{j.jumlah} Jiwa</td>
                        <td className="p-2.5 text-gray-600">{j.anggota}</td>
                      </tr>
                    )) : (
                      <tr><td colSpan="6" className="p-3 text-center text-gray-500 text-xs">Jamaah tidak ditemukan.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>

              {user.role === 'super_admin' && (
                <div className="p-3 bg-yellow-50 rounded-xl border border-yellow-200 space-y-2 mt-2">
                  <h4 className="font-bold text-yellow-900 text-xs">⚙️ Ubah Kredensial Pengurus BTM</h4>
                  <form onSubmit={handleUpdateBTMAuth} className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" className="p-1.5 border rounded text-xs bg-white" placeholder="Username BTM" value={btmUserForm} onChange={(e) => setBtmUserForm(e.target.value)} required />
                    <input type="text" className="p-1.5 border rounded text-xs bg-white" placeholder="Password BTM" value={btmPassForm} onChange={(e) => setBtmPassForm(e.target.value)} required />
                    <button type="submit" className="bg-yellow-600 text-white px-3 py-1.5 rounded font-bold text-xs sm:col-span-2">Perbarui BTM</button>
                  </form>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
