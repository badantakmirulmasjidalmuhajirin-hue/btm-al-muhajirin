<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTM Al-Muhajirin Wawonasa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [activeMenu, setActiveMenu] = useState('home');

      const [keuangan, setKeuangan] = useState([
        { id: 1, tanggal: '2026-06-01', uraian: 'Saldo Awal Bulan', masuk: 5000000, keluar: 0, ketKeluar: '-', saldo: 5000000 },
        { id: 2, tanggal: '2026-06-05', uraian: 'Kotak Amal Jumat', masuk: 1250000, keluar: 0, ketKeluar: '-', saldo: 6250000 }
      ]);

      const [jamaahList, setJamaahList] = useState([
        { no_kk: '7171011234560001', nama: 'H. Abdullah', ktp: '7171011234560001', hp: '081234567890', alamat: 'Wawonasa Lingkungan I', jumlah: 4, anggota: 'H. Abdullah, Hj. Aminah, Ahmad, Fatimah' }
      ]);

      const [strukturBTM, setStrukturBTM] = useState({
        ketua: 'H. Abdullah',
        wakilKetua1: 'Drs. H. Rahman',
        wakilKetua2: 'Ir. H. M. Ali',
        sekretaris: 'Ahmad Fauzi, S.Pd',
        wakilSekretaris1: 'Muhammad Ridwan',
        wakilSekretaris2: 'Siti Rahma',
        bendahara: 'Hj. Aminah',
        wakilBendahara: 'Nurul Hidayah',
        ketuaPembangunan: 'H. Ibrahim',
        koordinatorIdarah: 'Ustadz Zulkifli',
        koordinatorRiyah: 'H. Usman',
        koordinatorImarah: 'Ustadz Harun'
      });

      const [profilMasjid, setProfilMasjid] = useState({
        nama: 'Masjid Al-Muhajirin Wawonasa',
        alamat: 'Kelurahan Wawonasa, Kecamatan Singkil, Kota Manado, Sulawesi Utara',
        koordinat: '1.4925° N, 124.8385° E'
      });

      const handleLogin = (username, password) => {
        if (username === 'super_admin' && password === '2026-2029') {
          setUser({ username, role: 'super_admin' });
        } else if (username === 'btm_masjid' && password === '2026-2029') {
          setUser({ username, role: 'btm' });
        } else if (username.trim() !== '' && password.trim() !== '') {
          setUser({ username, role: 'jamaah' });
        } else {
          alert('Username atau Password salah!');
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans flex flex-col">
          {!user ? (
            <LoginScreen onLogin={handleLogin} jamaahList={jamaahList} setJamaahList={setJamaahList} />
          ) : (
            <MainLayout 
              user={user} 
              onLogout={() => setUser(null)} 
              activeMenu={activeMenu} 
              setActiveMenu={setActiveMenu}
              keuangan={keuangan} setKeuangan={setKeuangan}
              jamaahList={jamaahList} setJamaahList={setJamaahList}
              strukturBTM={strukturBTM} setStrukturBTM={setStrukturBTM}
              profilMasjid={profilMasjid} setProfilMasjid={setProfilMasjid}
            />
          )}
        </div>
      );
    }

    function LoginScreen({ onLogin, jamaahList, setJamaahList }) {
      const [u, setU] = useState('');
      const [p, setP] = useState('');
      const [showRegister, setShowRegister] = useState(false);

      const [regNoKK, setRegNoKK] = useState('');
      const [regNama, setRegNama] = useState('');
      const [regKtp, setRegKtp] = useState('');
      const [regHp, setRegHp] = useState('');
      const [regAlamat, setRegAlamat] = useState('');
      const [regJumlah, setRegJumlah] = useState('');
      const [regAnggota, setRegAnggota] = useState('');
      const [regPassword, setRegPassword] = useState('');

      const handleRegistrasiMandiri = (e) => {
        e.preventDefault();
        const isExist = jamaahList.some(item => item.no_kk === regNoKK);
        if (isExist) {
          alert("Pendaftaran ditolak! Nomor KK tersebut sudah pernah didaftarkan.");
          return;
        }

        const newData = {
          no_kk: regNoKK,
          nama: regNama,
          ktp: regKtp,
          hp: regHp,
          alamat: regAlamat,
          jumlah: Number(regJumlah),
          anggota: regAnggota
        };

        setJamaahList([...jamaahList, newData]);
        alert("Registrasi Berhasil! Silakan masuk menggunakan Nomor KK atau Nama Anda.");
        setShowRegister(false);
      };

      return (
        <div className="flex items-center justify-center min-h-screen bg-emerald-900 p-4">
          <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-yellow-500">
            <div className="text-center mb-6">
              <h1 className="text-xl font-bold text-emerald-900">BTM Al-Muhajirin Wawonasa</h1>
              <p className="text-xs text-gray-500">{showRegister ? 'Form Pendaftaran Akun Jamaah Baru' : 'Silakan masuk ke akun Anda'}</p>
            </div>

            {!showRegister ? (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Username / No KK</label>
                  <input type="text" className="w-full p-3 border rounded-lg text-sm" placeholder="Masukkan Username / No KK" value={u} onChange={(e) => setU(e.target.value)} />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Password</label>
                  <input type="password" className="w-full p-3 border rounded-lg text-sm" placeholder="Masukkan Password" value={p} onChange={(e) => setP(e.target.value)} />
                </div>
                <button onClick={() => onLogin(u, p)} className="w-full bg-emerald-700 text-white p-3 rounded-lg font-bold hover:bg-emerald-800 transition">
                  Masuk Aplikasi
                </button>

                <div className="text-center mt-4">
                  <p className="text-sm text-gray-500">Belum punya akun jamaah?</p>
                  <button type="button" onClick={() => setShowRegister(true)} className="text-emerald-800 font-bold text-sm underline mt-1">
                    Daftar Akun Jamaah Baru
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handleRegistrasiMandiri} className="space-y-3">
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nomor KK</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" value={regNoKK} onChange={(e) => setRegNoKK(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nama Kepala Keluarga</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" value={regNama} onChange={(e) => setRegNama(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nomor KTP</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" value={regKtp} onChange={(e) => setRegKtp(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nomor HP / WhatsApp</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" value={regHp} onChange={(e) => setRegHp(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Alamat</label>
                  <input type="text" className="w-full p-2.5 border rounded-lg text-sm" value={regAlamat} onChange={(e) => setRegAlamat(e.target.value)} required />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Jml Anggota</label>
                    <input type="number" className="w-full p-2.5 border rounded-lg text-sm" value={regJumlah} onChange={(e) => setRegJumlah(e.target.value)} required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Password</label>
                    <input type="password" className="w-full p-2.5 border rounded-lg text-sm" value={regPassword} onChange={(e) => setRegPassword(e.target.value)} required />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Nama Anggota Keluarga</label>
                  <textarea className="w-full p-2.5 border rounded-lg text-sm" value={regAnggota} onChange={(e) => setRegAnggota(e.target.value)} required />
                </div>
                <button type="submit" className="w-full bg-emerald-700 text-white p-2.5 rounded-lg font-bold hover:bg-emerald-800 transition text-sm">
                  Daftarkan Akun
                </button>
                <button type="button" onClick={() => setShowRegister(false)} className="w-full bg-gray-200 text-gray-700 p-2 rounded-lg font-bold hover:bg-gray-300 transition text-xs mt-2">
                  Kembali ke Menu Login
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function MainLayout({ user, onLogout, activeMenu, setActiveMenu, keuangan, setKeuangan, jamaahList, setJamaahList, strukturBTM, setStrukturBTM, profilMasjid, setProfilMasjid }) {
      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          <div className="w-full md:w-72 bg-emerald-950 text-white p-5 flex flex-col justify-between shadow-lg">
            <div>
              <div className="flex items-center space-x-3 mb-6 pb-4 border-b border-emerald-800">
                <div>
                  <h2 className="text-sm font-bold text-yellow-400">Al-Muhajirin Wawonasa</h2>
                  <p className="text-xs text-emerald-300 uppercase">Role: {user.role}</p>
                </div>
              </div>
              <ul className="space-y-1 text-sm">
                <li onClick={() => setActiveMenu('home')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'home' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Beranda & Profil Masjid</li>
                <li onClick={() => setActiveMenu('sholat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'sholat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Waktu Sholat Real-Time</li>
                <li onClick={() => setActiveMenu('quran')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'quran' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Al-Quran Digital (30 Juz)</li>
                <li onClick={() => setActiveMenu('zakat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'zakat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Kalkulator Zakat</li>
                <li onClick={() => setActiveMenu('kiblat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'kiblat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Arah Kiblat Digital</li>
                <li onClick={() => setActiveMenu('dzikir')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'dzikir' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Dzikir & Doa Harian</li>
                <li onClick={() => setActiveMenu('iqra')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'iqra' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Materi Iqra 1-6 (TPA)</li>
                <li onClick={() => setActiveMenu('struktur')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'struktur' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Struktur Pengurus BTM</li>
                <li onClick={() => setActiveMenu('keuangan')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'keuangan' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Keuangan Masjid</li>
                <li onClick={() => setActiveMenu('jamaah')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'jamaah' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Data Jamaah Masjid</li>
                <li onClick={() => setActiveMenu('reset')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'reset' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Reset Password</li>
              </ul>
            </div>
            <button onClick={onLogout} className="mt-6 bg-red-700 hover:bg-red-800 p-2.5 rounded-lg font-bold text-sm transition">Keluar Sistem</button>
          </div>

          <div className="flex-1 p-6 md:p-10 overflow-y-auto">
            <header className="flex justify-between items-center mb-6 pb-4 border-b">
              <h2 className="text-lg font-bold text-emerald-900 capitalize">{activeMenu.replace('_', ' ')}</h2>
              <span className="text-xs bg-emerald-100 text-emerald-800 font-semibold px-3 py-1 rounded-full">User: {user.username} ({user.role})</span>
            </header>

            {activeMenu === 'home' && <HomeModule profil={profilMasjid} user={user} setProfil={setProfilMasjid} />}
            {activeMenu === 'sholat' && <SholatModule />}
            {activeMenu === 'quran' && <QuranModule />}
            {activeMenu === 'zakat' && <ZakatModule />}
            {activeMenu === 'kiblat' && <KiblatModule />}
            {activeMenu === 'dzikir' && <DzikirModule />}
            {activeMenu === 'iqra' && <IqraModule />}
            {activeMenu === 'struktur' && <StrukturModule struktur={strukturBTM} setStruktur={setStrukturBTM} user={user} />}
            {activeMenu === 'keuangan' && <KeuanganModule keuangan={keuangan} setKeuangan={setKeuangan} user={user} />}
            {activeMenu === 'jamaah' && <JamaahModule jamaahList={jamaahList} setJamaahList={setJamaahList} user={user} />}
            {activeMenu === 'reset' && <ResetPasswordModule />}
          </div>
        </div>
      );
    }

    function QuranModule() {
      const [surahs, setSurahs] = useState([]);
      const [search, setSearch] = useState('');
      const [selectedSurah, setSelectedSurah] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('https://equran.id/api/v2/surat')
          .then(res => res.json())
          .then(data => {
            if (data && data.data) setSurahs(data.data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      const fetchDetailSurah = (nomor) => {
        setLoading(true);
        fetch(`https://equran.id/api/v2/surat/${nomor}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.data) setSelectedSurah(data.data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      };

      const filteredSurah = surahs.filter(s => 
        s.namaLatin.toLowerCase().includes(search.toLowerCase()) || 
        s.arti.toLowerCase().includes(search.toLowerCase()) ||
        String(s.nomor).includes(search)
      );

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-4">
          <div className="flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h3 className="text-xl font-bold text-emerald-900">Al-Quran Digital (30 Juz)</h3>
              <p className="text-xs text-gray-500">Pilih atau cari surah untuk membaca teks ayat dan terjemahan.</p>
            </div>
            {selectedSurah && (
              <button onClick={() => setSelectedSurah(null)} className="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-bold text-xs">
                &larr; Kembali ke Daftar Surah
              </button>
            )}
          </div>

          {!selectedSurah ? (
            <div className="space-y-4">
              <input 
                type="text" 
                placeholder="Cari nama surah (contoh: Al-Fatihah, Yasin)..." 
                className="w-full p-3 border rounded-lg text-sm"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
              {loading ? (
                <p className="text-center py-8 text-emerald-800 font-semibold">Memuat daftar surah...</p>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 max-h-[550px] overflow-y-auto p-2">
                  {filteredSurah.map((surah) => (
                    <div 
                      key={surah.nomor} 
                      onClick={() => fetchDetailSurah(surah.nomor)}
                      className="p-4 bg-emerald-50 hover:bg-emerald-100 rounded-xl border border-emerald-200 cursor-pointer flex justify-between items-center transition"
                    >
                      <div>
                        <span className="text-xs font-bold text-emerald-700 bg-emerald-200 px-2 py-0.5 rounded-full">{surah.nomor}</span>
                        <h4 className="font-bold text-emerald-900 mt-1">{surah.namaLatin}</h4>
                        <p className="text-xs text-gray-600">{surah.arti} ({surah.jumlahAyat} Ayat)</p>
                      </div>
                      <span className="text-xl font-serif text-emerald-900 font-bold">{surah.nama}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : (
            <div className="space-y-6">
              <div className="p-6 bg-emerald-900 text-white rounded-2xl text-center shadow">
                <h3 className="text-2xl font-bold">{selectedSurah.namaLatin} ({selectedSurah.nama})</h3>
                <p className="text-sm text-emerald-200">{selectedSurah.arti} &bull; {selectedSurah.jumlahAyat} Ayat</p>
              </div>
              {loading ? (
                <p className="text-center py-8 text-emerald-800 font-semibold">Memuat ayat...</p>
              ) : (
                <div className="space-y-4 max-h-[600px] overflow-y-auto p-2">
                  {selectedSurah.ayat.map((item) => (
                    <div key={item.nomorAyat} className="p-5 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
                      <span className="w-8 h-8 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold text-xs">{item.nomorAyat}</span>
                      <p className="text-right font-serif text-2xl text-emerald-950 leading-loose">{item.teksArab}</p>
                      <p className="text-xs text-emerald-800 font-medium italic">{item.teksLatin}</p>
                      <p className="text-sm text-gray-700">Artinya: "{item.teksIndonesia}"</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function DzikirModule() {
      const [search, setSearch] = useState('');
      const daftarDoa = [
        { id: 1, kategori: 'Dzikir & Doa', judul: 'Dzikir Pagi', arab: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ', latin: 'Ashbahna wa ashbahal mulku lillah', arti: 'Kami telah memasuki waktu pagi dan kekuasaan hanya milik Allah.' },
        { id: 2, kategori: 'Dzikir & Doa', judul: 'Dzikir Petang', arab: 'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ', latin: 'Amsayna wa amsal mulku lillah', arti: 'Kami telah memasuki waktu petang dan kekuasaan hanya milik Allah.' },
        { id: 3, kategori: 'Doa Harian', judul: 'Doa Sebelum Makan', arab: 'اللَّهُمَّ بَارِك لنا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ', latin: 'Allahumma barik lana fima razaqtana wa qina adhaban nar', arti: 'Ya Allah, berkahilah kami dalam rezeki yang telah Engkau berikan.' },
        { id: 4, kategori: 'Doa Harian', judul: 'Doa Sesudah Makan', arab: 'الحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ', latin: 'Alhamdulillahilladhi athamana wasaqana wajaalana muslimin', arti: 'Segala puji bagi Allah yang telah memberi kami makan dan minum.' },
        { id: 5, kategori: 'Doa Harian', judul: 'Doa Sebelum Tidur', arab: 'بِاسْمِكَ اللَّهُمَّ أَحْيَا وَأَمُوتُ', latin: 'Bismikallahumma ahya wa amuut', arti: 'Dengan nama-Mu ya Allah, aku hidup dan aku mati.' },
        { id: 6, kategori: 'Doa Harian', judul: 'Doa Bangun Tidur', arab: 'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', latin: 'Alhamdulillahilladhi ahyana ba’da ma amatana wailaihin nusyur', arti: 'Segala puji bagi Allah yang telah menghidupkan kami kembali.' },
        { id: 7, kategori: 'Doa Harian', judul: 'Doa Masuk Kamar Mandi', arab: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ', latin: 'Allahumma inni audzubika minal khubuthi wal khabaith', arti: 'Ya Allah, sesungguhnya aku berlindung kepada-Mu dari kejahatan.' },
        { id: 8, kategori: 'Doa Harian', judul: 'Doa Keluar Kamar Mandi', arab: 'غُفْرَانَكَ الْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنِّي الأَذَى وَعَافَانِي', latin: 'Ghufroanak, alhamdulillahilladhi adzhaba annil adza', arti: 'Dengan mengharap ampunan-Mu, segala puji bagi Allah.' },
        { id: 9, kategori: 'Doa Perjalanan', judul: 'Doa Keluar Rumah', arab: 'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ', latin: 'Bismillahi tawakkaltu alallahi la hawla wala quwwata illa billah', arti: 'Dengan nama Allah, aku bertawakal kepada Allah.' }
      ];

      const filteredDoa = daftarDoa.filter(d => 
        d.judul.toLowerCase().includes(search.toLowerCase()) || 
        d.arti.toLowerCase().includes(search.toLowerCase()) ||
        d.kategori.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-4">
          <div className="flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h3 className="text-xl font-bold text-emerald-900">Dzikir & Doa Harian Lengkap</h3>
              <p className="text-xs text-gray-500">Kumpulan dzikir pagi-petang serta doa sehari-hari.</p>
            </div>
            <input 
              type="text" 
              placeholder="Cari doa atau dzikir..." 
              className="p-2.5 border rounded-lg text-sm w-full md:w-72"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
            />
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[600px] overflow-y-auto p-1">
            {filteredDoa.map((item) => (
              <div key={item.id} className="p-5 bg-emerald-50 rounded-xl border border-emerald-200 space-y-2 flex flex-col justify-between">
                <div>
                  <span className="text-[10px] bg-emerald-700 text-white font-bold px-2 py-0.5 rounded-full">{item.kategori}</span>
                  <h4 className="font-bold text-emerald-900 text-base mt-2">{item.judul}</h4>
                  <p className="text-right font-serif text-2xl text-emerald-950 my-3 leading-loose">{item.arab}</p>
                  <p className="text-xs text-emerald-800 italic font-medium">{item.latin}</p>
                </div>
                <p className="text-xs text-gray-700 border-t border-emerald-200 pt-2 mt-2">Artinya: "{item.arti}"</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function IqraModule() {
      const [jilidAktif, setJilidAktif] = useState(1);
      const materiIqra = {
        1: { judul: 'Iqra Jilid 1: Pengenalan Huruf Hijaiyah Tunggal dengan Fathah', materi: [{ huruf: 'أَ - بَ - تَ', baca: 'A - Ba - Ta', ket: 'Harakat Fathah dibaca A' }, { huruf: 'ثَ - جَ - حَ', baca: 'Tha - Ja - Ha', ket: 'Huruf Tsa, Jim, Ha' }] },
        2: { judul: 'Iqra Jilid 2: Huruf Sambung & Bacaan Panjang', materi: [{ huruf: 'بَا - تَار - ثَا', baca: 'Baa - Taar - Thaa', ket: 'Sambung dengan Alif' }, { huruf: 'جِي - حِي - خِي', baca: 'Jii - Hii - Khii', ket: 'Kasrah bertemu Ya' }] },
        3: { judul: 'Iqra Jilid 3: Tanwin & Sukun', materi: [{ huruf: 'أَنْ - بَنْ - تَنْ', baca: 'An - Ban - Tan', ket: 'Tanwin Fathah' }, { huruf: 'أَبْ - أَتْ - أَجْ', baca: 'Ab - At - Aj', ket: 'Huruf Sukun' }] },
        4: { judul: 'Iqra Jilid 4: Tasydid & Qalqalah', materi: [{ huruf: 'رَبَّ - جَادَّ - حَجَّ', baca: 'Rabba - Jaadda', ket: 'Tasydid' }, { huruf: 'أَبْطَالَ - يَجْعَلُونَ', baca: 'Abthala', ket: 'Qalqalah memantul' }] },
        5: { judul: 'Iqra Jilid 5: Waqaf & Nun Mati/Tanwin', materi: [{ huruf: 'مِنْ خَوْفٍ', baca: 'Min khawfin', ket: 'Izhar Halqi' }] },
        6: { judul: 'Iqra Jilid 6: Latihan Lancar Membaca Al-Quran', materi: [{ huruf: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', baca: 'Bismillah', ket: 'Tartil & Tajwid' }] }
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-6">
          <div>
            <h3 className="text-xl font-bold text-emerald-900">Materi Pembelajaran Iqra 1 s/d 6</h3>
            <p className="text-xs text-gray-500">Pilih jilid Iqra untuk melihat panduan mengaji anak-anak.</p>
          </div>
          <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
            {[1, 2, 3, 4, 5, 6].map((jilid) => (
              <button key={jilid} onClick={() => setJilidAktif(jilid)} className={`p-3 rounded-lg font-bold text-sm transition ${jilidAktif === jilid ? 'bg-emerald-700 text-white shadow' : 'bg-emerald-50 text-emerald-900 hover:bg-emerald-100 border'}`}>
                Iqra {jilid}
              </button>
            ))}
          </div>
          <div className="p-6 bg-emerald-50 rounded-2xl border space-y-4">
            <h4 className="font-bold text-emerald-900 text-base">{materiIqra[jilidAktif].judul}</h4>
            <div className="space-y-3">
              {materiIqra[jilidAktif].materi.map((item, index) => (
                <div key={index} className="p-4 bg-white rounded-xl border flex justify-between items-center">
                  <div>
                    <p className="font-serif text-2xl text-emerald-950 font-bold">{item.huruf}</p>
                    <p className="text-xs text-gray-600 mt-1">{item.ket}</p>
                  </div>
                  <span className="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">{item.baca}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function HomeModule({ profil, user, setProfil }) {
      const [edit, setEdit] = useState(false);
      const [nama, setNama] = useState(profil.nama);
      const [alamat, setAlamat] = useState(profil.alamat);
      const [koordinat, setKoordinat] = useState(profil.koordinat);

      const handleSave = (e) => {
        e.preventDefault();
        setProfil({ nama, alamat, koordinat });
        setEdit(false);
        alert("Profil berhasil diperbarui!");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-xl shadow border">
            <h3 className="text-xl font-bold text-emerald-900 mb-2">{profil.nama}</h3>
            <p className="text-gray-600 mb-2"><strong>Alamat:</strong> {profil.alamat}</p>
            <p className="text-gray-600 mb-4"><strong>Koordinat:</strong> {profil.koordinat}</p>
            {(user.role === 'btm' || user.role === 'super_admin') && (
              <button onClick={() => setEdit(!edit)} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold">
                {edit ? 'Tutup Form' : 'Edit Profil'}
              </button>
            )}
          </div>
          {edit && (
            <form onSubmit={handleSave} className="bg-white p-6 rounded-xl shadow border space-y-4">
              <h4 className="font-bold text-emerald-900">Form Perubahan Profil Masjid</h4>
              <div><label className="block text-xs font-bold mb-1">Nama Masjid</label><input type="text" className="w-full p-2 border rounded" value={nama} onChange={(e) => setNama(e.target.value)} required /></div>
              <div><label className="block text-xs font-bold mb-1">Alamat</label><textarea className="w-full p-2 border rounded" value={alamat} onChange={(e) => setAlamat(e.target.value)} required /></div>
              <div><label className="block text-xs font-bold mb-1">Koordinat</label><input type="text" className="w-full p-2 border rounded" value={koordinat} onChange={(e) => setKoordinat(e.target.value)} required /></div>
              <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Simpan</button>
            </form>
          )}
        </div>
      );
    }

    function SholatModule() {
      return (
        <div className="bg-white p-6 rounded-xl shadow border">
          <h3 className="text-xl font-bold text-emerald-900 mb-1">Jadwal Sholat Real-Time</h3>
          <p className="text-xs text-gray-500 mb-6">Area: Kota Manado & Sekitarnya (Wawonasa)</p>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
            {Object.entries({ Imsak: '04:15', Subuh: '04:25', Dzuhur: '11:50', Ashar: '15:15', Maghrib: '17:55', Isya: '19:05' }).map(([key, val]) => (
              <div key={key} className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-center">
                <h4 className="font-bold text-emerald-900 text-sm">{key}</h4>
                <p className="text-xl font-extrabold text-emerald-700 mt-1">{val}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ZakatModule() {
      const [penghasilan, setPenghasilan] = useState('');
      const [hasilZakat, setHasilZakat] = useState(null);

      const hitungZakat = (e) => {
        e.preventDefault();
        const nominal = Number(penghasilan) || 0;
        setHasilZakat(nominal >= 5000000 ? nominal * 0.025 : 0);
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-4 max-w-lg">
          <h3 className="text-xl font-bold text-emerald-900">Kalkulator Zakat Penghasilan</h3>
          <form onSubmit={hitungZakat} className="space-y-3">
            <div><label className="block text-xs font-bold mb-1">Pendapatan Per Bulan (Rp)</label><input type="number" className="w-full p-2.5 border rounded text-sm" value={penghasilan} onChange={(e) => setPenghasilan(e.target.value)} required /></div>
            <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded text-sm font-bold">Hitung Zakat (2.5%)</button>
          </form>
          {hasilZakat !== null && (
            <div className="p-4 bg-emerald-50 rounded-lg border border-emerald-200">
              <p className="text-sm font-bold text-emerald-900">Zakat yang harus dikeluarkan:</p>
              <p className="text-lg font-extrabold text-emerald-700">Rp {hasilZakat.toLocaleString()}</p>
            </div>
          )}
        </div>
      );
    }

    function KiblatModule() {
      return (
        <div className="bg-white p-6 rounded-xl shadow border text-center space-y-4 max-w-md mx-auto">
          <h3 className="text-xl font-bold text-emerald-900">Arah Kiblat Digital</h3>
          <p className="text-sm text-gray-600">Kompas penunjuk arah Kakbah dari Wawonasa, Manado.</p>
          <div className="w-32 h-32 mx-auto rounded-full border-4 border-emerald-700 flex items-center justify-center bg-emerald-50 shadow-inner">
            <span className="text-2xl font-bold text-emerald-900">🧭 294°</span>
          </div>
        </div>
      );
    }

    function ResetPasswordModule() {
      const [oldPass, setOldPass] = useState('');
      const [newPass, setNewPass] = useState('');
      return (
        <div className="bg-white p-6 rounded-xl shadow border max-w-md">
          <h3 className="text-xl font-bold text-emerald-900 mb-4">Reset Password Akun</h3>
          <form onSubmit={(e) => { e.preventDefault(); alert("Password diperbarui!"); setOldPass(''); setNewPass(''); }} className="space-y-3">
            <div><label className="block text-xs font-bold mb-1">Password Lama</label><input type="password" className="w-full p-2.5 border rounded text-sm" value={oldPass} onChange={(e) => setOldPass(e.target.value)} required /></div>
            <div><label className="block text-xs font-bold mb-1">Password Baru</label><input type="password" className="w-full p-2.5 border rounded text-sm" value={newPass} onChange={(e) => setNewPass(e.target.value)} required /></div>
            <button type="submit" className="bg-emerald-700 text-white px-4 py-2.5 rounded text-sm font-bold">Simpan Password Baru</button>
          </form>
        </div>
      );
    }

    function KeuanganModule({ keuangan, setKeuangan, user }) {
      const [uraian, setUraian] = useState('');
      const [masuk, setMasuk] = useState('');
      const [keluar, setKeluar] = useState('');
      const [ketKeluar, setKetKeluar] = useState('');

      const handleTambah = (e) => {
        e.preventDefault();
        const lastSaldo = keuangan.length > 0 ? keuangan[keuangan.length - 1].saldo : 0;
        const m = Number(masuk) || 0;
        const k = Number(keluar) || 0;
        const newSaldo = lastSaldo + m - k;
        setKeuangan([...keuangan, { id: keuangan.length + 1, tanggal: new Date().toISOString().split('T')[0], uraian, masuk: m, keluar: k, ketKeluar: k > 0 ? ketKeluar : '-', saldo: newSaldo }]);
        setUraian(''); setMasuk(''); setKeluar(''); setKetKeluar('');
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-6">
          <h3 className="text-xl font-bold text-emerald-900">Laporan Keuangan Masjid</h3>
          <div className="overflow-x-auto">
            <table className="w-full border-collapse border border-gray-200 text-sm">
              <thead>
                <tr className="bg-emerald-100 text-emerald-900">
                  <th className="border p-2">No</th><th className="border p-2">Tanggal</th><th className="border p-2">Uraian</th><th className="border p-2">Masuk</th><th className="border p-2">Keluar</th><th className="border p-2">Saldo</th>
                </tr>
              </thead>
              <tbody>
                {keuangan.map((item, idx) => (
                  <tr key={item.id} className="text-center">
                    <td className="border p-2">{idx + 1}</td>
                    <td className="border p-2">{item.tanggal}</td>
                    <td className="border p-2 text-left">{item.uraian}</td>
                    <td className="border p-2 text-green-600 font-semibold">Rp {item.masuk.toLocaleString()}</td>
                    <td className="border p-2 text-red-600 font-semibold">Rp {item.keluar.toLocaleString()}</td>
                    <td className="border p-2 font-bold">Rp {item.saldo.toLocaleString()}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {user.role === 'super_admin' && (
            <form onSubmit={handleTambah} className="bg-gray-50 p-4 rounded-xl border space-y-3">
              <h4 className="font-bold text-emerald-900 text-sm">Tambah Keuangan</h4>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" placeholder="Uraian" className="p-2 border rounded text-sm" value={uraian} onChange={(e) => setUraian(e.target.value)} required />
                <input type="number" placeholder="Masuk" className="p-2 border rounded text-sm" value={masuk} onChange={(e) => setMasuk(e.target.value)} />
                <input type="number" placeholder="Keluar" className="p-2 border rounded text-sm" value={keluar} onChange={(e) => setKeluar(e.target.value)} />
                <input type="text" placeholder="Ket Keluar" className="p-2 border rounded text-sm" value={ketKeluar} onChange={(e) => setKetKeluar(e.target.value)} />
              </div>
              <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded text-xs font-bold">Simpan Transaksi</button>
            </form>
          )}
        </div>
      );
    }

    function JamaahModule({ jamaahList, setJamaahList }) {
      const [search, setSearch] = useState('');
      const [noKK, setNoKK] = useState('');
      const [namaKepala, setNamaKepala] = useState('');
      const [noKtp, setNoKtp] = useState('');
      const [noHp, setNoHp] = useState('');
      const [alamat, setAlamat] = useState('');
      const [jumlahAnggota, setJumlahAnggota] = useState('');
      const [namaAnggota, setNamaAnggota] = useState('');

      const handleTambahJamaah = (e) => {
        e.preventDefault();
        if (jamaahList.some(item => item.no_kk === noKK)) {
          alert("Nomor KK sudah terdaftar!");
          return;
        }
        setJamaahList([...jamaahList, { no_kk: noKK, nama: namaKepala, ktp: noKtp, hp: noHp, alamat, jumlah: Number(jumlahAnggota), anggota: namaAnggota }]);
        setNoKK(''); setNamaKepala(''); setNoKtp(''); setNoHp(''); setAlamat(''); setJumlahAnggota(''); setNamaAnggota('');
      };

      const filteredData = jamaahList.filter(item => item.no_kk.includes(search) || item.nama.toLowerCase().includes(search.toLowerCase()));

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-6">
          <h3 className="text-xl font-bold text-emerald-900">Data Jamaah & Kartu Keluarga</h3>
          <input type="text" placeholder="Cari No KK atau Nama..." className="w-full p-3 border rounded-lg text-sm" value={search} onChange={(e) => setSearch(e.target.value)} />
          <div className="overflow-x-auto">
            <table className="w-full border-collapse border border-gray-200 text-sm">
              <thead>
                <tr className="bg-emerald-100 text-emerald-900"><th className="border p-2">No KK</th><th className="border p-2">Nama Kepala</th><th className="border p-2">No HP</th><th className="border p-2">Alamat</th><th className="border p-2">Anggota</th></tr>
              </thead>
              <tbody>
                {filteredData.map((item, idx) => (
                  <tr key={idx} className="text-center">
                    <td className="border p-2 font-semibold">{item.no_kk}</td>
                    <td className="border p-2">{item.nama}</td>
                    <td className="border p-2">{item.hp}</td>
                    <td className="border p-2">{item.alamat}</td>
                    <td className="border p-2 text-left">{item.anggota}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function StrukturModule({ struktur, setStruktur, user }) {
      const [edit, setEdit] = useState(false);
      const [form, setForm] = useState(struktur);

      return (
        <div className="bg-white p-6 rounded-xl shadow border space-y-6">
          <div className="flex justify-between items-center">
            <h3 className="text-xl font-bold text-emerald-900">Struktur Pengurus BTM</h3>
            {user.role === 'super_admin' && <button onClick={() => setEdit(!edit)} className="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold">{edit ? 'Tutup' : 'Edit'}</button>}
          </div>
          {!edit ? (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              {Object.entries(struktur).map(([key, val]) => (
                <div key={key} className="p-3 bg-emerald-50 rounded-lg border border-emerald-200">
                  <strong className="capitalize text-emerald-900 block">{key.replace(/([A-Z])/g, ' $1')}</strong>
                  <span className="text-gray-700">{val}</span>
                </div>
              ))}
            </div>
          ) : (
            <form onSubmit={(e) => { e.preventDefault(); setStruktur(form); setEdit(false); alert("Struktur diperbarui!"); }} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {Object.keys(struktur).map((key) => (
                  <div key={key}>
                    <label className="block text-xs font-bold capitalize mb-1">{key.replace(/([A-Z])/g, ' $1')}</label>
                    <input type="text" className="w-full p-2 border rounded text-sm" value={form[key]} onChange={(e) => setForm({ ...form, [key]: e.target.value })} required />
                  </div>
                ))}
              </div>
              <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Simpan</button>
            </form>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
