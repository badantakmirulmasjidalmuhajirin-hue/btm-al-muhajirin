<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Masjid Al-Muhajirin Wawonasa</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen m-0 p-0 antialiased">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- KOMPONEN UTAMA APLIKASI ---
        function App() {
          const [user, setUser] = useState(null);
          const [activeMenu, setActiveMenu] = useState('home');
          const [currentTime, setCurrentTime] = useState(new Date());
          const [installPrompt, setInstallPrompt] = useState(null);
          const [showInstallBanner, setShowInstallBanner] = useState(false);
          const [toastMessage, setToastMessage] = useState(null);

          // Fungsi Toast Profesional Pengganti Alert Bawaan
          const showToast = (message, type = 'success') => {
            setToastMessage({ message, type });
            setTimeout(() => setToastMessage(null), 3500);
          };

          useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            const handleBeforeInstallPrompt = (e) => {
              e.preventDefault();
              setInstallPrompt(e);
              setShowInstallBanner(true);
            };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = () => {
            if (installPrompt) {
              installPrompt.prompt();
              installPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                  showToast('Aplikasi berhasil dipasang di perangkat!');
                }
                setInstallPrompt(null);
                setShowInstallBanner(false);
              });
            } else {
              showToast('Ketuk menu titik tiga browser, lalu pilih "Tambahkan ke Layar Utama".', 'info');
              setShowInstallBanner(false);
            }
          };

          // --- STATE UTAMA ---
          const [keuangan, setKeuangan] = useState([
            { id: 1, tanggal: '2026-06-01', uraian: 'Saldo Awal Bulan', masuk: 5000000, keluar: 0, saldo: 5000000 },
            { id: 2, tanggal: '2026-06-05', uraian: 'Kotak Amal Jumat', masuk: 1250000, keluar: 0, saldo: 6250000 }
          ]);

          const [jamaahList, setJamaahList] = useState([
            { no_kk: '7171011234560001', nama: 'H. Abdullah', ktp: '7171011234560001', hp: '081234567890', alamat: 'Wawonasa Lingkungan I', jumlah: 4, anggota: 'H. Abdullah, Hj. Aminah, Ahmad, Fatimah', password: '123' }
          ]);

          const [strukturBTM, setStrukturBTM] = useState({
            ketua: 'BILAL',
            wakilKetua1: 'Dra. ASNI VAN GOBEL',
            wakilKetua2: 'ISMAIL ABDUL',
            sekretaris: 'SAHRUL SUBEO',
            wakilSekretaris1: 'IRWAN ADAM',
            bendahara: 'Hj. VONNY MA\'ARUF',
            wakilBendahara1: 'ROMANTIKA ALI',
            ketuaPembangunan: 'YUSUP BIDASI',
            koordinatorIdarah: 'ARSYAD TUE',
            koordinatorRiyah: 'YUSUP BIDASI',
            koordinatorImarah: 'BUDHIARTO NIKIULU'
          });

          const [profilMasjid, setProfilMasjid] = useState({
            nama: 'Masjid Al-Muhajirin Wawonasa',
            alamat: 'Jl. Trans Wawonasa, Kecamatan Singkil, Kota Manado, Sulawesi Utara',
            koordinat: '1.4931° N, 124.8412° E (Manado)',
            logoUrl: 'logo.jpg'
          });

          const [credentialsBTM, setCredentialsBTM] = useState({ user: 'btm_masjid', pass: '2026-2029' });
          const [credentialsSuper, setCredentialsSuper] = useState({ user: 'super_admin', pass: '2026-2029' });

          const handleLogin = (username, password) => {
            const trimmedUser = username.trim();
            const trimmedPass = password.trim();

            if (!trimmedUser || !trimmedPass) {
              showToast('Username dan Password wajib diisi!', 'error');
              return;
            }

            if (trimmedUser === credentialsSuper.user && trimmedPass === credentialsSuper.pass) {
              setUser({ username: trimmedUser, role: 'super_admin', nama: 'Super Admin' });
              showToast('Berhasil masuk sebagai Super Admin');
            } else if (trimmedUser === credentialsBTM.user && trimmedPass === credentialsBTM.pass) {
              setUser({ username: trimmedUser, role: 'btm', nama: 'Pengurus BTM' });
              showToast('Berhasil masuk sebagai Pengurus BTM');
            } else {
              const foundJamaah = jamaahList.find(j => j.no_kk === trimmedUser);
              if (foundJamaah) {
                if (!foundJamaah.password || foundJamaah.password === trimmedPass) {
                  setUser({ username: foundJamaah.no_kk, role: 'jamaah', nama: foundJamaah.nama });
                  showToast(`Selamat datang, ${foundJamaah.nama}`);
                } else {
                  showToast('Password Jamaah salah!', 'error');
                }
              } else {
                showToast('Akun tidak ditemukan dalam sistem.', 'error');
              }
            }
          };

          return (
            <div className="min-h-screen w-full flex flex-col relative bg-slate-50 text-slate-800">
              {/* TOAST NOTIFICATION ELEGAN */}
              {toastMessage && (
                <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-bold text-white transition-all transform animate-fade-in flex items-center gap-2 ${
                  toastMessage.type === 'error' ? 'bg-rose-600' : toastMessage.type === 'info' ? 'bg-sky-600' : 'bg-emerald-700'
                }`}>
                  <span>{toastMessage.type === 'error' ? '⚠️' : toastMessage.type === 'info' ? 'ℹ️' : '✅'}</span>
                  <span>{toastMessage.message}</span>
                </div>
              )}

              {/* BANNER INSTALASI PWA */}
              {showInstallBanner && (
                <div className="bg-amber-400 text-amber-950 px-4 py-3 shadow-md flex justify-between items-center z-40 sticky top-0">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📱</span>
                    <div>
                      <p className="text-xs font-bold">Pasang Sistem Masjid ke Layar Utama</p>
                      <p className="text-[10px] opacity-90">Akses cepat tanpa membuka browser berulang kali.</p>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={handleInstallClick} className="bg-emerald-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-emerald-950">Pasang</button>
                    <button onClick={() => setShowInstallBanner(false)} className="bg-white/80 text-amber-950 px-2 py-1.5 rounded-lg text-xs font-bold">Nanti</button>
                  </div>
                </div>
              )}

              {!user ? (
                <LoginScreen 
                  onLogin={handleLogin} 
                  profilMasjid={profilMasjid} 
                  currentTime={currentTime} 
                  jamaahList={jamaahList} 
                  setJamaahList={setJamaahList}
                  onInstallClick={handleInstallClick}
                  showToast={showToast}
                />
              ) : (
                <MainLayout 
                  user={user} 
                  onLogout={() => { setUser(null); showToast('Berhasil keluar dari sistem', 'info'); }} 
                  activeMenu={activeMenu} 
                  setActiveMenu={setActiveMenu}
                  keuangan={keuangan} setKeuangan={setKeuangan}
                  jamaahList={jamaahList} setJamaahList={setJamaahList}
                  strukturBTM={strukturBTM} setStrukturBTM={setStrukturBTM}
                  profilMasjid={profilMasjid} setProfilMasjid={setProfilMasjid}
                  credentialsBTM={credentialsBTM} setCredentialsBTM={setCredentialsBTM}
                  currentTime={currentTime}
                  onInstallClick={handleInstallClick}
                  showToast={showToast}
                />
              )}
            </div>
          );
        }

        // --- HOOK JADWAL SHOLAT ---
        function useJadwalSholat() {
          const [jadwal, setJadwal] = useState({
            Imsak: '04:15', Subuh: '04:25', Terbit: '05:40', 
            Dzuhur: '11:50', Ashar: '15:10', Maghrib: '17:55', Isya: '19:05'
          });
          const [lokasiNama, setLokasiNama] = useState('Manado (Default)');
          const [loading, setLoading] = useState(false);

          const fetchJadwalByCity = (cityName) => {
            setLoading(true);
            fetch(`https://api.aladhan.com/v1/timingsByCity?city=${cityName}&country=Indonesia&method=20`)
              .then(res => res.json())
              .then(data => {
                if (data && data.data) {
                  const t = data.data.timings;
                  setJadwal({
                    Imsak: t.Imsak, Subuh: t.Fajr, Terbit: t.Sunrise,
                    Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha
                  });
                  setLokasiNama(`Kota ${cityName}`);
                }
                setLoading(false);
              })
              .catch(() => setLoading(false));
          };

          const deteksiLokasiGPS = (onDone) => {
            if (!navigator.geolocation) {
              alert('GPS tidak didukung.');
              return;
            }
            setLoading(true);
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const today = new Date();
                const dateStr = `${today.getDate()}-${today.getMonth() + 1}-${today.getFullYear()}`;

                fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${lon}&method=20`)
                  .then(res => res.json())
                  .then(data => {
                    if (data && data.data) {
                      const t = data.data.timings;
                      setJadwal({
                        Imsak: t.Imsak, Subuh: t.Fajr, Terbit: t.Sunrise,
                        Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha
                      });
                      setLokasiNama(`GPS (${lat.toFixed(2)}, ${lon.toFixed(2)})`);
                      if (onDone) onDone('Jadwal GPS berhasil dimuat');
                    }
                    setLoading(false);
                  })
                  .catch(() => setLoading(false));
              },
              () => setLoading(false)
            );
          };

          useEffect(() => { fetchJadwalByCity('Manado'); }, []);
          return { jadwal, lokasiNama, loading, fetchJadwalByCity, deteksiLokasiGPS };
        }

        // --- LAYAR LOGIN ---
        function LoginScreen({ onLogin, profilMasjid, currentTime, jamaahList, setJamaahList, onInstallClick, showToast }) {
          const [u, setU] = useState('');
          const [p, setP] = useState('');
          const [showRegister, setShowRegister] = useState(false);
          const [regForm, setRegForm] = useState({ no_kk: '', nama: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
          const { jadwal, lokasiNama, deteksiLokasiGPS, fetchJadwalByCity } = useJadwalSholat();

          const handleRegisterJamaah = (e) => {
            e.preventDefault();
            if (!regForm.no_kk || !regForm.nama || !regForm.password) {
              showToast('No KK, Nama, dan Password wajib diisi!', 'error');
              return;
            }
            if (jamaahList.some(j => j.no_kk.trim() === regForm.no_kk.trim())) {
              showToast('Nomor KK sudah terdaftar dalam sistem.', 'error');
              return;
            }

            setJamaahList([...jamaahList, { ...regForm, ktp: '-' }]);
            showToast('Pendaftaran berhasil! Silakan login.');
            setU(regForm.no_kk);
            setP(regForm.password);
            setShowRegister(false);
          };

          return (
            <div className="min-h-screen bg-emerald-950 p-4 md:p-8 flex items-center justify-center">
              <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* Bagian Kiri: Info & Jadwal */}
                <div className="space-y-4 flex flex-col justify-between">
                  <div className="bg-white/10 backdrop-blur-md rounded-2xl p-5 text-white border border-white/15 shadow-xl">
                    <div className="flex items-center gap-3 mb-3">
                      <img src={profilMasjid.logoUrl} alt="Logo" className="w-14 h-14 rounded-full object-cover border-2 border-amber-400 bg-white" />
                      <div>
                        <span className="bg-emerald-600 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Portal Masjid</span>
                        <h1 className="text-base md:text-lg font-bold mt-1 leading-tight">{profilMasjid.nama}</h1>
                      </div>
                    </div>
                    <p className="text-xs text-emerald-200">📍 {profilMasjid.alamat}</p>
                    <div className="mt-3 pt-3 border-t border-white/10 flex justify-between items-center">
                      <div>
                        <p className="text-[10px] text-emerald-300">Waktu Lokal</p>
                        <p className="text-sm font-mono font-bold">{currentTime.toLocaleTimeString('id-ID')}</p>
                      </div>
                      <button onClick={onInstallClick} className="text-[10px] bg-amber-400 text-emerald-950 font-bold px-3 py-1.5 rounded-lg shadow">📱 Pasang Aplikasi</button>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-4 shadow-xl border border-slate-200">
                    <div className="flex justify-between items-center mb-2">
                      <h3 className="font-bold text-slate-800 text-xs">⏰ Jadwal Sholat ({lokasiNama})</h3>
                      <button onClick={() => deteksiLokasiGPS((msg) => showToast(msg))} className="text-[10px] bg-emerald-700 text-white px-2 py-0.5 rounded font-bold">📍 GPS</button>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5">
                      {Object.entries(jadwal).slice(1, 6).map(([nama, waktu], i) => (
                        <div key={i} className="flex justify-between p-1.5 rounded bg-slate-50 border text-xs">
                          <span className="font-medium text-slate-700">{nama}</span>
                          <span className="font-mono font-bold text-emerald-700">{waktu}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Bagian Kanan: Form Login / Registrasi */}
                <div className="bg-white rounded-2xl p-6 shadow-2xl border border-slate-200 flex flex-col justify-center">
                  {!showRegister ? (
                    <div>
                      <div className="mb-4 text-center">
                        <h2 className="text-base font-bold text-slate-900">Masuk Sistem</h2>
                        <p className="text-[11px] text-slate-500">Masukkan No. KK Jamaah atau Akun Pengurus</p>
                      </div>
                      <div className="space-y-3">
                        <div>
                          <label className="block text-[11px] font-bold text-slate-700 mb-1">Username / No. KK</label>
                          <input type="text" className="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:bg-white transition" placeholder="Contoh: 717101..." value={u} onChange={(e) => setU(e.target.value)} />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-700 mb-1">Password</label>
                          <input type="password" className="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:bg-white transition" placeholder="••••••••" value={p} onChange={(e) => setP(e.target.value)} />
                        </div>
                        <button onClick={() => onLogin(u, p)} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white p-2.5 rounded-xl font-bold text-xs shadow-md transition">Masuk Aplikasi</button>
                        
                        <div className="text-center pt-3 border-t">
                          <p className="text-[11px] text-slate-600">Jamaah baru belum punya akun?</p>
                          <button onClick={() => setShowRegister(true)} className="mt-1 text-xs text-emerald-700 font-bold hover:underline">✨ Daftarkan Kartu Keluarga (KK)</button>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div className="flex justify-between items-center mb-3">
                        <h2 className="text-sm font-bold text-slate-900">Pendaftaran Akun Jamaah</h2>
                        <button onClick={() => setShowRegister(false)} className="text-xs text-rose-600 font-bold">Kembali</button>
                      </div>
                      <form onSubmit={handleRegisterJamaah} className="space-y-2">
                        <input type="text" placeholder="Nomor KK (Untuk Login)" className="w-full p-2 border rounded-lg text-xs" value={regForm.no_kk} onChange={(e) => setRegForm({...regForm, no_kk: e.target.value})} required />
                        <input type="text" placeholder="Nama Kepala Keluarga" className="w-full p-2 border rounded-lg text-xs" value={regForm.nama} onChange={(e) => setRegForm({...regForm, nama: e.target.value})} required />
                        <input type="password" placeholder="Atur Password Login" className="w-full p-2 border rounded-lg text-xs" value={regForm.password} onChange={(e) => setRegForm({...regForm, password: e.target.value})} required />
                        <input type="text" placeholder="Nomor WhatsApp" className="w-full p-2 border rounded-lg text-xs" value={regForm.hp} onChange={(e) => setRegForm({...regForm, hp: e.target.value})} />
                        <input type="text" placeholder="Alamat Domisili" className="w-full p-2 border rounded-lg text-xs" value={regForm.alamat} onChange={(e) => setRegForm({...regForm, alamat: e.target.value})} />
                        <input type="number" min="1" placeholder="Jumlah Anggota Keluarga" className="w-full p-2 border rounded-lg text-xs" value={regForm.jumlah} onChange={(e) => setRegForm({...regForm, jumlah: e.target.value})} />
                        <button type="submit" className="w-full bg-emerald-700 text-white p-2.5 rounded-lg font-bold text-xs hover:bg-emerald-800">Daftar Sekarang</button>
                      </form>
                    </div>
                  )}
                </div>

              </div>
            </div>
          );
        }

        // --- LAYAR UTAMA (DASHBOARD & MODUL) ---
        function MainLayout({ user, onLogout, activeMenu, setActiveMenu, keuangan, setKeuangan, jamaahList, setJamaahList, strukturBTM, setStrukturBTM, profilMasjid, setProfilMasjid, credentialsBTM, setCredentialsBTM, currentTime, onInstallClick, showToast }) {
          const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

          const menuItems = [
            { id: 'home', label: '🏠 Beranda & Profil' },
            { id: 'sholat', label: '⏰ Waktu Sholat' },
            { id: 'quran', label: '📖 Al-Quran Digital' },
            { id: 'zakat', label: '💰 Kalkulator Zakat' },
            { id: 'kiblat', label: '🧭 Arah Kiblat' },
            { id: 'dzikir', label: '📿 Dzikir & Doa' },
            { id: 'iqra', label: '📚 Materi Iqra' },
            { id: 'struktur', label: '👥 Struktur BTM' },
            { id: 'keuangan', label: '📊 Keuangan Masjid' },
            { id: 'jamaah', label: '📋 Data Jamaah' },
          ];

          return (
            <div className="min-h-screen w-full flex flex-col md:flex-row bg-slate-50">
              {/* Sidebar Desktop */}
              <aside className="hidden md:flex w-64 bg-emerald-950 text-white p-4 flex-col justify-between shadow-xl flex-shrink-0 min-h-screen">
                <div>
                  <div className="flex items-center space-x-2.5 mb-5 pb-3 border-b border-emerald-900">
                    <img src={profilMasjid.logoUrl} alt="Logo" className="w-9 h-9 rounded-full object-cover border border-amber-400 bg-white" />
                    <div className="overflow-hidden">
                      <h2 className="text-xs font-bold text-amber-400 truncate">Al-Muhajirin</h2>
                      <p className="text-[10px] text-emerald-300 uppercase tracking-wide truncate">Role: {user.role}</p>
                    </div>
                  </div>
                  <ul className="space-y-1 text-xs">
                    {menuItems.map(item => (
                      <li key={item.id} onClick={() => setActiveMenu(item.id)} className={`cursor-pointer px-3 py-2 rounded-xl transition font-medium ${activeMenu === item.id ? 'bg-emerald-800 text-amber-300 font-bold shadow' : 'hover:bg-emerald-900/60 text-slate-200'}`}>{item.label}</li>
                    ))}
                  </ul>
                </div>
                <div className="space-y-2 pt-3 border-t border-emerald-900">
                  <button onClick={onInstallClick} className="w-full bg-amber-400 hover:bg-amber-500 text-emerald-950 p-2.5 rounded-xl font-bold text-xs transition shadow">📱 Pasang Aplikasi</button>
                  <button onClick={onLogout} className="w-full bg-rose-700 hover:bg-rose-800 p-2.5 rounded-xl font-bold text-xs transition shadow">Keluar</button>
                </div>
              </aside>

              {/* Header Mobile */}
              <div className="md:hidden bg-emerald-950 text-white p-3 flex justify-between items-center shadow sticky top-0 z-30">
                <div className="flex items-center gap-2">
                  <img src={profilMasjid.logoUrl} alt="Logo" className="w-7 h-7 rounded-full object-cover border border-amber-400 bg-white" />
                  <h2 className="text-xs font-bold text-amber-400">Al-Muhajirin</h2>
                </div>
                <div className="flex gap-2">
                  <button onClick={onInstallClick} className="bg-amber-400 text-emerald-950 px-2 py-1 rounded-lg text-[10px] font-bold">📱 Pasang</button>
                  <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="bg-emerald-900 px-3 py-1 rounded-lg text-xs font-bold">
                    {mobileMenuOpen ? '✕ Tutup' : '☰ Menu'}
                  </button>
                </div>
              </div>

              {/* Dropdown Menu Mobile */}
              {mobileMenuOpen && (
                <div className="md:hidden absolute top-12 left-0 right-0 z-40 bg-emerald-950 text-white p-3 shadow-2xl border-b border-emerald-900">
                  <div className="grid grid-cols-2 gap-1.5">
                    {menuItems.map(item => (
                      <button key={item.id} onClick={() => { setActiveMenu(item.id); setMobileMenuOpen(false); }} className={`p-2 rounded-xl text-left text-xs ${activeMenu === item.id ? 'bg-emerald-800 font-bold text-amber-300' : 'bg-emerald-900/50'}`}>{item.label}</button>
                    ))}
                  </div>
                  <button onClick={onLogout} className="w-full mt-3 bg-rose-700 p-2.5 rounded-xl font-bold text-xs text-center shadow">Keluar Sistem</button>
                </div>
              )}

              {/* Area Konten */}
              <main className="flex-1 flex flex-col p-4 md:p-6 pb-12 overflow-y-auto">
                <header className="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                  <h2 className="text-sm md:text-base font-bold text-emerald-950 capitalize">{activeMenu.replace('_', ' ')}</h2>
                  <span className="text-[10px] md:text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full shadow-sm">Pengguna: {user.nama || user.username}</span>
                </header>

                <div className="flex-1">
                  {activeMenu === 'home' && <HomeModule profil={profilMasjid} setProfilMasjid={setProfilMasjid} user={user} showToast={showToast} />}
                  {activeMenu === 'sholat' && <SholatModule showToast={showToast} />}
                  {activeMenu === 'quran' && <QuranModule />}
                  {activeMenu === 'zakat' && <ZakatModule />}
                  {activeMenu === 'kiblat' && <KiblatModule />}
                  {activeMenu === 'dzikir' && <DzikirModule />}
                  {activeMenu === 'iqra' && <IqraModule />}
                  {activeMenu === 'struktur' && <StrukturModule struktur={strukturBTM} setStrukturBTM={setStrukturBTM} user={user} showToast={showToast} />}
                  {activeMenu === 'keuangan' && <KeuanganModule keuangan={keuangan} setKeuangan={setKeuangan} user={user} showToast={showToast} />}
                  {activeMenu === 'jamaah' && <JamaahModule jamaahList={jamaahList} setJamaahList={setJamaahList} user={user} credentialsBTM={credentialsBTM} setCredentialsBTM={setCredentialsBTM} showToast={showToast} />}
                </div>
              </main>
            </div>
          );
        }

        // --- MODUL BERANDA ---
        function HomeModule({ profil, setProfilMasjid, user, showToast }) {
          const [editMode, setEditMode] = useState(false);
          const [form, setForm] = useState(profil);

          const handleSave = (e) => {
            e.preventDefault();
            setProfilMasjid(form);
            setEditMode(false);
            showToast('Profil masjid berhasil diperbarui!');
          };

          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
              <div className="flex flex-col md:flex-row gap-5 items-center">
                <img src={profil.logoUrl} alt="Logo Masjid" className="w-24 h-24 rounded-full object-cover border-4 border-emerald-700 shadow-md flex-shrink-0 bg-slate-100" />
                <div className="space-y-1.5 flex-1 text-center md:text-left">
                  <h3 className="text-lg font-bold text-emerald-950">{profil.nama}</h3>
                  <p className="text-slate-600 text-xs"><strong>Alamat:</strong> {profil.alamat}</p>
                  <p className="text-slate-600 text-xs"><strong>Koordinat:</strong> {profil.koordinat}</p>
                  <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-emerald-900 text-xs font-medium">
                    ✨ Selamat datang di portal resmi operasional dan informasi digital Masjid Al-Muhajirin Wawonasa.
                  </div>
                </div>
                {(user.role === 'btm' || user.role === 'super_admin') && (
                  <button onClick={() => setEditMode(!editMode)} className="bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-emerald-800 transition shadow">
                    {editMode ? 'Tutup Edit' : '✏️ Edit Profil'}
                  </button>
                )}
              </div>

              {editMode && (
                <form onSubmit={handleSave} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                  <h4 className="font-bold text-slate-900 text-xs">Perbarui Informasi Masjid</h4>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Nama Masjid</label>
                    <input type="text" className="w-full p-2 border rounded-xl text-xs bg-white" value={form.nama} onChange={(e) => setForm({...form, nama: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Alamat</label>
                    <input type="text" className="w-full p-2 border rounded-xl text-xs bg-white" value={form.alamat} onChange={(e) => setForm({...form, alamat: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Koordinat</label>
                    <input type="text" className="w-full p-2 border rounded-xl text-xs bg-white" value={form.koordinat} onChange={(e) => setForm({...form, koordinat: e.target.value})} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-xs shadow">Simpan Perubahan</button>
                </form>
              )}
            </div>
          );
        }

        // --- MODUL SHOLAT ---
        function SholatModule({ showToast }) {
          const { jadwal, lokasiNama, loading, fetchJadwalByCity, deteksiLokasiGPS } = useJadwalSholat();

          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
              <div className="flex flex-col md:flex-row justify-between items-center gap-3">
                <div>
                  <h3 className="text-base font-bold text-emerald-950">⏰ Jadwal Sholat Otomatis</h3>
                  <p className="text-xs text-slate-500">Akurat berdasarkan deteksi GPS atau pilihan kota.</p>
                </div>
                <button onClick={() => deteksiLokasiGPS((msg) => showToast(msg))} className="bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-emerald-800 shadow transition">📍 Gunakan GPS Saya</button>
              </div>

              <div className="flex items-center gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                <span className="text-xs font-bold text-slate-700">Pilih Kota:</span>
                <select onChange={(e) => fetchJadwalByCity(e.target.value)} className="p-2 border rounded-xl text-xs bg-white font-bold text-emerald-900 shadow-sm">
                  <option value="Manado">Manado</option>
                  <option value="Jakarta">Jakarta</option>
                  <option value="Surabaya">Surabaya</option>
                  <option value="Bandung">Bandung</option>
                  <option value="Makassar">Makassar</option>
                  <option value="Bitung">Bitung</option>
                  <option value="Gorontalo">Gorontalo</option>
                </select>
              </div>

              {loading && <p className="text-xs text-emerald-700 font-bold">Memuat jadwal...</p>}

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                <div className="p-4 bg-emerald-900 text-white rounded-2xl shadow md:col-span-4 flex justify-between items-center">
                  <div>
                    <span className="text-[10px] uppercase bg-emerald-800 px-2.5 py-1 rounded-full font-bold text-amber-300">Lokasi Aktif</span>
                    <h4 className="text-sm font-bold mt-1">{lokasiNama}</h4>
                  </div>
                </div>

                {Object.entries(jadwal).map(([nama, waktu], i) => (
                  <div key={i} className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                    <span className="font-bold text-slate-800 text-xs">{nama}</span>
                    <span className="font-mono font-bold text-emerald-700 text-sm">{waktu}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // --- MODUL QURAN ---
        function QuranModule() {
          const daftarSurah = [
            { no: 1, nama: 'Al-Fatihah', arti: 'Pembukaan', ayat: 7, arab: 'الفاتحة' },
            { no: 2, nama: 'Al-Baqarah', arti: 'Sapi Betina', ayat: 286, arab: 'البقرة' },
            { no: 3, nama: 'Ali \'Imran', arti: 'Keluarga Imran', ayat: 200, arab: 'آل عمران' },
            { no: 36, nama: 'Yasin', arti: 'Yasin', ayat: 83, arab: 'يس' },
            { no: 55, nama: 'Ar-Rahman', arti: 'Yang Maha Pemurah', ayat: 78, arab: 'الرحمن' },
            { no: 56, nama: 'Al-Waqi\'ah', arti: 'Hari Kiamat', ayat: 96, arab: 'الواقعة' },
            { no: 67, nama: 'Al-Mulk', arti: 'Kerajaan', ayat: 30, arab: 'الملك' },
            { no: 112, nama: 'Al-Ikhlas', arti: 'Keesaan Allah', ayat: 4, arab: 'الإخلاص' }
          ];

          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
              <div>
                <h3 className="text-base font-bold text-emerald-950">📖 Al-Quran Digital Pilihan</h3>
                <p className="text-xs text-slate-500">Daftar surah utama untuk bacaan harian jamaah masjid.</p>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                {daftarSurah.map((s) => (
                  <div key={s.no} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center hover:border-emerald-500 transition shadow-sm">
                    <div>
                      <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">#{s.no}</span>
                      <h4 className="font-bold text-slate-900 text-sm mt-1">{s.nama}</h4>
                      <p className="text-[11px] text-slate-500">{s.arti} • {s.ayat} Ayat</p>
                    </div>
                    <span className="text-xl font-bold text-emerald-800 font-serif">{s.arab}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // --- MODUL ZAKAT ---
        function ZakatModule() {
          const [harta, setHarta] = useState('');
          const [hasil, setHasil] = useState(null);

          const hitungZakat = (e) => {
            e.preventDefault();
            const val = parseFloat(harta) || 0;
            const zakat = val * 0.025;
            setHasil(zakat);
          };

          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 max-w-xl">
              <div>
                <h3 className="text-base font-bold text-emerald-950">💰 Kalkulator Zakat Mal</h3>
                <p className="text-xs text-slate-500">Hitung kewajiban zakat harta 2.5% secara instan.</p>
              </div>
              <form onSubmit={hitungZakat} className="space-y-3">
                <div>
                  <label className="block text-[11px] font-bold text-slate-700 mb-1">Total Nilai Harta / Tabungan Setara Rupiah</label>
                  <input type="number" className="w-full p-2.5 border rounded-xl text-xs bg-slate-50" placeholder="Contoh: 50000000" value={harta} onChange={(e) => setHarta(e.target.value)} required />
                </div>
                <button type="submit" className="w-full bg-emerald-700 text-white p-2.5 rounded-xl font-bold text-xs shadow hover:bg-emerald-800">Hitung Zakat</button>
              </form>
              {hasil !== null && (
                <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-center space-y-1">
                  <p className="text-xs text-emerald-900 font-bold">Zakat Mal yang Harus Ditunaikan:</p>
                  <p className="text-lg font-mono font-bold text-emerald-700">Rp {hasil.toLocaleString('id-ID')}</p>
                </div>
              )}
            </div>
          );
        }

        // --- MODUL KIBLAT ---
        function KiblatModule() {
          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 text-center max-w-xl">
              <h3 className="text-base font-bold text-emerald-950">🧭 Panduan Arah Kiblat</h3>
              <p className="text-xs text-slate-600">Arah kiblat dari Kota Manado menghadap ke arah Barat-Barat Laut menuju Ka'bah di Makkah.</p>
              <div className="p-6 bg-slate-50 border rounded-2xl shadow-inner flex flex-col items-center justify-center space-y-2">
                <span className="text-4xl">🕋</span>
                <p className="font-bold text-sm text-emerald-900">Derajat Kiblat: ~292° Dari Utara</p>
              </div>
            </div>
          );
        }

        // --- MODUL DZIKIR ---
        function DzikirModule() {
          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
              <h3 className="text-base font-bold text-emerald-950">📿 Dzikir & Doa Harian</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div className="p-4 bg-slate-50 rounded-2xl border shadow-sm space-y-1">
                  <h4 className="font-bold text-emerald-900 text-xs">Dzikir Pagi</h4>
                  <p className="text-xs text-slate-600">Dibaca setelah sholat Subuh hingga terbit matahari.</p>
                </div>
                <div className="p-4 bg-slate-50 rounded-2xl border shadow-sm space-y-1">
                  <h4 className="font-bold text-emerald-900 text-xs">Dzikir Petang</h4>
                  <p className="text-xs text-slate-600">Dibaca setelah sholat Ashar atau Maghrib.</p>
                </div>
              </div>
            </div>
          );
        }

        // --- MODUL IQRA ---
        function IqraModule() {
          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
              <h3 className="text-base font-bold text-emerald-950">📚 Panduan Materi Iqra</h3>
              <p className="text-xs text-slate-600">Modul belajar membaca Al-Quran untuk anak-anak dan jamaah pemula.</p>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                {[1, 2, 3, 4, 5, 6].map((i) => (
                  <div key={i} className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-center font-bold text-emerald-900 text-sm shadow-sm">
                    Buku Iqra Jilid {i}
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // --- MODUL STRUKTUR BTM ---
        function StrukturModule({ struktur, setStrukturBTM, user, showToast }) {
          const [editMode, setEditMode] = useState(false);
          const [form, setForm] = useState(struktur);

          const handleSave = (e) => {
            e.preventDefault();
            setStrukturBTM(form);
            setEditMode(false);
            showToast('Struktur BTM berhasil diperbarui!');
          };

          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
              <div className="flex justify-between items-center">
                <div>
                  <h3 className="text-base font-bold text-emerald-950">👥 Susunan Pengurus BTM</h3>
                  <p className="text-xs text-slate-500">Badan Takmir Masjid Al-Muhajirin Wawonasa.</p>
                </div>
                {(user.role === 'btm' || user.role === 'super_admin') && (
                  <button onClick={() => setEditMode(!editMode)} className="bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow hover:bg-emerald-800">
                    {editMode ? 'Tutup' : '✏️ Edit Struktur'}
                  </button>
                )}
              </div>

              {!editMode ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {Object.entries(struktur).map(([key, val], i) => (
                    <div key={i} className="p-3.5 bg-slate-50 rounded-2xl border shadow-sm">
                      <span className="text-[10px] text-emerald-700 font-bold uppercase">{key}</span>
                      <p className="font-bold text-slate-900 text-xs mt-0.5">{val}</p>
                    </div>
                  ))}
                </div>
              ) : (
                <form onSubmit={handleSave} className="p-4 bg-slate-50 rounded-2xl border space-y-3">
                  <h4 className="font-bold text-slate-900 text-xs">Ubah Pengurus BTM</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {Object.keys(struktur).map((k) => (
                      <div key={k}>
                        <label className="block text-[10px] font-bold text-slate-700 uppercase mb-1">{k}</label>
                        <input type="text" className="w-full p-2 border rounded-xl text-xs bg-white" value={form[k]} onChange={(e) => setForm({...form, [k]: e.target.value})} />
                      </div>
                    ))}
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-xs shadow">Simpan Struktur</button>
                </form>
              )}
            </div>
          );
        }

        // --- MODUL KEUANGAN ---
        function KeuanganModule({ keuangan, setKeuangan, user, showToast }) {
          const [uraian, setUraian] = useState('');
          const [masuk, setMasuk] = useState('');
          const [keluar, setKeluar] = useState('');

          const totalMasuk = keuangan.reduce((a, b) => a + b.masuk, 0);
          const totalKeluar = keuangan.reduce((a, b) => a + b.keluar, 0);
          const saldoAkhir = totalMasuk - totalKeluar;

          const handleAdd = (e) => {
            e.preventDefault();
            if (!uraian) return;
            const m = parseFloat(masuk) || 0;
            const k = parseFloat(keluar) || 0;
            const newItem = { id: Date.now(), tanggal: new Date().toISOString().split('T')[0], uraian, masuk: m, keluar: k };
            setKeuangan([...keuangan, newItem]);
            setUraian(''); setMasuk(''); setKeluar('');
            showToast('Catatan keuangan ditambahkan.');
          };

          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
              <h3 className="text-base font-bold text-emerald-950">📊 Transparansi Keuangan Masjid</h3>
              
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl shadow-sm">
                  <p className="text-[10px] font-bold text-emerald-800 uppercase">Total Pemasukan</p>
                  <p className="text-base font-bold text-emerald-900 mt-1">Rp {totalMasuk.toLocaleString('id-ID')}</p>
                </div>
                <div className="p-4 bg-rose-50 border border-rose-200 rounded-2xl shadow-sm">
                  <p className="text-[10px] font-bold text-rose-800 uppercase">Total Pengeluaran</p>
                  <p className="text-base font-bold text-rose-900 mt-1">Rp {totalKeluar.toLocaleString('id-ID')}</p>
                </div>
                <div className="p-4 bg-sky-50 border border-sky-200 rounded-2xl shadow-sm">
                  <p className="text-[10px] font-bold text-sky-800 uppercase">Saldo Kas Akhir</p>
                  <p className="text-base font-bold text-sky-900 mt-1">Rp {saldoAkhir.toLocaleString('id-ID')}</p>
                </div>
              </div>

              {(user.role === 'btm' || user.role === 'super_admin') && (
                <form onSubmit={handleAdd} className="p-4 bg-slate-50 border rounded-2xl space-y-3">
                  <h4 className="font-bold text-slate-900 text-xs">Tambah Transaksi Kas</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <input type="text" placeholder="Uraian Transaksi" className="p-2 border rounded-xl text-xs bg-white" value={uraian} onChange={(e) => setUraian(e.target.value)} required />
                    <input type="number" placeholder="Masuk (Rp)" className="p-2 border rounded-xl text-xs bg-white" value={masuk} onChange={(e) => setMasuk(e.target.value)} />
                    <input type="number" placeholder="Keluar (Rp)" className="p-2 border rounded-xl text-xs bg-white" value={keluar} onChange={(e) => setKeluar(e.target.value)} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-xs shadow">Tambah Kas</button>
                </form>
              )}

              <div className="overflow-x-auto">
                <table className="w-full text-xs text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 border-b">
                      <th className="p-3">Tanggal</th>
                      <th className="p-3">Uraian</th>
                      <th className="p-3 text-right">Masuk</th>
                      <th className="p-3 text-right">Keluar</th>
                    </tr>
                  </thead>
                  <tbody>
                    {keuangan.map((item) => (
                      <tr key={item.id} className="border-b hover:bg-slate-50">
                        <td className="p-3">{item.tanggal}</td>
                        <td className="p-3 font-medium">{item.uraian}</td>
                        <td className="p-3 text-right text-emerald-700 font-semibold">{item.masuk ? `Rp ${item.masuk.toLocaleString('id-ID')}` : '-'}</td>
                        <td className="p-3 text-right text-rose-700 font-semibold">{item.keluar ? `Rp ${item.keluar.toLocaleString('id-ID')}` : '-'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        // --- MODUL JAMAAH ---
        function JamaahModule({ jamaahList, setJamaahList, user, credentialsBTM, setCredentialsBTM, showToast }) {
          const [search, setSearch] = useState('');
          const [btmUserForm, setBtmUserForm] = useState(credentialsBTM.user);
          const [btmPassForm, setBtmPassForm] = useState(credentialsBTM.pass);

          const filtered = jamaahList.filter(j => j.nama.toLowerCase().includes(search.toLowerCase()) || j.no_kk.includes(search));

          const handleUpdateBTMAuth = (e) => {
            e.preventDefault();
            setCredentialsBTM({ user: btmUserForm, pass: btmPassForm });
            showToast('Kredensial login BTM berhasil diperbarui!');
          };

          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
              <div className="flex flex-col sm:flex-row justify-between items-center gap-3">
                <div>
                  <h3 className="text-base font-bold text-emerald-950">📋 Data Kartu Keluarga Jamaah</h3>
                  <p className="text-xs text-slate-500">Terdaftar dalam sistem pendataan Masjid Al-Muhajirin.</p>
                </div>
                <input type="text" placeholder="Cari nama / No KK..." className="p-2 border rounded-xl text-xs w-full sm:w-64 bg-slate-50" value={search} onChange={(e) => setSearch(e.target.value)} />
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-xs text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 border-b">
                      <th className="p-3">No. KK</th>
                      <th className="p-3">Kepala Keluarga</th>
                      <th className="p-3">No. WhatsApp</th>
                      <th className="p-3">Alamat</th>
                      <th className="p-3 text-center">Jiwa</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.length > 0 ? filtered.map((j, i) => (
                      <tr key={i} className="border-b hover:bg-slate-50">
                        <td className="p-3 font-mono font-bold">{j.no_kk}</td>
                        <td className="p-3 font-medium">{j.nama}</td>
                        <td className="p-3">{j.hp}</td>
                        <td className="p-3">{j.alamat}</td>
                        <td className="p-3 text-center">{j.jumlah}</td>
                      </tr>
                    )) : (
                      <tr><td colSpan="5" className="p-4 text-center text-slate-400">Data jamaah tidak ditemukan.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>

              {user.role === 'super_admin' && (
                <div className="p-4 bg-amber-50 rounded-2xl border border-amber-200 space-y-3">
                  <h4 className="font-bold text-amber-950 text-xs">⚙️ Pengaturan Akun Pengurus BTM</h4>
                  <form onSubmit={handleUpdateBTMAuth} className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" className="p-2 border rounded-xl text-xs bg-white" placeholder="Username BTM" value={btmUserForm} onChange={(e) => setBtmUserForm(e.target.value)} required />
                    <input type="text" className="p-2 border rounded-xl text-xs bg-white" placeholder="Password BTM" value={btmPassForm} onChange={(e) => setBtmPassForm(e.target.value)} required />
                    <button type="submit" className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl font-bold text-xs sm:col-span-2 shadow">Perbarui Akses BTM</button>
                  </form>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
