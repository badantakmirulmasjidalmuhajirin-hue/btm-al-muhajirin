<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Masjid Al-Muhajirin Wawonasa</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen m-0 p-0">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
          const [user, setUser] = useState(() => {
            const savedUser = localStorage.getItem('masjid_user');
            return savedUser ? JSON.parse(savedUser) : null;
          });
          const [activeMenu, setActiveMenu] = useState('home');
          const [currentTime, setCurrentTime] = useState(new Date());
          const [installPrompt, setInstallPrompt] = useState(null);
          const [showInstallBanner, setShowInstallBanner] = useState(false);

          useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            if (user) {
              localStorage.setItem('masjid_user', JSON.stringify(user));
            } else {
              localStorage.removeItem('masjid_user');
            }
          }, [user]);

          useEffect(() => {
            const handleBeforeInstallPrompt = (e) => {
              e.preventDefault();
              setInstallPrompt(e);
              setShowInstallBanner(true);
            };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = () => {
            if (installPrompt) {
              installPrompt.prompt();
              installPrompt.userChoice.then((choiceResult) => {
                setInstallPrompt(null);
                setShowInstallBanner(false);
              });
            } else {
              alert('Untuk menginstal aplikasi ini ke layar utama HP:\n1. Ketuk ikon titik tiga (menu) browser.\n2. Pilih "Tambahkan ke Layar Utama".');
              setShowInstallBanner(false);
            }
          };

          const [keuangan, setKeuangan] = useState(() => {
            const saved = localStorage.getItem('masjid_keuangan');
            return saved ? JSON.parse(saved) : [
              { id: 1, tanggal: '2026-06-01', uraianMasuk: 'Saldo Awal Bulan', uangMasuk: 5000000, uangKeluar: 0, uraianKeluar: '-', saldo: 5000000 },
              { id: 2, tanggal: '2026-06-05', uraianMasuk: 'Kotak Amal Jumat', uangMasuk: 1250000, uangKeluar: 0, uraianKeluar: '-', saldo: 6250000 }
            ];
          });

          useEffect(() => {
            localStorage.setItem('masjid_keuangan', JSON.stringify(keuangan));
          }, [keuangan]);

          const [jamaahList, setJamaahList] = useState(() => {
            const saved = localStorage.getItem('masjid_jamaah');
            return saved ? JSON.parse(saved) : [
              { no_kk: '7171011234560001', nama: 'H. Abdullah', ktp: '7171011234560001', hp: '081234567890', alamat: 'Wawonasa Lingkungan I', jumlah: 4, anggota: 'H. Abdullah, Hj. Aminah, Ahmad, Fatimah', password: '123' }
            ];
          });

          useEffect(() => {
            localStorage.setItem('masjid_jamaah', JSON.stringify(jamaahList));
          }, [jamaahList]);

          const [strukturBTM, setStrukturBTM] = useState(() => {
            const saved = localStorage.getItem('masjid_struktur');
            return saved ? JSON.parse(saved) : {
              ketua: 'BILAL',
              wakilKetua1: 'Dra. ASNI VAN GOBEL',
              wakilKetua2: 'ISMAIL ABDUL',
              wakilKetua3: '[Nama Wakil Ketua 3]',
              sekretaris: 'SAHRUL SUBEO',
              wakilSekretaris1: 'IRWAN ADAM',
              wakilSekretaris2: 'FAHRI HARAS',
              bendahara: 'Hj. VONNY MA\'ARUF',
              wakilBendahara1: 'ROMANTIKA ALI',
              wakilBendahara2: '[Nama Wakil Bendahara 2]',
              ketuaPembangunan: 'YUSUP BIDASI',
              koordinatorIdarah: 'ARSYAD TUE',
              koordinatorRiyah: 'YUSUP BIDASI',
              koordinatorImarah: 'BUDHIARTO NIKIULU'
            };
          });

          useEffect(() => {
            localStorage.setItem('masjid_struktur', JSON.stringify(strukturBTM));
          }, [strukturBTM]);

          const [profilMasjid, setProfilMasjid] = useState(() => {
            const saved = localStorage.getItem('masjid_profil');
            return saved ? JSON.parse(saved) : {
              nama: 'Masjid Al-Muhajirin Wawonasa',
              alamat: 'Jl. Trans Wawonasa, Kecamatan Singkil, Kota Manado, Sulawesi Utara',
              koordinat: '1.4931° N, 124.8412° E',
              mapsEmbedUrl: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3988.541295834!2d124.839!3d1.493!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMsKwMjknMzUuMiJOIDEyNMKwNTAnMjguMyJF!5e0!3m2!1sid!2sid!4v1600000000000!5m2!1sid!2sid',
              logoUrl: 'logo.jpg'
            };
          });

          useEffect(() => {
            localStorage.setItem('masjid_profil', JSON.stringify(profilMasjid));
          }, [profilMasjid]);

          const [credentialsBTM] = useState({ user: 'btm_masjid', pass: '2026-2029' });
          const [credentialsSuper] = useState({ user: 'super_admin', pass: '2026-2029' });

          const handleLogin = (username, password) => {
            const trimmedUser = username.trim();
            const trimmedPass = password.trim();

            if (trimmedUser === credentialsSuper.user && trimmedPass === credentialsSuper.pass) {
              setUser({ username: trimmedUser, role: 'super_admin', nama: 'Super Admin' });
            } else if (trimmedUser === credentialsBTM.user && trimmedPass === credentialsBTM.pass) {
              setUser({ username: trimmedUser, role: 'btm', nama: 'Pengurus BTM' });
            } else {
              const foundJamaah = jamaahList.find(j => j.no_kk === trimmedUser);
              if (foundJamaah) {
                if (!foundJamaah.password || foundJamaah.password === trimmedPass) {
                  setUser({ username: foundJamaah.no_kk, role: 'jamaah', nama: foundJamaah.nama });
                } else {
                  alert('Password Jamaah salah!');
                }
              } else {
                alert('Login Gagal! Username / Nomor KK tidak ditemukan.');
              }
            }
          };

          return (
            <div className="min-h-screen w-full flex flex-col relative bg-gray-50 pb-10">
              {showInstallBanner && (
                <div className="absolute top-0 left-0 right-0 z-50 bg-yellow-400 text-emerald-950 p-2.5 shadow-lg flex justify-between items-center px-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">📱</span>
                    <div>
                      <p className="text-xs font-extrabold">Pasang Aplikasi ke Layar HP?</p>
                      <p className="text-[10px] opacity-80">Akses cepat tanpa buka browser.</p>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={handleInstallClick} className="bg-emerald-900 text-white px-2.5 py-1 rounded-lg text-xs font-bold">Pasang</button>
                    <button onClick={() => setShowInstallBanner(false)} className="bg-white/60 text-emerald-950 px-2 py-1 rounded-lg text-xs font-bold">Nanti</button>
                  </div>
                </div>
              )}

              {!user ? (
                <LoginScreen 
                  onLogin={handleLogin} 
                  profilMasjid={profilMasjid} 
                  currentTime={currentTime} 
                  jamaahList={jamaahList} 
                  setJamaahList={setJamaahList}
                  onInstallClick={handleInstallClick}
                />
              ) : (
                <MainLayout 
                  user={user} 
                  onLogout={() => setUser(null)} 
                  activeMenu={activeMenu} 
                  setActiveMenu={setActiveMenu}
                  keuangan={keuangan} setKeuangan={setKeuangan}
                  jamaahList={jamaahList} setJamaahList={setJamaahList}
                  strukturBTM={strukturBTM} setStrukturBTM={setStrukturBTM}
                  profilMasjid={profilMasjid} setProfilMasjid={setProfilMasjid}
                  currentTime={currentTime}
                  onInstallClick={handleInstallClick}
                />
              )}
            </div>
          );
        }

        function useJadwalSholat() {
          const [jadwal, setJadwal] = useState({
            Imsak: '04:15', Subuh: '04:25', Terbit: '05:40', 
            Dzuhur: '11:50', Ashar: '15:10', Maghrib: '17:55', Isya: '19:05'
          });
          const [lokasiNama, setLokasiNama] = useState('Manado (Default)');
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState(null);
          const [notificationMsg, setNotificationMsg] = useState(null);

          const fetchJadwalByCity = (cityName) => {
            setLoading(true);
            setError(null);
            fetch(`https://api.aladhan.com/v1/timingsByCity?city=${cityName}&country=Indonesia&method=20`)
              .then(res => res.json())
              .then(data => {
                if (data && data.data) {
                  const t = data.data.timings;
                  setJadwal({
                    Imsak: t.Imsak, Subuh: t.Fajr, Terbit: t.Sunrise,
                    Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha
                  });
                  setLokasiNama(`Kota ${cityName}`);
                }
                setLoading(false);
              })
              .catch(() => {
                setError('Gagal memuat jadwal online.');
                setLoading(false);
              });
          };

          const deteksiLokasiGPS = () => {
            if (!navigator.geolocation) {
              alert('GPS tidak didukung di perangkat ini.');
              return;
            }
            setLoading(true);
            setError(null);
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const today = new Date();
                const dateStr = `${today.getDate()}-${today.getMonth() + 1}-${today.getFullYear()}`;

                fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${lon}&method=20`)
                  .then(res => res.json())
                  .then(data => {
                    if (data && data.data) {
                      const t = data.data.timings;
                      setJadwal({
                        Imsak: t.Imsak, Subuh: t.Fajr, Terbit: t.Sunrise,
                        Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha
                      });
                      setLokasiNama(`GPS Anda (${lat.toFixed(2)}, ${lon.toFixed(2)})`);
                    }
                    setLoading(false);
                  })
                  .catch(() => {
                    setError('Gagal mengambil koordinat GPS.');
                    setLoading(false);
                  });
              },
              () => {
                setError('Akses GPS ditolak.');
                setLoading(false);
              }
            );
          };

          // Pengecekan real-time untuk Notifikasi Adzan
          useEffect(() => {
            const interval = setInterval(() => {
              const now = new Date();
              const hours = String(now.getHours()).padStart(2, '0');
              const minutes = String(now.getMinutes()).padStart(2, '0');
              const currentTimeStr = `${hours}:${minutes}`;

              Object.entries(jadwal).forEach(([sholatName, waktuSholat]) => {
                if (['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'].includes(sholatName) && waktuSholat === currentTimeStr) {
                  setNotificationMsg(`🔔 Waktu ${sholatName} Telah Tiba (${waktuSholat}). Mari segera menunaikan sholat berjamaah di Masjid Al-Muhajirin!`);
                }
              });
            }, 30000); // cek tiap 30 detik
            return () => clearInterval(interval);
          }, [jadwal]);

          useEffect(() => {
            fetchJadwalByCity('Manado');
          }, []);

          return { jadwal, lokasiNama, loading, error, fetchJadwalByCity, deteksiLokasiGPS, notificationMsg, setNotificationMsg };
        }

        function LoginScreen({ onLogin, profilMasjid, currentTime, jamaahList, setJamaahList, onInstallClick }) {
          const [u, setU] = useState('');
          const [p, setP] = useState('');
          const [showRegister, setShowRegister] = useState(false);
          const [regForm, setRegForm] = useState({ no_kk: '', nama: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
          const { jadwal, lokasiNama, deteksiLokasiGPS, fetchJadwalByCity, notificationMsg, setNotificationMsg } = useJadwalSholat();

          const handleRegisterJamaah = (e) => {
            e.preventDefault();
            if (!regForm.no_kk || !regForm.nama || !regForm.password) {
              alert('Nomor KK, Nama, dan Password wajib diisi!');
              return;
            }
            if (jamaahList.some(item => item.no_kk.trim() === regForm.no_kk.trim())) {
              alert(`Nomor KK "${regForm.no_kk}" sudah terdaftar.`);
              return;
            }
            setJamaahList([...jamaahList, { ...regForm, jumlah: parseInt(regForm.jumlah) || 1 }]);
            alert('Pendaftaran berhasil! Silakan login.');
            setU(regForm.no_kk);
            setP(regForm.password);
            setShowRegister(false);
          };

          return (
            <div className="min-h-screen w-full bg-emerald-950 p-3 sm:p-5 flex flex-col justify-center items-center">
              {notificationMsg && (
                <div className="fixed top-4 left-4 right-4 z-50 bg-yellow-400 text-emerald-950 p-3 rounded-xl shadow-2xl flex justify-between items-center border-2 border-emerald-900 animate-bounce">
                  <p className="text-xs font-bold">{notificationMsg}</p>
                  <button onClick={() => setNotificationMsg(null)} className="bg-emerald-950 text-white px-2 py-1 rounded text-[10px]">Tutup</button>
                </div>
              )}

              <div className="max-w-4xl w-full space-y-3 my-auto">
                <div className="bg-white/15 backdrop-blur-md rounded-xl p-3.5 text-white border border-white/20 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-3">
                  <div className="flex items-center gap-3 text-center sm:text-left">
                    <img src={profilMasjid.logoUrl} alt="Logo" className="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover border-2 border-yellow-400 bg-white mx-auto sm:mx-0 flex-shrink-0" />
                    <div>
                      <div className="flex items-center justify-center sm:justify-start gap-2">
                        <span className="bg-emerald-600 text-white text-[9px] px-2 py-0.5 rounded-full font-bold uppercase">Portal Resmi</span>
                        <button onClick={onInstallClick} className="text-[9px] bg-yellow-400 text-emerald-950 font-bold px-2 py-0.5 rounded">📱 Pasang Aplikasi</button>
                      </div>
                      <h1 className="text-sm sm:text-xl font-extrabold mt-1">{profilMasjid.nama}</h1>
                      <p className="text-[11px] text-emerald-200">📍 {profilMasjid.alamat}</p>
                    </div>
                  </div>
                  <div className="text-center sm:text-right bg-emerald-900/80 p-2.5 rounded-lg border border-emerald-700/50 w-full sm:w-auto">
                    <p className="text-[10px] text-emerald-300">Waktu Real-Time</p>
                    <p className="text-lg font-mono font-bold text-white">{currentTime.toLocaleTimeString('id-ID')}</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pb-4">
                  <div className="bg-white rounded-xl p-3.5 shadow-xl border border-emerald-100 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <h3 className="font-bold text-emerald-900 text-xs">⏰ Jadwal Sholat</h3>
                        <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">{lokasiNama}</span>
                      </div>
                      <div className="flex gap-2 mb-2">
                        <button onClick={deteksiLokasiGPS} className="text-[10px] bg-emerald-700 text-white px-2 py-1 rounded font-bold">📍 GPS Saya</button>
                        <select onChange={(e) => fetchJadwalByCity(e.target.value)} className="text-[10px] border border-emerald-300 rounded p-1 bg-white text-emerald-900 font-semibold">
                          <option value="Manado">Kota: Manado</option>
                          <option value="Jakarta">Jakarta</option>
                          <option value="Surabaya">Surabaya</option>
                          <option value="Makassar">Makassar</option>
                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {Object.entries(jadwal).map(([nama, waktu], idx) => (
                          <div key={idx} className="flex justify-between items-center p-1.5 rounded bg-emerald-50/70 border border-emerald-100 text-xs">
                            <span className="font-semibold text-emerald-950">{nama}</span>
                            <span className="font-mono font-bold text-emerald-700">{waktu}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl p-3.5 shadow-xl border border-emerald-100 flex flex-col justify-center">
                    {!showRegister ? (
                      <div>
                        <div className="text-center mb-2.5">
                          <h3 className="text-sm font-bold text-emerald-900">Masuk ke Aplikasi</h3>
                          <p className="text-[10px] text-gray-500">Jamaah (No KK), BTM, atau Super Admin</p>
                        </div>
                        <div className="space-y-2">
                          <div>
                            <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Username / No. KK</label>
                            <input type="text" className="w-full p-2 border rounded-lg text-xs" placeholder="No KK / btm_masjid / super_admin" value={u} onChange={(e) => setU(e.target.value)} />
                          </div>
                          <div>
                            <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Password</label>
                            <input type="password" className="w-full p-2 border rounded-lg text-xs" placeholder="Password" value={p} onChange={(e) => setP(e.target.value)} />
                          </div>
                          <button onClick={() => onLogin(u, p)} className="w-full bg-emerald-700 text-white p-2 rounded-lg font-bold text-xs hover:bg-emerald-800">Masuk</button>
                          <div className="text-center pt-1 border-t">
                            <button onClick={() => setShowRegister(true)} className="text-[10px] text-emerald-700 font-bold hover:underline">✨ Daftarkan Kartu Keluarga (KK) Jamaah</button>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <div className="flex justify-between items-center mb-2">
                          <h3 className="text-xs font-bold text-emerald-900">Daftar Akun Jamaah</h3>
                          <button onClick={() => setShowRegister(false)} className="text-[10px] text-red-600 font-bold">Kembali</button>
                        </div>
                        <form onSubmit={handleRegisterJamaah} className="space-y-2 text-xs">
                          <input type="text" placeholder="Nomor KK (Username Login)" className="w-full p-1.5 border rounded text-[10px]" value={regForm.no_kk} onChange={(e) => setRegForm({...regForm, no_kk: e.target.value})} required />
                          <input type="text" placeholder="Nama Kepala Keluarga" className="w-full p-1.5 border rounded text-[10px]" value={regForm.nama} onChange={(e) => setRegForm({...regForm, nama: e.target.value})} required />
                          <input type="password" placeholder="Buat Password" className="w-full p-1.5 border rounded text-[10px]" value={regForm.password} onChange={(e) => setRegForm({...regForm, password: e.target.value})} required />
                          <input type="text" placeholder="No HP / WhatsApp" className="w-full p-1.5 border rounded text-[10px]" value={regForm.hp} onChange={(e) => setRegForm({...regForm, hp: e.target.value})} />
                          <input type="text" placeholder="Alamat" className="w-full p-1.5 border rounded text-[10px]" value={regForm.alamat} onChange={(e) => setRegForm({...regForm, alamat: e.target.value})} />
                          <button type="submit" className="w-full bg-emerald-700 text-white p-2 rounded font-bold text-[10px]">Daftar</button>
                        </form>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function MainLayout({ user, onLogout, activeMenu, setActiveMenu, keuangan, setKeuangan, jamaahList, setJamaahList, strukturBTM, setStrukturBTM, profilMasjid, setProfilMasjid, currentTime, onInstallClick }) {
          const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
          const { notificationMsg, setNotificationMsg } = useJadwalSholat();

          const menuItems = [
            { id: 'home', label: 'Beranda & Profil' },
            { id: 'sholat', label: 'Waktu Sholat' },
            { id: 'quran', label: 'Al-Quran Digital' },
            { id: 'zakat', label: 'Kalkulator Zakat' },
            { id: 'kiblat', label: 'Arah Kiblat' },
            { id: 'dzikir', label: 'Dzikir & Doa' },
            { id: 'iqra', label: 'Materi Iqra' },
            { id: 'struktur', label: 'Struktur BTM' },
            { id: 'keuangan', label: 'Keuangan Masjid' },
            { id: 'jamaah', label: 'Data Jamaah' },
          ];

          return (
            <div className="min-h-screen w-full flex flex-col md:flex-row bg-gray-50">
              {notificationMsg && (
                <div className="fixed top-3 left-3 right-3 z-50 bg-yellow-400 text-emerald-950 p-3 rounded-xl shadow-2xl flex justify-between items-center border-2 border-emerald-900">
                  <p className="text-xs font-bold">{notificationMsg}</p>
                  <button onClick={() => setNotificationMsg(null)} className="bg-emerald-950 text-white px-2 py-1 rounded text-[10px]">Tutup</button>
                </div>
              )}

              {/* Sidebar Desktop */}
              <div className="hidden md:flex w-60 bg-emerald-950 text-white p-3.5 flex-col justify-between shadow-lg flex-shrink-0 min-h-screen">
                <div>
                  <div className="flex items-center space-x-2 mb-3 pb-2 border-b border-emerald-800">
                    <img src={profilMasjid.logoUrl} alt="Logo" className="w-8 h-8 rounded-full object-cover border border-yellow-400 bg-white" />
                    <div className="overflow-hidden">
                      <h2 className="text-xs font-bold text-yellow-400 truncate">Al-Muhajirin</h2>
                      <p className="text-[9px] text-emerald-300 truncate">Role: {user.role}</p>
                    </div>
                  </div>
                  <ul className="space-y-1 text-xs">
                    {menuItems.map(item => (
                      <li key={item.id} onClick={() => setActiveMenu(item.id)} className={`cursor-pointer p-2 rounded-lg transition ${activeMenu === item.id ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>{item.label}</li>
                    ))}
                  </ul>
                </div>
                <div className="space-y-2 pt-2 border-t border-emerald-800 mt-3">
                  <button onClick={onInstallClick} className="w-full bg-yellow-500 hover:bg-yellow-600 text-emerald-950 p-2 rounded-lg font-bold text-xs">📱 Pasang Aplikasi</button>
                  <button onClick={onLogout} className="w-full bg-red-700 hover:bg-red-800 p-2 rounded-lg font-bold text-xs">Keluar</button>
                </div>
              </div>

              {/* Navbar Mobile */}

                  {activeMenu === 'kiblat' && <KiblatModule />}

                  {activeMenu === 'iqra' && <IqraModule />}

        // --- BERANDA & PROFIL DENGAN GOOGLE MAPS GPS ---

          const [editMode, setEditMode] = useState(false);
          const [form, setForm] = useState(profil);

          const handleSave = (e) => {
            e.preventDefault();
            setProfilMasjid(form);
            setEditMode(false);
            alert('Profil masjid berhasil diperbarui!');

          return (
            <div className="bg-white p-3.5 sm:p-5 rounded-xl shadow border space-y-4">
              <div className="flex flex-col sm:flex-row gap-4 items-center text-center sm:text-left">
                <img src={profil.logoUrl} alt="Logo Masjid" className="w-20 h-20 sm:w-24 sm:h-24 rounded-full object-cover border-4 border-emerald-600 shadow-md flex-shrink-0" />
                <div className="space-y-1 flex-1">
                  <h3 className="text-base sm:text-xl font-bold text-emerald-900">{profil.nama}</h3>
                  <p className="text-gray-600 text-xs"><strong>Alamat:</strong> {profil.alamat}</p>
                  <p className="text-gray-600 text-xs"><strong>Koordinat GPS:</strong> {profil.koordinat}</p>
                  <p className="text-[10px] text-emerald-700 font-semibold bg-emerald-50 p-2 rounded border border-emerald-200">✨ Selamat datang di portal resmi manajemen digital Masjid Al-Muhajirin Wawonasa.</p>

                {user.role === 'super_admin' && (
                  <button onClick={() => setEditMode(!editMode)} className="bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-800">

              {editMode && (
                <form onSubmit={handleSave} className="p-3 bg-emerald-50 rounded-xl border space-y-2.5 text-xs">

                  <div>
                    <label className="block font-bold text-gray-700">Nama Masjid</label>
                    <input type="text" className="w-full p-1.5 border rounded bg-white" value={form.nama} onChange={(e) => setForm({...form, nama: e.target.value})} />
                  </div>
                  <div>
                    <label className="block font-bold text-gray-700">Alamat</label>
                    <input type="text" className="w-full p-1.5 border rounded bg-white" value={form.alamat} onChange={(e) => setForm({...form, alamat: e.target.value})} />
                  </div>
                  <div>
                    <label className="block font-bold text-gray-700">Koordinat Teks</label>
                    <input type="text" className="w-full p-1.5 border rounded bg-white" value={form.koordinat} onChange={(e) => setForm({...form, koordinat: e.target.value})} />
                  </div>
                  <div>
                    <label className="block font-bold text-gray-700">Google Maps Embed URL</label>
                    <input type="text" className="w-full p-1.5 border rounded bg-white" value={form.mapsEmbedUrl} onChange={(e) => setForm({...form, mapsEmbedUrl: e.target.value})} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-3 py-1.5 rounded font-bold">Simpan</button>
                </form>
              )}

              {/* Google Maps Lokasi Masjid */}
              <div className="space-y-2 pt-2 border-t">
                <h4 className="font-bold text-emerald-900 text-xs sm:text-sm">📍 Peta Lokasi (Google Maps GPS)</h4>
                <div className="w-full h-64 sm:h-80 rounded-xl overflow-hidden border shadow-inner bg-gray-100">
                  <iframe 
                    title="Google Maps Masjid Al-Muhajirin Wawonasa"
                    src={profil.mapsEmbedUrl} 
                    width="100%" 
                    height="100%" 
                    style={{ border: 0 }} 
                    allowFullScreen="" 
                    loading="lazy" 
                    referrerPolicy="no-referrer-when-downgrade">

        function QuranModule() {
          const [search, setSearch] = useState('');
          const [selectedSurah, setSelectedSurah] = useState(null);
          const [ayahs, setAyahs] = useState([]);
          const [loadingAyahs, setLoadingAyahs] = useState(false);

          const daftarSurah114 = [
            { no: 1, nama: 'Al-Fatihah', arti: 'Pembukaan', ayat: 7, arab: 'الفاتحة' },
            { no: 2, nama: 'Al-Baqarah', arti: 'Sapi Betina', ayat: 286, arab: 'البقرة' },
            { no: 36, nama: 'Yasin', arti: 'Yasin', ayat: 83, arab: 'يس' },
            { no: 56, nama: 'Al-Waqi\'ah', arti: 'Hari Kiamat', ayat: 96, arab: 'واقعة' },
            { no: 67, nama: 'Al-Mulk', arti: 'Kerajaan', ayat: 30, arab: 'الملك' },
            { no: 112, nama: 'Al-Ikhlas', arti: 'Keesaan Allah', ayat: 4, arab: 'الإخلاص' },
            { no: 114, nama: 'An-Nas', arti: 'Manusia', ayat: 6, arab: 'الناس' }
          ];

          const handleSelectSurah = (surah) => {
            setSelectedSurah(surah);
            setLoadingAyahs(true);
            fetch(`https://api.alquran.cloud/v1/surah/${surah.no}/editions/quran-uthmani,id.indonesian`)
              .then(res => res.json())
              .then(data => {
                if (data && data.data) {
                  const arabicAyahs = data.data[0].ayahs;
                  const indoAyahs = data.data[1].ayahs;
                  const combined = arabicAyahs.map((item, index) => ({
                    numberInSurah: item.numberInSurah,
                    text: item.text,
                    translation: indoAyahs[index] ? indoAyahs[index].text : ''
                  }));
                  setAyahs(combined);
                }
                setLoadingAyahs(false);
              })
              .catch(() => {
                alert('Gagal memuat ayat.');
                setLoadingAyahs(false);
              });
          };

          const filtered = daftarSurah114.filter(s => s.nama.toLowerCase().includes(search.toLowerCase()) || s.arti.toLowerCase().includes(search.toLowerCase()));

          return (
            <div className="bg-white p-3.5 sm:p-5 rounded-xl shadow border space-y-4">
              {!selectedSurah ? (
                <>
                  <div className="flex flex-col sm:flex-row justify-between items-center gap-2">
                    <h3 className="text-sm sm:text-base font-bold text-emerald-900">📖 Al-Quran Digital</h3>
                    <input type="text" placeholder="Cari Surah..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full sm:w-60 p-1.5 border rounded text-xs" />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 max-h-[380px] overflow-y-auto">
                    {filtered.map((surah) => (
                      <div key={surah.no} onClick={() => handleSelectSurah(surah)} className="p-3 bg-emerald-50 rounded-xl border flex justify-between items-center cursor-pointer hover:bg-emerald-100">
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="w-5 h-5 bg-emerald-700 text-white rounded-full flex items-center justify-center text-[10px] font-bold">{surah.no}</span>
                            <h4 className="font-bold text-emerald-950 text-xs">{surah.nama}</h4>
                          </div>
                          <p className="text-[10px] text-gray-600 mt-0.5">Arti: {surah.arti}</p>
                        </div>
                        <span className="text-base font-bold text-emerald-900 font-serif">{surah.arab}</span>
                      </div>
                    ))}
                  </div>
                </>
              ) : (
                <div className="space-y-3">
                  <div className="flex justify-between items-center pb-2 border-b">
                    <button onClick={() => setSelectedSurah(null)} className="text-[10px] bg-gray-200 px-2 py-1 rounded font-bold">← Kembali</button>
                    <h3 className="text-sm font-bold text-emerald-900">{selectedSurah.nama}</h3>
                  </div>
                  {loadingAyahs ? <p className="text-xs text-center py-6">Memuat ayat...</p> : (
                    <div className="space-y-2.5 max-h-[400px] overflow-y-auto pr-1">
                      {ayahs.map((ayah) => (
                        <div key={ayah.numberInSurah} className="p-3 bg-emerald-50/50 rounded-xl border space-y-1.5 text-xs">
                          <span className="w-5 h-5 bg-emerald-700 text-white rounded-full flex items-center justify-center text-[10px] font-bold">{ayah.numberInSurah}</span>
                          <p className="text-lg text-right font-serif text-emerald-950">{ayah.text}</p>
                          <p className="text-[11px] text-gray-700"><strong>Artinya:</strong> {ayah.translation}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        }

        function ZakatModule() {
          const [jenisZakat, setJenisZakat] = useState('penghasilan');
          const [nominal, setNominal] = useState('');
          const [jumlahJiwa, setJumlahJiwa] = useState(1);
          const hargaBerasKg = 15000;

          const hitungZakat = () => {
            const val = parseFloat(nominal) || 0;
            if (jenisZakat === 'penghasilan') return val >= 6000000 ? val * 0.025 : 0;
            if (jenisZakat === 'maal') return val >= 85000000 ? val * 0.025 : 0;
            if (jenisZakat === 'fitrah') return (parseInt(jumlahJiwa) || 1) * 2.5 * hargaBerasKg;
            return 0;
          };

          return (
            <div className="bg-white p-3.5 sm:p-5 rounded-xl shadow border space-y-4">
              <h3 className="text-sm sm:text-base font-bold text-emerald-900">🧮 Kalkulator Zakat</h3>
              <div className="flex gap-1.5 flex-wrap text-xs">
                <button onClick={() => setJenisZakat('penghasilan')} className={`px-3 py-1.5 rounded font-bold ${jenisZakat === 'penghasilan' ? 'bg-emerald-700 text-white' : 'bg-gray-100 text-emerald-900'}`}>Penghasilan</button>
                <button onClick={() => setJenisZakat('maal')} className={`px-3 py-1.5 rounded font-bold ${jenisZakat === 'maal' ? 'bg-emerald-700 text-white' : 'bg-gray-100 text-emerald-900'}`}>Maal</button>
                <button onClick={() => setJenisZakat('fitrah')} className={`px-3 py-1.5 rounded font-bold ${jenisZakat === 'fitrah' ? 'bg-emerald-700 text-white' : 'bg-gray-100 text-emerald-900'}`}>Fitrah</button>
              </div>
              <div className="p-3.5 bg-emerald-50 rounded-xl border space-y-2.5 text-xs">
                {jenisZakat !== 'fitrah' ? (
                  <div>
                    <label className="block font-bold text-gray-700 mb-1">Nominal (Rp)</label>
                    <input type="number" placeholder="Contoh: 7500000" value={nominal} onChange={(e) => setNominal(e.target.value)} className="w-full p-2 border rounded bg-white" />
                  </div>
                ) : (
                  <div>
                    <label className="block font-bold text-gray-700 mb-1">Jumlah Jiwa</label>
                    <input type="number" min="1" value={jumlahJiwa} onChange={(e) => setJumlahJiwa(e.target.value)} className="w-full p-2 border rounded bg-white" />
                  </div>
                )}
                <div className="p-3 bg-white rounded border shadow-sm">
                  <p className="text-[10px] text-gray-500">Estimasi Zakat:</p>
                  <p className="text-lg font-extrabold text-emerald-800">Rp {hitungZakat().toLocaleString('id-ID')}</p>
                </div>
              </div>
            </div>
          );
        }

        function KiblatModule() {
          return (
            <div className="bg-white p-3.5 sm:p-5 rounded-xl shadow border space-y-4 text-center">
              <h3 className="text-sm sm:text-base font-bold text-emerald-900">🧭 Arah Kiblat Digital</h3>
              <div className="p-4 bg-emerald-950 text-white rounded-xl max-w-xs mx-auto space-y-3 shadow-lg border border-emerald-800">
                <div className="w-16 h-16 mx-auto rounded-full border-4 border-yellow-400 flex items-center justify-center bg-emerald-900 relative">
                  <div className="absolute w-1 h-6 bg-yellow-400 top-2 rounded-full transform -rotate-45 origin-bottom"></div>
                  <span className="text-[9px] font-bold text-yellow-300">KA'BAH</span>
                </div>
                <p className="text-xs font-mono font-bold">Azimuth: 291.5° (Barat Laut)</p>
              </div>
            </div>
          );
        }

        // --- MODUL DZIKIR & DOA LENGKAP ---
        function DzikirModule() {
          const [kategori, setKategori] = useState('harian');

          const daftarDoa = [
            { kategori: 'harian', judul: 'Doa Buka Puasa', arab: 'ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ العُرُوقُ، وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ', arti: 'Telah hilang rasa haus, urat-urat telah basah, dan pahala telah tetap, insya Allah.' },
            { kategori: 'harian', judul: 'Niat Puasa Ramadhan', arab: 'نَوَيْتُ صَوْمَ غَدٍ عَنْ أَدَاءِ فَرْضِ شَهْرِ رَمَضَانَ هَذِهِ السَّنَةِ لِلَّهِ تَعَالَى', arti: 'Aku niat berpuasa esok hari untuk menunaikan fardhu bulan Ramadhan tahun ini karena Allah Ta\'ala.' },
            { kategori: 'harian', judul: 'Doa Malam Nisfu Sya\'ban', arab: 'اللَّهُمَّ يَا ذَا الْمَنِّ وَلَا يُمَنُّ عَلَيْكَ، يَا ذَا الْجَلَالِ وَالإِكْرَامِ...', arti: 'Ya Allah, Tuhan yang anugerah-Nya tidak diberi nikmat atas-Nya. Wahai Tuhan pemilik kebesaran dan kemuliaan.' },
            { kategori: 'sholat', judul: 'Doa Iftitah', arab: 'اللَّهُ أَكْبَرُ كَبِيرًا وَالْحَمْدُ لِلَّهِ كَثِيرًا...', arti: 'Allah Maha Besar dengan sebesar-besarnya. Segala puji bagi Allah dengan pujian yang banyak.' },
            { kategori: 'sholat', judul: 'Doa Ruku\'', arab: 'سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ', arti: 'Maha Suci Tuhanku Yang Maha Agung dan dengan memuji-Nya.' },
            { kategori: 'sholat', judul: 'Doa I\'tidal', arab: 'رَبَّنَا لَكَ الْحَمْدُ مِلْءُ السَّمَاوَاتِ وَمِلْءُ الْأَرْضِ...', arti: 'Ya Tuhan kami, bagi-Mu segala puji, sepenuh langit dan sepenuh bumi...' },
            { kategori: 'sholat', judul: 'Doa Sujud', arab: 'سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ', arti: 'Maha Suci Tuhanku Yang Maha Tinggi dan dengan memuji-Nya.' },
            { kategori: 'sholat', judul: 'Doa Di Antara Dua Sujud', arab: 'رَبِّ اغْفِرْ لِي وَرَحْمَنِي وَاجْبُرْنِي وَارْفَعْنِي...', arti: 'Ya Allah, ampunilah dosaku, sayangilah aku, cukupkanlah aku, angkatlah derajatku...' },
            { kategori: 'sholat', judul: 'Doa Tasyahud Akhir', arab: 'التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ...', arti: 'Segala kehormatan, keberkahan, shalawat dan kebaikan hanya bagi Allah...' },
            { kategori: 'harian', judul: 'Doa Memohon Keselamatan', arab: 'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ', arti: 'Ya Tuhan kami, berikanlah kami kebaikan di dunia dan kebaikan di akhirat, serta peliharalah kami dari siksa neraka.' },
            { kategori: 'harian', judul: 'Doa Memohon Ampunan', arab: 'رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا', arti: 'Ya Tuhanku, ampunilah dosaku dan dosa kedua orang tuaku, dan sayangilah keduanya sebagaimana mereka mendidikku kecil.' },
            { kategori: 'harian', judul: 'Doa Masuk WC / Toilet', arab: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ', arti: 'Ya Allah, aku berlindung kepada-Mu dari setan laki-laki dan setan perempuan.' },

            { kategori: 'harian', judul: 'Doa Tidur & Bangun Tidur', arab: 'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا / الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', arti: 'Dengan nama-Mu ya Allah aku mati dan hidup / Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami...' },

                <h3 className="text-sm sm:text-base font-bold text-emerald-900">📿 Dzikir & Kumpulan Doa Sehari-hari</h3>
                <div className="flex gap-1 text-[11px]">

                  <button onClick={() => setKategori('harian')} className={`px-2.5 py-1 rounded font-bold ${kategori === 'harian' ? 'bg-emerald-700 text-white' : 'bg-gray-100 text-emerald-900'}`}>Harian</button>

        function StrukturModule({ struktur, setStrukturBTM, user }) {
          const [edit, setEdit] = useState(false);
          const [form, setForm] = useState(struktur);

          const handleSave = (e) => {
            e.preventDefault();
            setStrukturBTM(form);
            setEdit(false);
            alert('Struktur pengurus diperbarui!');
          };

          return (
            <div className="bg-white p-3.5 sm:p-5 rounded-xl shadow border space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="text-sm sm:text-base font-bold text-emerald-900">Struktur Pengurus BTM</h3>
                {user.role === 'super_admin' && (
                  <button onClick={() => setEdit(!edit)} className="bg-emerald-700 text-white px-2.5 py-1 rounded text-xs font-bold">
                    {edit ? 'Tutup' : '✏️ Ubah'}
                  </button>
                )}
              </div>
              {edit ? (
                <form onSubmit={handleSave} className="space-y-2.5 bg-emerald-50 p-3 rounded-xl border text-xs">
                  {Object.keys(form).map((k) => (
                    <div key={k}>
                      <label className="block font-bold capitalize text-gray-700">{k.replace(/([A-Z])/g, ' $1')}</label>
                      <input type="text" className="w-full p-1.5 border rounded bg-white" value={form[k]} onChange={(e) => setForm({...form, [k]: e.target.value})} />
                    </div>
                  ))}
                  <button type="submit" className="bg-emerald-700 text-white px-3 py-1.5 rounded font-bold">Simpan</button>
                </form>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                  {Object.entries(struktur).map(([key, val]) => (
                    <div key={key} className="p-2.5 bg-emerald-50 rounded-lg border">
                      <strong className="capitalize text-emerald-900 block">{key.replace(/([A-Z])/g, ' $1')}</strong>
                      <span className="text-gray-700">{val}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }

        function KeuanganModule({ keuangan, setKeuangan, user }) {
          const [form, setForm] = useState({ tanggal: '', uraianMasuk: '', uangMasuk: 0, uangKeluar: 0, uraianKeluar: '-' });
          const [editId, setEditId] = useState(null);

          const handleSaveKeuangan = (e) => {
            e.preventDefault();
            if (user.role !== 'super_admin') {
              alert('Akses Ditolak! Hanya Super Admin.');
              return;
            }
            const masuk = parseFloat(form.uangMasuk) || 0;
            const keluar = parseFloat(form.uangKeluar) || 0;

            if (editId !== null) {
              const updated = keuangan.map(item => {
                if (item.id === editId) {
                  return { ...item, tanggal: form.tanggal || item.tanggal, uraianMasuk: form.uraianMasuk, uangMasuk: masuk, uangKeluar: keluar, uraianKeluar: form.uraianKeluar || '-' };
                }
                return item;
              });
              setKeuangan(updated);
              setEditId(null);
              alert('Keuangan diperbarui.');
            } else {
              const lastSaldo = keuangan.length > 0 ? keuangan[keuangan.length - 1].saldo : 0;
              const newData = {
                id: Date.now(),
                tanggal: form.tanggal || new Date().toISOString().split('T')[0],
                uraianMasuk: form.uraianMasuk,
                uangMasuk: masuk,
                uangKeluar: keluar,
                uraianKeluar: form.uraianKeluar || '-',
                saldo: lastSaldo + masuk - keluar
              };
              setKeuangan([...keuangan, newData]);
              alert('Transaksi ditambahkan.');
            }
            setForm({ tanggal: '', uraianMasuk: '', uangMasuk: 0, uangKeluar: 0, uraianKeluar: '-' });
          };

          const handleEditClick = (item) => {
            if (user.role !== 'super_admin') return;
            setForm({ tanggal: item.tanggal, uraianMasuk: item.uraianMasuk, uangMasuk: item.uangMasuk, uangKeluar: item.uangKeluar, uraianKeluar: item.uraianKeluar });
            setEditId(item.id);
          };

          const handleDeleteKeuangan = (id) => {
            if (user.role !== 'super_admin') return;
            if (confirm('Hapus transaksi ini?')) {
              const filtered = keuangan.filter(item => item.id !== id);
              let currentSaldo = 0;
              const recalculated = filtered.map(item => {
                currentSaldo = currentSaldo + (item.uangMasuk || 0) - (item.uangKeluar || 0);
                return { ...item, saldo: currentSaldo };
              });
              setKeuangan(recalculated);
              alert('Dihapus.');
            }
          };

          return (
            <div className="bg-white p-3.5 sm:p-5 rounded-xl shadow border space-y-4 text-xs">
              <h3 className="text-sm sm:text-base font-bold text-emerald-900">Laporan Keuangan Masjid</h3>
              {user.role === 'super_admin' && (
                <form onSubmit={handleSaveKeuangan} className="p-3 bg-emerald-50 rounded-xl border space-y-2">
                  <div className="flex justify-between items-center">
                    <h4 className="font-bold text-emerald-900">{editId !== null ? '✏️ Edit Transaksi' : '➕ Tambah Transaksi'}</h4>
                    {editId !== null && <button type="button" onClick={() => setEditId(null)} className="text-red-600 font-bold">Batal</button>}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-5 gap-2">
                    <input type="date" className="p-1.5 border rounded bg-white" value={form.tanggal} onChange={(e) => setForm({...form, tanggal: e.target.value})} />
                    <input type="text" placeholder="Uraian Masuk" className="p-1.5 border rounded bg-white" value={form.uraianMasuk} onChange={(e) => setForm({...form, uraianMasuk: e.target.value})} required />
                    <input type="number" placeholder="Uang Masuk" className="p-1.5 border rounded bg-white" value={form.uangMasuk} onChange={(e) => setForm({...form, uangMasuk: e.target.value})} />
                    <input type="number" placeholder="Uang Keluar" className="p-1.5 border rounded bg-white" value={form.uangKeluar} onChange={(e) => setForm({...form, uangKeluar: e.target.value})} />
                    <input type="text" placeholder="Uraian Keluar" className="p-1.5 border rounded bg-white" value={form.uraianKeluar} onChange={(e) => setForm({...form, uraianKeluar: e.target.value})} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white rounded font-bold py-1.5 px-3">Simpan</button>
                </form>
              )}
              <div className="overflow-x-auto">
                <table className="w-full border-collapse border border-gray-200">
                  <thead>
                    <tr className="bg-emerald-100 text-emerald-900">
                      <th className="border p-1.5">No</th>
                      <th className="border p-1.5">Tanggal</th>
                      <th className="border p-1.5">Uraian Masuk</th>
                      <th className="border p-1.5">Uang Masuk</th>
                      <th className="border p-1.5">Uang Keluar</th>
                      <th className="border p-1.5">Uraian Keluar</th>
                      <th className="border p-1.5">Saldo</th>
                      {user.role === 'super_admin' && <th className="border p-1.5">Aksi</th>}
                    </tr>
                  </thead>
                  <tbody>
                    {keuangan.map((item, idx) => (
                      <tr key={item.id} className="text-center">
                        <td className="border p-1.5">{idx + 1}</td>
                        <td className="border p-1.5">{item.tanggal}</td>
                        <td className="border p-1.5 text-left">{item.uraianMasuk}</td>
                        <td className="border p-1.5 text-green-600 font-semibold">Rp {(item.uangMasuk || 0).toLocaleString()}</td>
                        <td className="border p-1.5 text-red-600 font-semibold">Rp {(item.uangKeluar || 0).toLocaleString()}</td>
                        <td className="border p-1.5 text-left">{item.uraianKeluar}</td>
                        <td className="border p-1.5 font-bold">Rp {(item.saldo || 0).toLocaleString()}</td>
                        {user.role === 'super_admin' && (
                          <td className="border p-1.5 space-x-1">
                            <button onClick={() => handleEditClick(item)} className="bg-blue-600 text-white px-2 py-0.5 rounded text-[10px]">Edit</button>
                            <button onClick={() => handleDeleteKeuangan(item.id)} className="bg-red-600 text-white px-2 py-0.5 rounded text-[10px]">Hapus</button>
                          </td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function JamaahModule({ jamaahList, setJamaahList, user }) {
          const [searchQuery, setSearchQuery] = useState('');
          const [form, setForm] = useState({ no_kk: '', nama: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
          const [editIndex, setEditIndex] = useState(null);

          const handleSaveJamaah = (e) => {
            e.preventDefault();
            if (user.role !== 'super_admin') return;
            if (!form.no_kk || !form.nama || !form.password) {
              alert('Nomor KK, Nama, dan Password wajib diisi!');
              return;
            }
            if (editIndex !== null) {
              const updated = [...jamaahList];
              updated[editIndex] = { ...form, jumlah: parseInt(form.jumlah) || 1 };
              setJamaahList(updated);
              setEditIndex(null);
              alert('Jamaah diperbarui.');
            } else {
              if (jamaahList.some(item => item.no_kk.trim() === form.no_kk.trim())) {
                alert('No KK sudah terdaftar.');
                return;
              }
              setJamaahList([...jamaahList, { ...form, jumlah: parseInt(form.jumlah) || 1 }]);
              alert('Jamaah ditambahkan.');
            }
            setForm({ no_kk: '', nama: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
          };

          const handleEditClick = (item, index) => {
            if (user.role !== 'super_admin') return;
            setForm(item);
            setEditIndex(index);
          };

          const handleDeleteJamaah = (index) => {
            if (user.role !== 'super_admin') return;
            if (confirm('Hapus data?')) {
              setJamaahList(jamaahList.filter((_, i) => i !== index));
            }
          };

          const filtered = jamaahList.filter(item => item.no_kk.toLowerCase().includes(searchQuery.toLowerCase()) || item.nama.toLowerCase().includes(searchQuery.toLowerCase()));

          return (
            <div className="bg-white p-3.5 sm:p-5 rounded-xl shadow border space-y-4 text-xs">
              <div className="flex flex-col sm:flex-row justify-between items-center gap-2">
                <h3 className="text-sm sm:text-base font-bold text-emerald-900">👥 Data Jamaah</h3>
                <input type="text" placeholder="Cari..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full sm:w-60 p-1.5 border rounded" />
              </div>
              {user.role === 'super_admin' && (
                <form onSubmit={handleSaveJamaah} className="p-3 bg-emerald-50 rounded-xl border space-y-2">
                  <div className="flex justify-between items-center">
                    <h4 className="font-bold text-emerald-900">{editIndex !== null ? '✏️ Edit Jamaah' : '➕ Tambah Jamaah'}</h4>
                    {editIndex !== null && <button type="button" onClick={() => setEditIndex(null)} className="text-red-600 font-bold">Batal</button>}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <input type="text" placeholder="No KK" className="p-1.5 border rounded bg-white" value={form.no_kk} onChange={(e) => setForm({...form, no_kk: e.target.value})} required />
                    <input type="text" placeholder="Nama Kepala Keluarga" className="p-1.5 border rounded bg-white" value={form.nama} onChange={(e) => setForm({...form, nama: e.target.value})} required />
                    <input type="text" placeholder="Password" className="p-1.5 border rounded bg-white" value={form.password} onChange={(e) => setForm({...form, password: e.target.value})} required />
                    <input type="text" placeholder="No HP" className="p-1.5 border rounded bg-white" value={form.hp} onChange={(e) => setForm({...form, hp: e.target.value})} />
                    <input type="text" placeholder="Alamat" className="p-1.5 border rounded bg-white" value={form.alamat} onChange={(e) => setForm({...form, alamat: e.target.value})} />
                    <input type="text" placeholder="Anggota Keluarga" className="p-1.5 border rounded bg-white" value={form.anggota} onChange={(e) => setForm({...form, anggota: e.target.value})} />
                  </div>
                  <button type="submit" className="bg-emerald-700 text-white px-3 py-1.5 rounded font-bold">Simpan</button>
                </form>
              )}
              <div className="overflow-x-auto">
                <table className="w-full border-collapse border border-gray-200">
                  <thead>
                    <tr className="bg-emerald-100 text-emerald-900">
                      <th className="border p-1.5">No KK</th>
                      <th className="border p-1.5">Nama</th>
                      <th className="border p-1.5">No HP</th>
                      <th className="border p-1.5">Alamat</th>
                      {user.role === 'super_admin' && <th className="border p-1.5">Aksi</th>}
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((item, idx) => {
                      const originalIndex = jamaahList.findIndex(j => j.no_kk === item.no_kk);
                      return (
                        <tr key={idx} className="text-center">
                          <td className="border p-1.5">{item.no_kk}</td>
                          <td className="border p-1.5 font-bold">{item.nama}</td>
                          <td className="border p-1.5">{item.hp}</td>
                          <td className="border p-1.5">{item.alamat}</td>
                          {user.role === 'super_admin' && (
                            <td className="border p-1.5 space-x-1">
                              <button onClick={() => handleEditClick(item, originalIndex)} className="bg-blue-600 text-white px-2 py-0.5 rounded text-[10px]">Edit</button>
                              <button onClick={() => handleDeleteJamaah(originalIndex)} className="bg-red-600 text-white px-2 py-0.5 rounded text-[10px]">Hapus</button>
                            </td>
                          )}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
