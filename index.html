<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Masjid Al-Muhajirin Wawonasa</title>
    <!-- Ikon Website / Favicon untuk Laptop & HP -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
          const [user, setUser] = useState(null);
          const [activeMenu, setActiveMenu] = useState('home');
          const [currentTime, setCurrentTime] = useState(new Date());

          useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);

          const [keuangan, setKeuangan] = useState([
            { id: 1, tanggal: '2026-06-01', uraian: 'Saldo Awal Bulan', masuk: 5000000, keluar: 0, ketKeluar: '-', saldo: 5000000 },
            { id: 2, tanggal: '2026-06-05', uraian: 'Kotak Amal Jumat', masuk: 1250000, keluar: 0, ketKeluar: '-', saldo: 6250000 }
          ]);

          const [jamaahList, setJamaahList] = useState([
            { no_kk: '7171011234560001', nama: 'H. Abdullah', ktp: '7171011234560001', hp: '081234567890', alamat: 'Wawonasa Lingkungan I', jumlah: 4, anggota: 'H. Abdullah, Hj. Aminah, Ahmad, Fatimah' }
          ]);

          const [strukturBTM, setStrukturBTM] = useState({
            ketua: 'BILAL',
            wakilKetua1: 'Dra. ASNI VAN GOBEL',
            wakilKetua2: 'ISMAIL ABDUL',
            wakilKetua3: '[Nama Wakil Ketua 3]',
            sekretaris: 'SAHRUL SUBEO',
            wakilSekretaris1: 'IRWAN ADAM',
            wakilSekretaris2: 'FAHRI HARAS',
            bendahara: 'Hj. VONNY MA\'ARUF',
            wakilBendahara1: 'ROMANTIKA ALI',
            wakilBendahara2: '[Nama Wakil Bendahara 2]',
            ketuaPembangunan: 'YUSUP BIDASI',
            koordinatorIdarah: 'ARSYAD TUE',
            koordinatorRiyah: 'YUSUP BIDASI',
            koordinatorImarah: 'BUDHIARTO NIKIULU'
          });

          const [profilMasjid, setProfilMasjid] = useState({
            nama: 'Masjid Al-Muhajirin Wawonasa',
            alamat: 'Jl. Trans Wawonasa, Kecamatan Singkil, Kota Manado, Sulawesi Utara',
            koordinat: '1.4931° N, 124.8412° E (Manado)',
            logoUrl: 'logo.jpg'
          });

          const handleLogin = (username, password) => {
            if (username === 'super_admin' && password === '2026-2029') {
              setUser({ username, role: 'super_admin' });
            } else if (username === 'btm_masjid' && password === '2026-2029') {
              setUser({ username, role: 'btm' });
            } else if (username.trim() !== '' && password.trim() !== '') {
              setUser({ username, role: 'jamaah' });
            } else {
              alert('Username atau Password salah!');
            }
          };

          return (
            <div className="min-h-screen bg-gray-50 flex flex-col">
              {!user ? (
                <LoginScreen 
                  onLogin={handleLogin} 
                  profilMasjid={profilMasjid} 
                  currentTime={currentTime} 
                  strukturBTM={strukturBTM} 
                />
              ) : (
                <MainLayout 
                  user={user} 
                  onLogout={() => setUser(null)} 
                  activeMenu={activeMenu} 
                  setActiveMenu={setActiveMenu}
                  keuangan={keuangan} setKeuangan={setKeuangan}
                  jamaahList={jamaahList} setJamaahList={setJamaahList}
                  strukturBTM={strukturBTM} setStrukturBTM={setStrukturBTM}
                  profilMasjid={profilMasjid} setProfilMasjid={setProfilMasjid}
                />
              )}
            </div>
          );
        }

        function LoginScreen({ onLogin, profilMasjid, currentTime, strukturBTM }) {
          const [u, setU] = useState('');
          const [p, setP] = useState('');

          const jadwalSholat = [
            { nama: 'Imsak', waktu: '04:15 WITA' },
            { nama: 'Subuh', waktu: '04:25 WITA' },
            { nama: 'Terbit', waktu: '05:40 WITA' },
            { nama: 'Dzuhur', waktu: '11:50 WITA' },
            { nama: 'Ashar', waktu: '15:10 WITA' },
            { nama: 'Maghrib', waktu: '17:55 WITA' },
            { nama: 'Isya', waktu: '19:05 WITA' }
          ];

          return (
            <div className="min-h-screen bg-emerald-950 p-4 md:p-8 flex flex-col justify-center items-center">
              <div className="max-w-4xl w-full space-y-6">
                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-6 text-white border border-white/20 shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
                  <div className="flex items-center gap-4">
                    <img src={profilMasjid.logoUrl} alt="Logo Masjid" className="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover border-2 border-yellow-400 shadow-md bg-white flex-shrink-0" />
                    <div>
                      <span className="bg-emerald-600 text-white text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Profil Resmi Masjid</span>
                      <h1 className="text-2xl md:text-3xl font-extrabold mt-2">{profilMasjid.nama}</h1>
                      <p className="text-sm text-emerald-200 mt-1">📍 {profilMasjid.alamat}</p>
                    </div>
                  </div>
                  <div className="text-right bg-emerald-900/60 p-4 rounded-xl border border-emerald-700/50 w-full md:w-auto flex-shrink-0">
                    <p className="text-xs text-emerald-300">Waktu Real-Time (WITA)</p>
                    <p className="text-2xl font-mono font-bold text-white mt-1">{currentTime.toLocaleTimeString('id-ID')}</p>
                    <p className="text-xs text-emerald-200 mt-1">{currentTime.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-white rounded-2xl p-6 shadow-xl border border-emerald-100 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-emerald-900 text-lg">⏰ Jadwal Sholat Hari Ini</h3>
                        <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-medium">Wita (Manado)</span>
                      </div>
                      <div className="space-y-2">
                        {jadwalSholat.map((j, idx) => (
                          <div key={idx} className="flex justify-between items-center p-2.5 rounded-lg bg-emerald-50/70 border border-emerald-100">
                            <span className="font-semibold text-emerald-950 text-sm">{j.nama}</span>
                            <span className="font-mono font-bold text-emerald-700 text-sm">{j.waktu}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 shadow-xl border border-emerald-100 flex flex-col justify-center">
                    <div className="text-center mb-6">
                      <h3 className="text-xl font-bold text-emerald-900">Masuk ke Aplikasi</h3>
                      <p className="text-xs text-gray-500 mt-1">Silakan masuk menggunakan akun atau kredensial Anda.</p>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">Username / Akun Jamaah</label>
                        <input type="text" className="w-full p-3 border rounded-lg text-sm" placeholder="Masukkan Username" value={u} onChange={(e) => setU(e.target.value)} />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">Password</label>
                        <input type="password" className="w-full p-3 border rounded-lg text-sm" placeholder="Masukkan Password" value={p} onChange={(e) => setP(e.target.value)} />
                      </div>
                      <button onClick={() => onLogin(u, p)} className="w-full bg-emerald-700 text-white p-3 rounded-lg font-bold hover:bg-emerald-800 transition">Masuk Aplikasi</button>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-6 shadow-xl border border-emerald-100">
                  <div className="mb-4">
                    <h3 className="text-lg font-bold text-emerald-900">👥 Struktur Pengurus BTM Al-Muhajirin Wawonasa</h3>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    {Object.entries(strukturBTM).map(([key, val], idx) => (
                      <div key={idx} className="p-3 bg-emerald-50/60 rounded-xl border border-emerald-100">
                        <p className="text-xs text-emerald-700 font-semibold capitalize">{key.replace(/([A-Z])/g, ' $1')}</p>
                        <p className="text-sm font-bold text-emerald-950 mt-1">{val}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function MainLayout({ user, onLogout, activeMenu, setActiveMenu, keuangan, setKeuangan, jamaahList, setJamaahList, strukturBTM, setStrukturBTM, profilMasjid, setProfilMasjid }) {
          return (
            <div className="flex flex-col md:flex-row min-h-screen">
              <div className="w-full md:w-72 bg-emerald-950 text-white p-5 flex flex-col justify-between shadow-lg">
                <div>
                  <div className="flex items-center space-x-3 mb-6 pb-4 border-b border-emerald-800">
                    <img src={profilMasjid.logoUrl} alt="Logo" className="w-10 h-10 rounded-full object-cover border border-yellow-400 bg-white" />
                    <div>
                      <h2 className="text-sm font-bold text-yellow-400">Al-Muhajirin Wawonasa</h2>
                      <p className="text-xs text-emerald-300 uppercase">Role: {user.role}</p>
                    </div>
                  </div>
                  <ul className="space-y-1 text-sm">
                    <li onClick={() => setActiveMenu('home')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'home' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Beranda & Profil Masjid</li>
                    <li onClick={() => setActiveMenu('sholat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'sholat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Waktu Sholat Real-Time</li>
                    <li onClick={() => setActiveMenu('quran')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'quran' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Al-Quran Digital</li>
                    <li onClick={() => setActiveMenu('zakat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'zakat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Kalkulator Zakat</li>
                    <li onClick={() => setActiveMenu('kiblat')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'kiblat' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Arah Kiblat Digital</li>
                    <li onClick={() => setActiveMenu('dzikir')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'dzikir' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Dzikir & Doa Harian</li>
                    <li onClick={() => setActiveMenu('iqra')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'iqra' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Materi Iqra Anak</li>
                    <li onClick={() => setActiveMenu('struktur')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'struktur' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Struktur Pengurus BTM</li>
                    <li onClick={() => setActiveMenu('keuangan')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'keuangan' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Keuangan Masjid</li>
                    <li onClick={() => setActiveMenu('jamaah')} className={`cursor-pointer p-2.5 rounded-lg ${activeMenu === 'jamaah' ? 'bg-emerald-800 font-bold text-yellow-300' : 'hover:bg-emerald-900'}`}>Data Jamaah Masjid</li>
                  </ul>
                </div>
                <button onClick={onLogout} className="mt-6 bg-red-700 hover:bg-red-800 p-2.5 rounded-lg font-bold text-sm transition">Keluar Sistem</button>
              </div>

              <div className="flex-1 p-6 md:p-10 overflow-y-auto">
                <header className="flex justify-between items-center mb-6 pb-4 border-b">
                  <h2 className="text-lg font-bold text-emerald-900 capitalize">{activeMenu.replace('_', ' ')}</h2>
                  <span className="text-xs bg-emerald-100 text-emerald-800 font-semibold px-3 py-1 rounded-full">User: {user.username}</span>
                </header>

                {activeMenu === 'home' && <HomeModule profil={profilMasjid} />}
                {activeMenu === 'sholat' && <SholatModule />}
                {activeMenu === 'quran' && <div className="bg-white p-6 rounded-xl shadow border"><h3>Al-Quran Digital</h3></div>}
                {activeMenu === 'zakat' && <div className="bg-white p-6 rounded-xl shadow border"><h3>Kalkulator Zakat Digital</h3></div>}
                {activeMenu === 'kiblat' && <div className="bg-white p-6 rounded-xl shadow border"><h3>Arah Kiblat Digital</h3></div>}
                {activeMenu === 'dzikir' && <div className="bg-white p-6 rounded-xl shadow border"><h3>Dzikir dan Doa Harian</h3></div>}
                {activeMenu === 'iqra' && <IqraModule />}
                {activeMenu === 'struktur' && <StrukturModule struktur={strukturBTM} />}
                {activeMenu === 'keuangan' && <KeuanganModule keuangan={keuangan} />}
                {activeMenu === 'jamaah' && <JamaahModule jamaahList={jamaahList} />}
              </div>
            </div>
          );
        }

        function HomeModule({ profil }) {
          return (
            <div className="bg-white p-6 rounded-xl shadow border flex flex-col md:flex-row gap-6 items-center">
              <img src={profil.logoUrl} alt="Logo Masjid" className="w-32 h-32 rounded-full object-cover border-4 border-emerald-600 shadow-md flex-shrink-0" />
              <div className="space-y-2">
                <h3 className="text-xl font-bold text-emerald-900">{profil.nama}</h3>
                <p className="text-gray-600 text-sm"><strong>Alamat:</strong> {profil.alamat}</p>
                <p className="text-gray-600 text-sm"><strong>Koordinat Geografis:</strong> {profil.koordinat}</p>
                <p className="text-xs text-emerald-700 font-semibold bg-emerald-50 p-2 rounded border border-emerald-200 mt-2">✨ Selamat datang di sistem manajemen digital Masjid Al-Muhajirin Wawonasa.</p>
              </div>
            </div>
          );
        }

        function SholatModule() {
          return (
            <div className="bg-white p-6 rounded-xl shadow border">
              <h3 className="text-xl font-bold text-emerald-900 mb-1">Jadwal Sholat Real-Time</h3>
              <p className="text-xs text-gray-500 mb-6">Wilayah Manado & Sekitarnya</p>
            </div>
          );
        }

        function KeuanganModule({ keuangan }) {
          return (
            <div className="bg-white p-6 rounded-xl shadow border space-y-6">
              <h3 className="text-xl font-bold text-emerald-900">Laporan Keuangan Masjid</h3>
              <div className="overflow-x-auto">
                <table className="w-full border-collapse border border-gray-200 text-sm">
                  <thead>
                    <tr className="bg-emerald-100 text-emerald-900">
                      <th className="border p-2">No</th>
                      <th className="border p-2">Tanggal</th>
                      <th className="border p-2">Uraian</th>
                      <th className="border p-2">Masuk</th>
                      <th className="border p-2">Keluar</th>
                      <th className="border p-2">Saldo</th>
                    </tr>
                  </thead>
                  <tbody>
                    {keuangan.map((item, idx) => (
                      <tr key={item.id} className="text-center">
                        <td className="border p-2">{idx + 1}</td>
                        <td className="border p-2">{item.tanggal}</td>
                        <td className="border p-2 text-left">{item.uraian}</td>
                        <td className="border p-2 text-green-600 font-semibold">Rp {item.masuk.toLocaleString()}</td>
                        <td className="border p-2 text-red-600 font-semibold">Rp {item.keluar.toLocaleString()}</td>
                        <td className="border p-2 font-bold">Rp {item.saldo.toLocaleString()}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function JamaahModule({ jamaahList }) {
          return (
            <div className="bg-white p-6 rounded-xl shadow border space-y-6">
              <h3 className="text-xl font-bold text-emerald-900">Data Jamaah & Kartu Keluarga</h3>
              <div className="overflow-x-auto">
                <table className="w-full border-collapse border border-gray-200 text-sm">
                  <thead>
                    <tr className="bg-emerald-100 text-emerald-900">
                      <th className="border p-2">Nomor KK</th>
                      <th className="border p-2">Kepala Keluarga</th>
                      <th className="border p-2">No HP</th>
                      <th className="border p-2">Alamat</th>
                      <th className="border p-2">Jumlah</th>
                    </tr>
                  </thead>
                  <tbody>
                    {jamaahList.map((item, idx) => (
                      <tr key={idx} className="text-center">
                        <td className="border p-2 font-semibold">{item.no_kk}</td>
                        <td className="border p-2">{item.nama}</td>
                        <td className="border p-2">{item.hp}</td>
                        <td className="border p-2">{item.alamat}</td>
                        <td className="border p-2">{item.jumlah}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function StrukturModule({ struktur }) {
          return (
            <div className="bg-white p-6 rounded-xl shadow border space-y-6">
              <h3 className="text-xl font-bold text-emerald-900">Struktur Badan Takmirul Masjid</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                {Object.entries(struktur).map(([key, val]) => (
                  <div key={key} className="p-3 bg-emerald-50 rounded-lg border border-emerald-200">
                    <strong className="capitalize text-emerald-900 block">{key.replace(/([A-Z])/g, ' $1')}</strong>
                    <span className="text-gray-700">{val}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function IqraModule() {
          const [jilid, setJilid] = useState(1);
          return (
            <div className="bg-white p-6 rounded-xl shadow border space-y-4">
              <h3 className="text-xl font-bold text-emerald-900">Materi Pembelajaran Iqra</h3>
              <div className="flex gap-2 flex-wrap">
                {[1,2,3,4,5,6].map((j) => (
                  <button key={j} onClick={() => setJilid(j)} className={`px-4 py-2 rounded font-bold text-sm ${jilid === j ? 'bg-emerald-700 text-white' : 'bg-gray-100'}`}>Iqra {j}</button>
                ))}
              </div>
              <p className="text-gray-600 text-sm">Menampilkan materi pembelajaran interaktif Iqra Jilid {jilid} lengkap dengan contoh bacaan tajwid dasar.</p>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
