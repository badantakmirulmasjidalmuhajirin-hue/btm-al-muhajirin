<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Masjid Al-Muhajirin Wawonasa</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3500);
                return () => clearTimeout(timer);
            }, [message]);

            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white'
            };

            return (
                <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-xs font-medium transition-all ${bgColors[type] || bgColors.info}`}>
                    <span>{message}</span>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [activeMenu, setActiveMenu] = useState('home');
            const [currentTime, setCurrentTime] = useState(new Date());
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const [keuangan, setKeuangan] = useState([
                { id: 1, tanggal: '2026-06-01', uraian: 'Saldo Awal Bulan', masuk: 5000000, keluar: 0, saldo: 5000000 },
                { id: 2, tanggal: '2026-06-05', uraian: 'Kotak Amal Jumat', masuk: 1250000, keluar: 0, saldo: 6250000 }
            ]);

            const [jamaahList, setJamaahList] = useState([
                { no_kk: '7171011234560001', nama: 'H. Abdullah', hp: '081234567890', alamat: 'Wawonasa Lingkungan I', jumlah: 4, anggota: 'H. Abdullah, Hj. Aminah, Ahmad, Fatimah', password: '123' }
            ]);

            const [strukturBTM, setStrukturBTM] = useState({
                ketua: 'BILAL',
                wakilKetua1: 'Dra. ASNI VAN GOBEL',
                wakilKetua2: 'ISMAIL ABDUL',
                wakilKetua3: '-',
                sekretaris: 'SAHRUL SUBEO',
                wakilSekretaris1: 'IRWAN ADAM',
                wakilSekretaris2: 'FAHRI HARAS',
                bendahara: 'Hj. VONNY MA'ARUF',
                wakilBendahara1: 'ROMANTIKA ALI',
                wakilBendahara2: '-',
                ketuaPembangunan: 'YUSUP BIDASI',
                koordinatorIdarah: 'ARSYAD TUE',
                koordinatorRiyah: 'YUSUP BIDASI',
                koordinatorImarah: 'BUDHIARTO NIKIULU'
            });

            const [profilMasjid, setProfilMasjid] = useState({
                nama: 'Masjid Al-Muhajirin Wawonasa',
                alamat: 'Jl. Trans Wawonasa, Kecamatan Singkil, Kota Manado, Sulawesi Utara',
                koordinat: '1.4931° N, 124.8412° E (Manado)',
                logoUrl: 'logo.jpg'
            });

            const [authCredentials] = useState({
                super: { user: 'super_admin', pass: '2026-2029' },
                btm: { user: 'btm_masjid', pass: '2026-2029' }
            });

            const handleLogin = (username, password) => {
                const u = username.trim();
                const p = password.trim();

                if (!u || !p) {
                    showToast('Username dan password wajib diisi!', 'error');
                    return;
                }

                if (u === authCredentials.super.user && p === authCredentials.super.pass) {
                    setUser({ username: u, role: 'super_admin', nama: 'Super Administrator' });
                    showToast('Berhasil masuk sebagai Super Admin');
                } else if (u === authCredentials.btm.user && p === authCredentials.btm.pass) {
                    setUser({ username: u, role: 'btm', nama: 'Pengurus BTM' });
                    showToast('Berhasil masuk sebagai Pengurus BTM');
                } else {
                    const found = jamaahList.find(j => j.no_kk === u);
                    if (found) {
                        if (found.password === p) {
                            setUser({ username: found.no_kk, role: 'jamaah', nama: found.nama });
                            showToast(`Selamat datang, ${found.nama}`);
                        } else {
                            showToast('Password Jamaah salah!', 'error');
                        }
                    } else {
                        showToast('Akun tidak ditemukan dalam sistem.', 'error');
                    }
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 relative">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    {!user ? (
                        <LoginScreen 
                            onLogin={handleLogin} 
                            profilMasjid={profilMasjid} 
                            currentTime={currentTime} 
                            jamaahList={jamaahList} 
                            setJamaahList={setJamaahList}
                            showToast={showToast}
                        />
                    ) : (
                        <MainLayout 
                            user={user} 
                            onLogout={() => { setUser(null); showToast('Berhasil keluar sistem', 'info'); }} 
                            activeMenu={activeMenu} 
                            setActiveMenu={setActiveMenu}
                            keuangan={keuangan} setKeuangan={setKeuangan}
                            jamaahList={jamaahList} setJamaahList={setJamaahList}
                            strukturBTM={strukturBTM} setStrukturBTM={setStrukturBTM}
                            profilMasjid={profilMasjid} setProfilMasjid={setProfilMasjid}
                            currentTime={currentTime}
                            showToast={showToast}
                        />
                    )}
                </div>
            );
        }

        function useJadwalSholat() {
            const [jadwal, setJadwal] = useState({
                Imsak: '04:15', Subuh: '04:25', Terbit: '05:40', 
                Dzuhur: '11:50', Ashar: '15:10', Maghrib: '17:55', Isya: '19:05'
            });
            const [lokasiNama, setLokasiNama] = useState('Manado');

            const fetchJadwalByCity = (cityName) => {
                fetch(`https://api.aladhan.com/v1/timingsByCity?city=${cityName}&country=Indonesia&method=20`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.data) {
                            const t = data.data.timings;
                            setJadwal({
                                Imsak: t.Imsak, Subuh: t.Fajr, Terbit: t.Sunrise,
                                Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha
                            });
                            setLokasiNama(cityName);
                        }
                    })
                    .catch(() => {});
            };

            useEffect(() => {
                fetchJadwalByCity('Manado');
            }, []);

            return { jadwal, lokasiNama, fetchJadwalByCity };
        }

        function LoginScreen({ onLogin, profilMasjid, currentTime, jamaahList, setJamaahList, showToast }) {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [showRegister, setShowRegister] = useState(false);
            const [reg, setReg] = useState({ no_kk: '', nama: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
            const { jadwal, lokasiNama, fetchJadwalByCity } = useJadwalSholat();

            const handleRegister = (e) => {
                e.preventDefault();
                if (!reg.no_kk || !reg.nama || !reg.password) {
                    showToast('No KK, Nama, dan Password wajib diisi!', 'error');
                    return;
                }
                if (jamaahList.some(j => j.no_kk === reg.no_kk)) {
                    showToast('Nomor KK sudah terdaftar dalam sistem.', 'error');
                    return;
                }
                setJamaahList([...jamaahList, { ...reg, jumlah: parseInt(reg.jumlah) || 1 }]);
                showToast('Pendaftaran berhasil! Silakan login.');
                setShowRegister(false);
                setU(reg.no_kk);
                setP(reg.password);
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
                    <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-800/60 backdrop-blur-xl border border-slate-700/80 p-6 md:p-8 rounded-3xl shadow-2xl">
                        <div className="space-y-6 flex flex-col justify-between">
                            <div className="flex items-center space-x-4">
                                <img src={profilMasjid.logoUrl} alt="Logo" className="w-16 h-16 rounded-2xl object-cover border-2 border-emerald-500 shadow-lg bg-white" />
                                <div>
                                    <span className="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Portal Resmi</span>
                                    <h1 className="text-lg md:text-xl font-bold mt-1 text-white">{profilMasjid.nama}</h1>
                                </div>
                            </div>
                            <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700/50 space-y-2">
                                <div className="flex justify-between items-center text-xs text-slate-400">
                                    <span>Jadwal Sholat ({lokasiNama})</span>
                                    <span className="font-mono text-emerald-400">{currentTime.toLocaleTimeString('id-ID')}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    {Object.entries(jadwal).slice(0, 4).map(([k, v]) => (
                                        <div key={k} className="flex justify-between bg-slate-800 p-2 rounded-lg">
                                            <span className="text-slate-300">{k}</span>
                                            <span className="font-mono font-bold text-emerald-400">{v}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-900/80 p-6 rounded-2xl border border-slate-700/50 flex flex-col justify-center">
                            {!showRegister ? (
                                <div className="space-y-4">
                                    <div>
                                        <h3 className="text-base font-bold text-white">Masuk Sistem</h3>
                                        <p className="text-xs text-slate-400">Gunakan No. KK Jamaah atau Kredensial Admin</p>
                                    </div>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-[11px] font-semibold text-slate-300 mb-1">Username / No. KK</label>
                                            <input type="text" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" value={u} onChange={e => setU(e.target.value)} placeholder="Masukkan username..." />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-semibold text-slate-300 mb-1">Password</label>
                                            <input type="password" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" value={p} onChange={e => setP(e.target.value)} placeholder="••••••••" />
                                        </div>
                                        <button onClick={() => onLogin(u, p)} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20">Masuk Aplikasi</button>
                                    </div>
                                    <div className="text-center pt-2 border-t border-slate-800">
                                        <button onClick={() => setShowRegister(true)} className="text-xs text-emerald-400 hover:underline font-medium">✨ Pendaftaran Kartu Keluarga (KK) Jamaah</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-sm font-bold text-white">Daftar Akun Jamaah</h3>
                                        <button onClick={() => setShowRegister(false)} className="text-xs text-rose-400 font-semibold">Kembali</button>
                                    </div>
                                    <form onSubmit={handleRegister} className="space-y-2.5">
                                        <input type="text" placeholder="Nomor KK (Username)" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" value={reg.no_kk} onChange={e => setReg({...reg, no_kk: e.target.value})} required />
                                        <input type="text" placeholder="Nama Kepala Keluarga" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" value={reg.nama} onChange={e => setReg({...reg, nama: e.target.value})} required />
                                        <input type="password" placeholder="Buat Password" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" value={reg.password} onChange={e => setReg({...reg, password: e.target.value})} required />
                                        <input type="text" placeholder="No WhatsApp" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" value={reg.hp} onChange={e => setReg({...reg, hp: e.target.value})} />
                                        <input type="text" placeholder="Alamat Rumah" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" value={reg.alamat} onChange={e => setReg({...reg, alamat: e.target.value})} />
                                        <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-xs transition">Daftar Sekarang</button>
                                    </form>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function MainLayout({ user, onLogout, activeMenu, setActiveMenu, keuangan, setKeuangan, jamaahList, setJamaahList, strukturBTM, setStrukturBTM, profilMasjid, setProfilMasjid, showToast }) {
            const [sidebarOpen, setSidebarOpen] = useState(false);

            const menuList = [
                { id: 'home', label: 'Beranda & Profil' },
                { id: 'sholat', label: 'Waktu Sholat' },
                { id: 'quran', label: 'Al-Quran Digital' },
                { id: 'zakat', label: 'Kalkulator Zakat' },
                { id: 'kiblat', label: 'Arah Kiblat' },
                { id: 'dzikir', label: 'Dzikir & Doa' },
                { id: 'iqra', label: 'Materi Iqra' },
                { id: 'struktur', label: 'Struktur BTM' },
                { id: 'keuangan', label: 'Keuangan Masjid' },
                { id: 'jamaah', label: 'Data Jamaah' },
            ];

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-100">
                    <aside className="hidden md:flex w-64 bg-slate-900 text-slate-100 flex-col justify-between p-4 shadow-xl flex-shrink-0 min-h-screen">
                        <div className="space-y-6">
                            <div className="flex items-center space-x-3 pb-4 border-b border-slate-800">
                                <img src={profilMasjid.logoUrl} alt="Logo" className="w-10 h-10 rounded-xl object-cover border border-emerald-500 bg-white" />
                                <div className="overflow-hidden">
                                    <h2 className="text-xs font-bold text-white truncate">Al-Muhajirin</h2>
                                    <p className="text-[10px] text-emerald-400 font-medium uppercase">{user.role}</p>
                                </div>
                            </div>
                            <nav className="space-y-1">
                                {menuList.map(m => (
                                    <button key={m.id} onClick={() => setActiveMenu(m.id)} className={`w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium transition ${activeMenu === m.id ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                        {m.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                        <div className="pt-4 border-t border-slate-800">
                            <button onClick={onLogout} className="w-full bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white py-2 rounded-xl text-xs font-semibold transition">Keluar Sistem</button>
                        </div>
                    </aside>

                    <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-30">
                        <div className="flex items-center space-x-2">
                            <img src={profilMasjid.logoUrl} alt="Logo" className="w-8 h-8 rounded-lg object-cover" />
                            <h2 className="text-xs font-bold">Al-Muhajirin</h2>
                        </div>
                        <button onClick={() => setSidebarOpen(!sidebarOpen)} className="bg-slate-800 px-3 py-1.5 rounded-xl text-xs font-semibold">{sidebarOpen ? 'Tutup' : 'Menu'}</button>
                    </div>

                    {sidebarOpen && (
                        <div className="md:hidden absolute top-14 left-0 right-0 bg-slate-900 text-white p-4 z-40 shadow-2xl border-b border-slate-800 space-y-2">
                            <div className="grid grid-cols-2 gap-2">
                                {menuList.map(m => (
                                    <button key={m.id} onClick={() => { setActiveMenu(m.id); setSidebarOpen(false); }} className={`p-2.5 rounded-xl text-xs text-left font-medium ${activeMenu === m.id ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300'}`}>{m.label}</button>
                                ))}
                            </div>
                            <button onClick={onLogout} className="w-full bg-rose-600 text-white p-2.5 rounded-xl text-xs font-bold mt-2">Keluar Sistem</button>
                        </div>
                    )}

                    <main className="flex-1 flex flex-col p-4 md:p-8 max-w-7xl mx-auto w-full">
                        <header className="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
                            <div>
                                <h1 className="text-lg md:text-xl font-extrabold text-slate-800 capitalize">{activeMenu.replace('_', ' ')}</h1>
                                <p className="text-xs text-slate-500">Sistem Manajemen Masjid Terpadu</p>
                            </div>
                            <div className="bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 text-right">
                                <span className="text-[10px] block text-slate-400">Pengguna Aktif</span>
                                <span className="text-xs font-bold text-slate-700">{user.nama}</span>
                            </div>
                        </header>

                        <div className="flex-1">
                            {activeMenu === 'home' && <HomeModule profil={profilMasjid} setProfilMasjid={setProfilMasjid} user={user} showToast={showToast} />}
                            {activeMenu === 'sholat' && <SholatModule />}
                            {activeMenu === 'quran' && <QuranModule showToast={showToast} />}
                            {activeMenu === 'zakat' && <ZakatModule />}
                            {activeMenu === 'kiblat' && <KiblatModule />}
                            {activeMenu === 'dzikir' && <DzikirModule />}
                            {activeMenu === 'iqra' && <IqraModule />}
                            {activeMenu === 'struktur' && <StrukturModule struktur={strukturBTM} setStrukturBTM={setStrukturBTM} user={user} showToast={showToast} />}
                            {activeMenu === 'keuangan' && <KeuanganModule keuangan={keuangan} setKeuangan={setKeuangan} user={user} showToast={showToast} />}
                            {activeMenu === 'jamaah' && <JamaahModule jamaahList={jamaahList} setJamaahList={setJamaahList} user={user} showToast={showToast} />}
                        </div>
                    </main>
                </div>
            );
        }

        function HomeModule({ profil, setProfilMasjid, user, showToast }) {
            const [edit, setEdit] = useState(false);
            const [form, setForm] = useState(profil);

            const handleSave = (e) => {
                e.preventDefault();
                setProfilMasjid(form);
                setEdit(false);
                showToast('Profil masjid berhasil diperbarui');
            };

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div className="flex flex-col md:flex-row items-center gap-6">
                        <img src={profil.logoUrl} alt="Logo" className="w-28 h-28 rounded-2xl object-cover border-4 border-slate-100 shadow-md" />
                        <div className="flex-1 space-y-2 text-center md:text-left">
                            <h2 className="text-xl font-bold text-slate-800">{profil.nama}</h2>
                            <p className="text-xs text-slate-600"><strong>Alamat:</strong> {profil.alamat}</p>
                            <p className="text-xs text-slate-600"><strong>Koordinat:</strong> {profil.koordinat}</p>
                            <div className="inline-block bg-emerald-50 text-emerald-700 text-xs px-3 py-1.5 rounded-xl font-medium border border-emerald-100">✨ Platform Digital Terintegrasi Masjid Al-Muhajirin</div>
                        </div>
                        {(user.role === 'super_admin' || user.role === 'btm') && (
                            <button onClick={() => setEdit(!edit)} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-semibold transition">{edit ? 'Batal' : 'Edit Profil'}</button>
                        )}
                    </div>

                    {edit && (
                        <form onSubmit={handleSave} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                            <h3 className="text-xs font-bold text-slate-700">Perbarui Informasi</h3>
                            <input type="text" className="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs" value={form.nama} onChange={e => setForm({...form, nama: e.target.value})} placeholder="Nama Masjid" />
                            <input type="text" className="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs" value={form.alamat} onChange={e => setForm({...form, alamat: e.target.value})} placeholder="Alamat" />
                            <input type="text" className="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs" value={form.koordinat} onChange={e => setForm({...form, koordinat: e.target.value})} placeholder="Koordinat" />
                            <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Simpan Perubahan</button>
                        </form>
                    )}
                </div>
            );
        }

        function SholatModule() {
            const { jadwal, lokasiNama, fetchJadwalByCity } = useJadwalSholat();

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-base font-bold text-slate-800">Jadwal Sholat Harian</h2>
                            <p className="text-xs text-slate-500">Waktu sholat akurat berdasarkan standar Kemenag.</p>
                        </div>
                        <select onChange={e => fetchJadwalByCity(e.target.value)} className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold">
                            <option value="Manado">Kota Manado</option>
                            <option value="Jakarta">Jakarta</option>
                            <option value="Surabaya">Surabaya</option>
                            <option value="Bandung">Bandung</option>
                            <option value="Makassar">Makassar</option>
                            <option value="Gorontalo">Gorontalo</option>
                        </select>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                        <div className="bg-slate-900 text-white p-4 rounded-2xl md:col-span-4 flex justify-between items-center">
                            <div>
                                <span className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Lokasi Terpilih</span>
                                <h3 className="text-sm font-bold mt-0.5">Kota {lokasiNama}</h3>
                            </div>
                        </div>
                        {Object.entries(jadwal).map(([k, v]) => (
                            <div key={k} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex justify-between items-center">
                                <span className="font-semibold text-slate-700 text-xs">{k}</span>
                                <span className="font-mono font-bold text-emerald-600 text-sm">{v}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function QuranModule({ showToast }) {
            const [search, setSearch] = useState('');
            const [selectedSurah, setSelectedSurah] = useState(null);
            const [ayahs, setAyahs] = useState([]);
            const [loading, setLoading] = useState(false);

            const daftarSurah = [
                { no: 1, nama: 'Al-Fatihah', arti: 'Pembukaan', ayat: 7, juz: 1, arab: 'الفاتحة' },
                { no: 2, nama: 'Al-Baqarah', arti: 'Sapi Betina', ayat: 286, juz: '1 - 3', arab: 'البقرة' },
                { no: 3, nama: 'Ali 'Imran', arti: 'Keluarga Imran', ayat: 200, juz: '3 - 4', arab: 'آل عمران' },
                { no: 36, nama: 'Yasin', arti: 'Yasin', ayat: 83, juz: '22 - 23', arab: 'يس' },
                { no: 55, nama: 'Ar-Rahman', arti: 'Yang Maha Pemurah', ayat: 78, juz: 27, arab: 'الرحمن' },
                { no: 56, nama: 'Al-Waqi'ah', arti: 'Hari Kiamat', ayat: 96, juz: 27, arab: 'واقعة' },
                { no: 67, nama: 'Al-Mulk', arti: 'Kerajaan', ayat: 30, juz: 29, arab: 'الملك' },
                { no: 112, nama: 'Al-Ikhlas', arti: 'Keesaan Allah', ayat: 4, juz: 30, arab: 'الإخلاص' }
            ];

            const handleSelect = (s) => {
                setSelectedSurah(s);
                setLoading(true);
                fetch(`https://api.alquran.cloud/v1/surah/${s.no}/editions/quran-uthmani,id.indonesian`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.data) {
                            const ar = data.data[0].ayahs;
                            const id = data.data[1].ayahs;
                            setAyahs(ar.map((item, idx) => ({
                                no: item.numberInSurah,
                                arab: item.text,
                                arti: id[idx] ? id[idx].text : ''
                            })));
                        }
                        setLoading(false);
                    })
                    .catch(() => {
                        showToast('Gagal memuat ayat Quran', 'error');
                        setLoading(false);
                    });
            };

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    {!selectedSurah ? (
                        <>
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div>
                                    <h2 className="text-base font-bold text-slate-800">Al-Quran Digital</h2>
                                    <p className="text-xs text-slate-500">Pilih surah untuk membaca teks Arab dan terjemahannya.</p>
                                </div>
                                <input type="text" placeholder="Cari surah..." value={search} onChange={e => setSearch(e.target.value)} className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs w-full md:w-64" />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                {daftarSurah.filter(s => s.nama.toLowerCase().includes(search.toLowerCase())).map(s => (
                                    <div key={s.no} onClick={() => handleSelect(s)} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 hover:bg-slate-100 cursor-pointer transition flex justify-between items-center">
                                        <div>
                                            <div className="flex items-center space-x-2">
                                                <span className="w-6 h-6 bg-emerald-600 text-white rounded-full flex items-center justify-center text-[10px] font-bold">{s.no}</span>
                                                <h3 className="font-bold text-slate-800 text-xs">{s.nama}</h3>
                                            </div>
                                            <p className="text-[10px] text-slate-500 mt-1">Arti: {s.arti} ({s.ayat} Ayat)</p>
                                        </div>
                                        <span className="text-lg font-serif text-emerald-700">{s.arab}</span>
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : (
                        <div className="space-y-4">
                            <button onClick={() => setSelectedSurah(null)} className="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-xl font-semibold transition">← Kembali</button>
                            <div className="border-b pb-3">
                                <h2 className="text-base font-bold text-slate-800">{selectedSurah.no}. {selectedSurah.nama} ({selectedSurah.arab})</h2>
                                <p className="text-xs text-slate-500">Arti: {selectedSurah.arti} | Juz {selectedSurah.juz}</p>
                            </div>
                            {loading ? <p className="text-xs text-center py-8">Memuat ayat...</p> : (
                                <div className="space-y-4">
                                    {ayahs.map(a => (
                                        <div key={a.no} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                                            <span className="w-6 h-6 bg-slate-800 text-white rounded-full flex items-center justify-center text-[10px] font-bold">{a.no}</span>
                                            <p className="text-xl text-right font-serif text-slate-900 leading-loose">{a.arab}</p>
                                            <p className="text-xs text-slate-600"><strong>Artinya:</strong> {a.arti}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function ZakatModule() {
            const [jenis, setJenis] = useState('penghasilan');
            const [nominal, setNominal] = useState('');
            const [jiwa, setJiwa] = useState(1);

            const hitung = () => {
                const val = parseFloat(nominal) || 0;
                if (jenis === 'penghasilan') return val >= 6000000 ? val * 0.025 : 0;
                if (jenis === 'maal') return val >= 85000000 ? val * 0.025 : 0;
                if (jenis === 'fitrah') return (parseInt(jiwa) || 1) * 2.5 * 15000;
                return 0;
            };

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6 max-w-xl mx-auto">
                    <h2 className="text-base font-bold text-slate-800">Kalkulator Zakat Digital</h2>
                    <div className="flex gap-2">
                        <button onClick={() => setJenis('penghasilan')} className={`flex-1 py-2 rounded-xl text-xs font-semibold ${jenis === 'penghasilan' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>Penghasilan</button>
                        <button onClick={() => setJenis('maal')} className={`flex-1 py-2 rounded-xl text-xs font-semibold ${jenis === 'maal' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>Maal</button>
                        <button onClick={() => setJenis('fitrah')} className={`flex-1 py-2 rounded-xl text-xs font-semibold ${jenis === 'fitrah' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>Fitrah</button>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-4">
                        {jenis !== 'fitrah' ? (
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Pendapatan/Harta (Rp)</label>
                                <input type="number" className="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs" value={nominal} onChange={e => setNominal(e.target.value)} placeholder="Contoh: 10000000" />
                            </div>
                        ) : (
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Jumlah Anggota Keluarga (Jiwa)</label>
                                <input type="number" min="1" className="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs" value={jiwa} onChange={e => setJiwa(e.target.value)} />
                            </div>
                        )}
                        <div className="p-4 bg-white rounded-xl border border-slate-200 text-center">
                            <span className="text-xs text-slate-500 block">Estimasi Zakat yang Harus Dibayar:</span>
                            <span className="text-lg font-extrabold text-emerald-600 mt-1 block">Rp {hitung().toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                </div>
            );
        }

        function KiblatModule() {
            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 text-center space-y-4 max-w-md mx-auto">
                    <h2 className="text-base font-bold text-slate-800">Arah Kiblat Digital</h2>
                    <div className="p-6 bg-slate-900 text-white rounded-2xl space-y-4">
                        <div className="w-24 h-24 mx-auto rounded-full border-4 border-amber-400 flex items-center justify-center bg-slate-800 relative shadow-inner">
                            <div className="absolute w-1.5 h-10 bg-amber-400 top-2 rounded-full transform -rotate-45 origin-bottom"></div>
                        </div>
                        <p className="text-xs text-slate-300">Masjid Al-Muhajirin Wawonasa, Manado</p>
                        <p className="text-sm font-mono font-bold text-amber-400">Azimuth: 291.5° (Barat Laut)</p>
                    </div>
                </div>
            );
        }

        function DzikirModule() {
            const list = [
                { judul: 'Doa Iftitah', arab: 'اللَّهُ أَكْبَرُ كَبِيرًا وَالْحَمْدُ لِلَّهِ كَثِيرًا...', arti: 'Allah Maha Besar dengan sebesar-besarnya...' },
                { judul: 'Doa Ruku', arab: 'سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ', arti: 'Maha Suci Tuhanku Yang Maha Agung...' },
                { judul: 'Doa Sujud', arab: 'سُبْحَانَ رَبِّيَ الأَعْلَى وَبِحَمْدِهِ', arti: 'Maha Suci Tuhanku Yang Maha Tinggi...' }
            ];
            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4 max-w-2xl mx-auto">
                    <h2 className="text-base font-bold text-slate-800">Dzikir & Doa Harian</h2>
                    <div className="space-y-3">
                        {list.map((d, i) => (
                            <div key={i} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                <h3 className="font-bold text-slate-800 text-xs">{d.judul}</h3>
                                <p className="text-lg text-right font-serif text-slate-900">{d.arab}</p>
                                <p className="text-xs text-slate-600 italic">"{d.arti}"</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function IqraModule() {
            const [jilid, setJilid] = useState(1);
            const data = {
                1: ['أَ', 'بَ', 'تَ', 'ثَ', 'جَ', 'حَ'],
                2: ['بَا', 'تَا', 'ثَا', 'جَا', 'حَا', 'خَا'],
                3: ['بِ - بُ', 'تِ - تُ', 'ثِ - ثُ', 'كِتَابُ', 'عَلِيمٌ']
            };
            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4 max-w-xl mx-auto">
                    <h2 className="text-base font-bold text-slate-800">Materi Iqra Digital</h2>
                    <div className="flex gap-2">
                        {[1, 2, 3].map(j => (
                            <button key={j} onClick={() => setJilid(j)} className={`px-4 py-2 rounded-xl text-xs font-semibold ${jilid === j ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}>Jilid {j}</button>
                        ))}
                    </div>
                    <div className="grid grid-cols-3 gap-3">
                        {(data[jilid] || data[1]).map((c, i) => (
                            <div key={i} className="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-center font-serif text-2xl font-bold text-slate-900">{c}</div>
                        ))}
                    </div>
                </div>
            );
        }

        function StrukturModule({ struktur, setStrukturBTM, user, showToast }) {
            const [edit, setEdit] = useState(false);
            const [form, setForm] = useState(struktur);

            const handleSave = (e) => {
                e.preventDefault();
                setStrukturBTM(form);
                setEdit(false);
                showToast('Struktur pengurus berhasil diperbarui');
            };

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-base font-bold text-slate-800">Struktur Pengurus BTM</h2>
                        {user.role === 'super_admin' && (
                            <button onClick={() => setEdit(!edit)} className="bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">{edit ? 'Batal' : 'Ubah Struktur'}</button>
                        )}
                    </div>

                    {edit ? (
                        <form onSubmit={handleSave} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-3">
                            {Object.keys(form).map(k => (
                                <div key={k}>
                                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">{k}</label>
                                    <input type="text" className="w-full bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form[k]} onChange={e => setForm({...form, [k]: e.target.value})} />
                                </div>
                            ))}
                            <button type="submit" className="md:col-span-2 bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-semibold">Simpan Struktur</button>
                        </form>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            {Object.entries(struktur).map(([k, v]) => (
                                <div key={k} className="p-3.5 bg-slate-50 rounded-xl border border-slate-200">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase block">{k}</span>
                                    <span className="text-xs font-bold text-slate-800 mt-0.5 block">{v}</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function KeuanganModule({ keuangan, setKeuangan, user, showToast }) {
            const [form, setForm] = useState({ tanggal: '', uraian: '', masuk: 0, keluar: 0 });

            const handleAdd = (e) => {
                e.preventDefault();
                if (user.role !== 'super_admin') {
                    showToast('Akses ditolak! Hanya Super Admin.', 'error');
                    return;
                }
                const last = keuangan.length > 0 ? keuangan[keuangan.length - 1].saldo : 0;
                const m = parseFloat(form.masuk) || 0;
                const k = parseFloat(form.keluar) || 0;
                setKeuangan([...keuangan, {
                    id: keuangan.length + 1,
                    tanggal: form.tanggal || new Date().toISOString().split('T')[0],
                    uraian: form.uraian,
                    masuk: m, keluar: k,
                    saldo: last + m - k
                }]);
                setForm({ tanggal: '', uraian: '', masuk: 0, keluar: 0 });
                showToast('Transaksi berhasil dicatat');
            };

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <h2 className="text-base font-bold text-slate-800">Laporan Keuangan Masjid</h2>
                    {user.role === 'super_admin' && (
                        <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                            <input type="date" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.tanggal} onChange={e => setForm({...form, tanggal: e.target.value})} />
                            <input type="text" placeholder="Uraian transaksi..." className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.uraian} onChange={e => setForm({...form, uraian: e.target.value})} required />
                            <input type="number" placeholder="Nominal (Masuk)" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.masuk} onChange={e => setForm({...form, masuk: e.target.value})} />
                            <button type="submit" className="bg-emerald-600 text-white rounded-xl text-xs font-semibold py-2">Tambah</button>
                        </form>
                    )}
                    <div className="overflow-x-auto">
                        <table className="w-full text-xs text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-100 text-slate-700 uppercase text-[10px]">
                                    <th className="p-3">Tanggal</th>
                                    <th className="p-3">Uraian</th>
                                    <th className="p-3">Masuk</th>
                                    <th className="p-3">Keluar</th>
                                    <th className="p-3">Saldo</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                                {keuangan.map(item => (
                                    <tr key={item.id} className="hover:bg-slate-50">
                                        <td className="p-3">{item.tanggal}</td>
                                        <td className="p-3 font-medium text-slate-800">{item.uraian}</td>
                                        <td className="p-3 text-emerald-600 font-semibold">Rp {item.masuk.toLocaleString()}</td>
                                        <td className="p-3 text-rose-600 font-semibold">Rp {item.keluar.toLocaleString()}</td>
                                        <td className="p-3 font-bold text-slate-900">Rp {item.saldo.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function JamaahModule({ jamaahList, setJamaahList, user, showToast }) {
            const [search, setSearch] = useState('');
            const [form, setForm] = useState({ no_kk: '', nama: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
            const [editIdx, setEditIdx] = useState(null);

            const handleSave = (e) => {
                e.preventDefault();
                if (user.role !== 'super_admin') {
                    showToast('Akses ditolak!', 'error');
                    return;
                }
                if (editIdx !== null) {
                    const updated = [...jamaahList];
                    updated[editIdx] = { ...form, jumlah: parseInt(form.jumlah) || 1 };
                    setJamaahList(updated);
                    setEditIdx(null);
                    showToast('Data jamaah diperbarui');
                } else {
                    if (jamaahList.some(j => j.no_kk === form.no_kk)) {
                        showToast('No KK sudah terdaftar', 'error');
                        return;
                    }
                    setJamaahList([...jamaahList, { ...form, jumlah: parseInt(form.jumlah) || 1 }]);
                    showToast('Data jamaah ditambahkan');
                }
                setForm({ no_kk: '', nama: '', hp: '', alamat: '', jumlah: 1, anggota: '', password: '' });
            };

            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-base font-bold text-slate-800">Data Kartu Keluarga Jamaah</h2>
                        <input type="text" placeholder="Cari jamaah..." value={search} onChange={e => setSearch(e.target.value)} className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs w-64" />
                    </div>

                    {user.role === 'super_admin' && (
                        <form onSubmit={handleSave} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                            <h3 className="text-xs font-bold text-slate-700">{editIdx !== null ? 'Edit Data Jamaah' : 'Tambah Keluarga Baru'}</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <input type="text" placeholder="No KK (Username)" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.no_kk} onChange={e => setForm({...form, no_kk: e.target.value})} required />
                                <input type="text" placeholder="Nama Kepala Keluarga" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.nama} onChange={e => setForm({...form, nama: e.target.value})} required />
                                <input type="password" placeholder="Password" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.password} onChange={e => setForm({...form, password: e.target.value})} required />
                                <input type="text" placeholder="No WhatsApp" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.hp} onChange={e => setForm({...form, hp: e.target.value})} />
                                <input type="text" placeholder="Alamat" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.alamat} onChange={e => setForm({...form, alamat: e.target.value})} />
                                <input type="text" placeholder="Anggota Keluarga" className="bg-white border border-slate-300 rounded-xl p-2 text-xs" value={form.anggota} onChange={e => setForm({...form, anggota: e.target.value})} />
                            </div>
                            <button type="submit" className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Simpan Data</button>
                        </form>
                    )}

                    <div className="overflow-x-auto">
                        <table className="w-full text-xs text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-100 text-slate-700 uppercase text-[10px]">
                                    <th className="p-3">No KK</th>
                                    <th className="p-3">Kepala Keluarga</th>
                                    <th className="p-3">No WhatsApp</th>
                                    <th className="p-3">Alamat</th>
                                    <th className="p-3">Anggota</th>
                                    {user.role === 'super_admin' && <th className="p-3">Aksi</th>}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                                {jamaahList.filter(j => j.nama.toLowerCase().includes(search.toLowerCase()) || j.no_kk.includes(search)).map((item, idx) => (
                                    <tr key={idx} className="hover:bg-slate-50">
                                        <td className="p-3 font-mono font-semibold text-emerald-600">{item.no_kk}</td>
                                        <td className="p-3 font-bold text-slate-800">{item.nama}</td>
                                        <td className="p-3">{item.hp}</td>
                                        <td className="p-3">{item.alamat}</td>
                                        <td className="p-3">{item.anggota}</td>
                                        {user.role === 'super_admin' && (
                                            <td className="p-3 space-x-2">
                                                <button onClick={() => { setForm(item); setEditIdx(idx); }} className="bg-blue-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold">Edit</button>
                                                <button onClick={() => { setJamaahList(jamaahList.filter((_, i) => i !== idx)); showToast('Data dihapus'); }} className="bg-rose-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold">Hapus</button>
                                            </td>
                                        )}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
